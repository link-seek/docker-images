name: bake-tools
# 薄调用：opencode-tools 只声明参数，构建/自检/细测/转正逻辑全在 bake-stack.yml（共用骨架）。
# 商家线（bake）：对镜像运行结果负责；快递（infra deliver-*）只管送达，不管内容。
#
# 版本：opencode_tag / opencode_mem_version 全由手动 dispatch 必填传入（Dockerfile 默认值只给本地构建兜底）。
# mem 走普通 build-args 透传（不占上游槽位；Dockerfile pin 是唯一真相，dispatch 传的值必须与之同值，
# goss 用同一值校验，传错即红）。opencode 二进制 404 由 build 期 curl 兜底 fail-closed。
# 骨架变更验证：从分支手动 dispatch 本 workflow（非 main 只试不发正式 tag）。
# E2E：e2e_cases 空=auto（Jev 按改动推断），skip=跳过，full=全跑，逗号名单=指定跑。

on:
  workflow_dispatch:
    inputs:
      opencode_tag:
        description: "官方 tag（必填，如 2.1.4，无 v 前缀也行）"
        required: true
        type: string
      opencode_mem_version:
        description: "记忆插件版本（必填，如 2.31.1，须与 Dockerfile/AGENTS pin 同值）"
        required: true
        type: string
      e2e_cases:
        description: "E2E 名单（空=auto Jev 推断；skip跳过；full全跑；逗号名单指定）"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - Dockerfile.opencode-tools
      - docker/opencode-tools/**
      - .github/workflows/bake-tools.yml
      - .github/workflows/bake-stack.yml

permissions:
  contents: read
  packages: write

jobs:
  release:
    # push 没有 dispatch 参数：直接跳过，正式构建只走手动 dispatch（版本必填）。
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: opencode-tools
      dockerfile: Dockerfile.opencode-tools
      ghcr_image: ghcr.io/link-seek/opencode-tools
      swr_image: swr.cn-north-9.myhuaweicloud.com/linkseed/opencode-tools
      tag_mode: explicit
      explicit_tag: ${{ inputs.opencode_tag }}
      build_args: |
        OPENCODE_TAG=${{ inputs.opencode_tag }}
        OPENCODE_MEM_VERSION=${{ inputs.opencode_mem_version }}
      infra_stack_dir: stacks/opencode/hw21
      canary_name: opencode-prod-canary
      fine_test_hook: docker/opencode-tools/fine-test.sh
      goss_dir: docker/opencode-tools
      goss_vars: |
        MEM_PIN: "${{ inputs.opencode_mem_version }}"
      goss_docker_args: --network host -e OPENCODE_SERVER_PASSWORD=gate-dummy
      goss_command: serve --port 4096 --hostname 127.0.0.1
      e2e_cases: ${{ inputs.e2e_cases }}
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
