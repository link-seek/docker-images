name: bake-tools
# 薄调用：opencode-tools 只声明参数，构建/自检/细测/转正逻辑全在 bake-stack.yml（共用骨架）。
# 商家线（bake）：对镜像运行结果负责；快递（infra deliver-*）只管送达，不管内容。
#
# 版本：opencode_tag 由手动 dispatch 必填传入（Dockerfile 默认值只给本地构建兜底）。
# mem 版本单源头：只 Dockerfile 的 ARG OPENCODE_MEM_VERSION 一处定义，
# 触发层不传（构建用默认值），jsonc 占位符由构建 sed 注入；升 mem = 改 ARG 一行。
# opencode 二进制 404 由 build 期 curl 兜底 fail-closed。
# 骨架变更验证：从分支手动 dispatch 本 workflow（非 main 只试不发正式 tag）。
# E2E：e2e_cases 空=full（默认全量），skip=跳过，full=全跑，逗号名单指定跑；Jev 已退役。

on:
  workflow_dispatch:
    inputs:
      opencode_tag:
        description: "官方 tag（必填，如 2.1.4，无 v 前缀也行）"
        required: true
        type: string
      e2e_cases:
        description: "E2E 名单（空=full 全量；skip跳过；full全跑；逗号名单指定）"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - docker/opencode-tools/Dockerfile
      - docker/opencode-tools/**
      - .github/workflows/bake-tools.yml
      - .github/workflows/bake-stack.yml

permissions:
  contents: read
  packages: write

jobs:
  release:
    # push 没有 dispatch 参数：直接跳过，正式构建只走手动 dispatch（版本必填）。
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: opencode-tools
      dockerfile: docker/opencode-tools/Dockerfile
      ghcr_image: ghcr.io/link-seek/opencode-tools
      swr_image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools
      tag_mode: explicit
      explicit_tag: ${{ inputs.opencode_tag }}
      build_args: |
        OPENCODE_TAG=${{ inputs.opencode_tag }}
      push_temp_to_ghcr: true
      ghcr_temp_only: true
      k8s_app: opencode
      k8s_manifest_repo: "" # 同仓：manifest 已搬进本仓 k8s/（#461）
      k8s_manifest_path: k8s/opencode
      k8s_manifest_ref: main
      k8s_image_names: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools
      k8s_secret_env_file: docker/opencode-tools/preflight-env.conf
      k8s_secret_name: opencode-env
      k8s_namespace: opencode
      fine_test_hook: docker/opencode-tools/fine-test.sh
      goss_dir: docker/opencode-tools
      goss_docker_args: --network host -e OPENCODE_SERVER_PASSWORD=gate-dummy
      goss_command: serve --port 4096 --hostname 127.0.0.1
      e2e_cases: ${{ inputs.e2e_cases }}
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      ENV_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
      ALI_AK: ${{ secrets.ALI_AK }}
      ALI_SK: ${{ secrets.ALI_SK }}
