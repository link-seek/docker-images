name: bake-tools
# 商家线（bake）：对镜像运行结果负责；快递（infra deliver-*）只管送达，不管内容。

# opencode-tools（glibc 线）构建与发布：ubuntu:24.04 digest pin + 官方 release 二进制 + 工具层 + 记忆插件。
# 单 runner 全链：build（记 digest，只推 temp tag）→ 本机加网+sshd → infra 部署到本机标签（只装+启动自测）
#   → 本地细测（直连 canary：就绪+镜像 ID；drain 在无网关 img 机跳过，prod 全量覆盖）→ 绿才 push 正式版 + pin 回写。
# 触发：每周一巡检上游 tag（只采用发布超 3 天且二进制资产存在的）＋ main push（Dockerfile/烘焙文件/workflow 本身）＋ 手动。
# 命名：ghcr.io/link-seek/opencode-tools（保留，包已存在可推） + SWR north-9 linkseed（组织命名空间统一）。
on:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]
    paths:
      - Dockerfile.opencode-tools
      - docker/opencode-tools/**
      - .github/workflows/bake-tools.yml
  workflow_dispatch:
    inputs:
      opencode_tag:
        description: "官方 tag（空则自动取最新，如 2.0.29，无 v 前缀也行）"
        required: false
        default: ""

permissions:
  contents: write # 回写 .upstream-tools-tag
  packages: write # push ghcr.io/link-seek/opencode-tools

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/link-seek/opencode-tools
  SWR_REGISTRY: swr.cn-north-9.myhuaweicloud.com
  SWR_IMAGE: swr.cn-north-9.myhuaweicloud.com/linkseed/opencode-tools
  IMG_KEY_TTL: "21600" # 临 key 有效期 6h（实测稳定后收紧）；无 tag + preauthorized，用完即废

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag (>3d + 二进制资产存在）
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          normalize() { echo "${1#v}"; }
          tag_date() {
            gh api "repos/anomalyco/opencode/commits/$1" --jq '.commit.committer.date' 2>/dev/null
          }
          if [ -n "${{ inputs.opencode_tag }}" ]; then
            TAG="$(normalize "${{ inputs.opencode_tag }}")"
          else
            CUTOFF="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            TAG=""
            while read -r T S; do
              D="$(tag_date "$S")"
              [ -z "$D" ] && continue
              if [[ "$D" < "$CUTOFF" ]]; then TAG="$T"; break; fi
              echo "skip $T ($D, too fresh)"
            done < <(gh api 'repos/anomalyco/opencode/tags?per_page=20' \
              --jq '[.[] | {tag: .name | ltrimstr("v"), sha: .commit.sha} | select(.tag | test("^2\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tag | split(".") | map(tonumber)) | reverse | .[] | "\(.tag) \(.sha)"' | head -5)
          fi
          [ -z "$TAG" ] && { echo "no tag older than 3 days."; exit 1; }
          # 二进制资产必须存在（x64 baseline；tag 无 release 资产就地报错，不静默）
          curl -fsSL -o /dev/null "https://opencode.ai/files/bin/${TAG}/opencode-linux-x64-baseline.tar.gz" \
            || { echo "binary asset missing for ${TAG}"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${TAG}"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u github-actions --password-stdin

      - name: Login to SWR
        run: echo "${{ secrets.SWR_LOGIN_PASS }}" | docker login ${{ env.SWR_REGISTRY }} -u "${{ secrets.SWR_LOGIN_USER }}" --password-stdin

      - name: Build（本地 tag，不推）
        id: build
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          PINNED="$(grep -oP '^ARG OPENCODE_TAG=\K.+' Dockerfile.opencode-tools | head -n1)"
          # 定时巡检无新上游时跳过： digest pin 指向即稳定版，周一重打只会制造无人引用的悬空 digest
          # （SWR 会 GC 未被 tag 引用的 manifest，旧 pin 当场腐坏）。push/dispatch 恒打（代码变了必须验）。
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$TAG" = "$PINNED" ]; then
            echo "schedule: upstream 无变化（$TAG），跳过重打，pin 保持有效"
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # 取较新者：手动 bump 超前时不降级（网关式每次都打 + 不开倒车）
          NEWER="$(printf '%s\n%s\n' "$TAG" "$PINNED" | sort -V | tail -n1)"
          if [ "$NEWER" != "$TAG" ]; then echo "pin $PINNED ahead of resolved $TAG, build pin instead"; TAG="$NEWER"; fi
          docker build --build-arg "OPENCODE_TAG=${TAG}" \
            -f Dockerfile.opencode-tools -t "${{ env.IMAGE }}:${TAG}" -t "${{ env.IMAGE }}:latest" .
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "built ${TAG}"

      - name: 成品自检（本地字节，不碰上游：版本＋插件＋起服＋工具）
        if: env.skip != 'true'
        run: |
          IMG="${{ env.IMAGE }}:${{ steps.build.outputs.tag }}"
          TAG="${{ steps.build.outputs.tag }}"
          MEM_PIN="$(grep -oP '^ARG OPENCODE_MEM_VERSION=\K.+' Dockerfile.opencode-tools | head -n1)"
          fails=0
          # 1. 版本 == TAG
          VER="$(docker run --rm "$IMG" --version 2>&1 | head -n1)"
          echo "version: $VER"
          echo "$VER" | grep -q "$TAG" || { echo "FAIL: 版本非 $TAG"; fails=1; }
          # 2. 插件烘入且 pin 对（与 Dockerfile 声明一致）
          PLUG="$(docker run --rm --entrypoint sh "$IMG" -c "grep -o 'opencode-mem@[0-9.]*' /root/.config/opencode/opencode.jsonc | head -n1")"
          echo "plugin: $PLUG"
          [ "$PLUG" = "opencode-mem@${MEM_PIN}" ] || { echo "FAIL: 插件非 opencode-mem@${MEM_PIN}"; fails=1; }
          # 2b. autoUpdate 必须关（验镜像内生效值，digest pin 流程不允许自更新）
          AU="$(docker run --rm --entrypoint sh "$IMG" -c "grep -o '\"autoUpdate\": *[a-z]*' /root/.config/opencode/opencode-mem.jsonc | head -n1")"
          echo "autoUpdate: $AU"
          echo "$AU" | grep -q 'false' || { echo "FAIL: autoUpdate 未关（$AU）"; fails=1; }
          # 3. serve 能起（4096，dummy 口令；通即过）
          docker run -d --name tools-gate --network host -e OPENCODE_SERVER_PASSWORD=gate-dummy "$IMG" serve --port 4096 --hostname 127.0.0.1
          ok=""
          for i in $(seq 1 12); do
            sleep 5
            curl -sf --max-time 5 http://127.0.0.1:4096/ >/dev/null 2>&1 && { ok=1; break; }
          done
          [ -n "$ok" ] || { echo "FAIL: serve 未起"; docker logs tools-gate --tail 20; fails=1; }
          docker rm -f tools-gate >/dev/null 2>&1 || true
          # 4. 工具 presence（parity 子集）
          for t in "node --version" "gh --version" "agent-browser --version" "tailscale version" "terraform version" "send-mail --help" "msmtp --version"; do
            docker run --rm --entrypoint sh "$IMG" -c "$t" >/dev/null 2>&1 || { echo "FAIL: $t 缺失"; fails=1; }
          done
          echo "tools presence OK"
          [ "$fails" = "0" ] && echo "SELFCHECK OK: tools 成品自检通过" || exit 1

      - name: Push temp tag（只发 ci-<run号>，正式版等细测绿了再转）
        id: push_temp
        if: env.skip != 'true'
        run: |
          TAG="${{ steps.build.outputs.tag }}"
          TEMP="ci-$GITHUB_RUN_ID"
          docker tag "${{ env.IMAGE }}:${TAG}" "${{ env.SWR_IMAGE }}:$TEMP"
          docker push "${{ env.SWR_IMAGE }}:$TEMP"
          DIGEST="$(docker buildx imagetools inspect "${{ env.SWR_IMAGE }}:$TEMP" --format '{{json .Manifest}}' | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")"
          echo "temp tag $TEMP -> $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: 本机加网（API token 现场 mint；mint-only，无直连回退）
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          IMG_TAG="img-$GITHUB_RUN_ID"
          echo "IMG_TAG=$IMG_TAG" >> "$GITHUB_ENV"
          MINTED=""
          TSKEY="${{ vars.TS_API_KEY }}${{ secrets.TS_API_KEY }}"
          [ -z "$TSKEY" ] || echo "::add-mask::$TSKEY"
          if [ -n "$TSKEY" ]; then
            MINT_BODY="{\"capabilities\":{\"devices\":{\"create\":{\"reusable\":false,\"ephemeral\":true,\"preauthorized\":true,\"tags\":[\"tag:ci\"]}}},\"expirySeconds\":${{ env.IMG_KEY_TTL }}}"
            # tag:ci：与部署方同一身份（ACL 里 tagOwners 已定义）；寻址仍走 host:
            MINT_RESP="$(mktemp)"
            MINT_CODE="$(curl -sS -m 30 -o "$MINT_RESP" -w '%{http_code}' -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
              -d "$MINT_BODY" \
              https://api.tailscale.com/api/v2/tailnet/-/keys 2>/tmp/mint.err || true)"
            if [ "$MINT_CODE" = "200" ] || [ "$MINT_CODE" = "201" ]; then
              echo "mint-bearer: HTTP $MINT_CODE（包体已遮蔽，内含 key）"
              MINTED="$(python3 -c "import json; print(json.load(open('$MINT_RESP')).get('key',''))" || true)"
              [ -n "$MINTED" ] && echo "::add-mask::$MINTED"
            else
              echo "mint-bearer: HTTP $MINT_CODE body: $(head -c 400 "$MINT_RESP")"
            fi
            if [ -z "$MINTED" ]; then
              MINT_CODE2="$(curl -sS -m 30 -o "$MINT_RESP" -w '%{http_code}' -X POST -u "$TSKEY:" -H 'Content-Type: application/json' \
                -d "$MINT_BODY" \
                https://api.tailscale.com/api/v2/tailnet/-/keys 2>/tmp/mint.err || true)"
              if [ "$MINT_CODE2" = "200" ] || [ "$MINT_CODE2" = "201" ]; then
                echo "mint-basic: HTTP $MINT_CODE2（包体已遮蔽，内含 key）"
                MINTED="$(python3 -c "import json; print(json.load(open('$MINT_RESP')).get('key',''))" || true)"
                [ -n "$MINTED" ] && echo "::add-mask::$MINTED"
              else
                echo "mint-basic: HTTP $MINT_CODE2 body: $(head -c 400 "$MINT_RESP")"
              fi
            fi
            rm -f "$MINT_RESP"
            [ -n "$MINTED" ] || { echo "mint 被拒（Bearer 与 Basic 双试，见上两行包体）"; }
          fi
          if [ -n "$MINTED" ]; then
            echo "ephemeral key minted（tag:ci，有效期 ${{ env.IMG_KEY_TTL }}s）"
            # --ssh：infra 部署方（同为 tag:ci）直接 tailscale ssh 进来，不需要单次钥匙/sshd
            timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="$IMG_TAG" --ssh --accept-routes=false --accept-dns=false
          else
            echo "FAIL: 现场 mint 未成功（无 TS_API_KEY 或 Bearer/Basic 双试皆拒，见上）；本线 mint-only，不回退任何直连 key（含已退役的 TS_AUTHKEY）"
            exit 1
          fi
          set -x
          tailscale status --json | python3 -c "import json,sys; d=json.load(sys.stdin); print('self:', d.get('Self',{}).get('HostName'), d.get('Self',{}).get('Tags'))"

      - name: 触发 infra 部署到本机标签（opencode 栈，只装+启动自测）
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          START="$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"  # 回拨 5 分钟防时钟偏差误滤
          echo "START=$START" >> "$GITHUB_ENV"
          gh workflow run img-preflight.yml -R link-seek/infra \
            -f digest_or_tag="$DIGEST" \
            -f stack_dir=stacks/opencode-prod \
            -f node_tag="host:$IMG_TAG" \
            -f ssh_transport="tailscale"

      - name: 跨机可达性取证（非门：只记录，给 infra 连不进来定因用）
        if: env.skip != 'true'
        run: |
          set -uo pipefail
          echo "== netcheck（UDP/DERP 出向） =="
          tailscale netcheck --format=json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print('UDP:',d.get('UDP')); print('DERP_latency:', dict(list((d.get('DERPRegionLatency') or {}).items())[:6]))" || echo "netcheck 失败"
          echo "== 等 infra 节点出现并反向 ping（最多 8 分钟） =="
          PEER=""
          for i in $(seq 1 16); do
            sleep 30
            PEER="$(tailscale status --json 2>/dev/null | python3 -c "
          import json,sys
          try:
              ps = json.load(sys.stdin).get('Peer', {})
              for p in ps.values():
                  hn = p.get('HostName') or ''
                  if hn.startswith('ci-deploy-'):
                      print(hn + '=' + (p.get('TailscaleIPs') or ['?'])[0]); break
              else: print('')
          except Exception: print('')" || true)"
            [ -n "$PEER" ] && { echo "infra peer: $PEER"; break; }
            echo "infra 节点未出现（$i/16）"
          done
          [ -n "$PEER" ] || { echo "结论：infra 节点始终没进 tailnet 可见范围（控制面/审批嫌疑）"; exit 0; }
          IP="${PEER##*=}"
          tailscale ping -c 3 "$IP" 2>&1 | tail -n 5 || true
          (echo >/dev/tcp/$IP/22) 2>/dev/null && echo "反向 22 通（TS SSH）" || echo "反向 22 不通"
          exit 0

      - name: 轮询 infra 部署结论（fail-closed）
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 30); do
            sleep 60
            RUN_ID="$(timeout 60 gh api "repos/link-seek/infra/actions/workflows/img-preflight.yml/runs?event=workflow_dispatch&per_page=10" \
              -q "[.workflow_runs | sort_by(.created_at) | reverse[] | select(.created_at >= \"$START\") | .id] | first // empty" 2>/dev/null || true)"
            [ -n "$RUN_ID" ] && break
          done
          [ -n "$RUN_ID" ] || { echo "FAIL: 预检 run 30 分钟未出现"; exit 1; }
          echo "preflight run: https://github.com/link-seek/infra/actions/runs/$RUN_ID"
          timeout 1800 gh run watch "$RUN_ID" -R link-seek/infra --interval 20 --exit-status \
            || { echo "FAIL: 预检未过（PREFLIGHT-RED，见上 run 链接）"; exit 1; }
          echo PREFLIGHT-GREEN

      - name: 本地细测（直连 canary：就绪+镜像 ID；drain 在无网关 img 机由脚本自判跳过）
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          # canary 由 infra 装在本机（脚本在目标机 /tmp/ 下，core 每次部署都 scp；canary 跑在本地 docker，直接打桥上 IP）
          RDIR=/root/stacks/opencode-prod
          sudo -E PROBE_LEVEL=full REMOTE_DIR="$RDIR" CANDIDATE_DIGEST="$DIGEST" bash /tmp/canary-probe.sh
          echo "DETAIL OK: 细测通过（drain 在 img 机无网关则跳过，prod 全量覆盖）"

      - name: temp digest 转正式版（retag 不 rebuild）
        if: env.skip != 'true'
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          # SWR 为主先推（部署只认 SWR）；GHCR 硬推，红即修（用户要求保留）
          for t in "${TAG}" latest; do
            docker buildx imagetools create -t "${{ env.SWR_IMAGE }}:${t}" "${{ env.SWR_IMAGE }}@$DIGEST"
          done
          docker buildx imagetools create -t "${{ env.IMAGE }}:${TAG}" -t "${{ env.IMAGE }}:latest" "${{ env.SWR_IMAGE }}@$DIGEST"
          echo "released $TAG $DIGEST"

      - name: 下线收尾（无条件 logout：ephemeral 节点注销，不留 Expired 尸体）
        if: always() && env.skip != 'true'
        run: |
          sudo tailscale logout || true
          docker logout "$(echo '${{ env.SWR_IMAGE }}' | cut -d/ -f1)" || true
          echo logged-out

      - name: Commit pin
        if: env.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile.opencode-tools .upstream-tools-tag
          git diff --cached --quiet || git commit -m "chore(tools): 跟进 opencode ${{ steps.build.outputs.tag }}"
          git push
