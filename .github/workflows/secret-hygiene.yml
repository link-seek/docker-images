name: secret-hygiene

# 本仓 public：一粒真值都不能进。key/token/私钥头出现即红。
# 占位符（<...>、example、注释说明）不在此限；误报请改写措辞，不要加例外。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 真值扫描
        run: |
          # 显式占位符白名单（透明代理 dummy key，见 litellm_config.yaml 注释；零密钥语义）
          if grep -rniE '(sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|AKIA[0-9A-Z]{16}|LTAI[A-Za-z0-9]{12,}|AIza[A-Za-z0-9_-]{20,}|xox[bap]-[A-Za-z0-9-]+|-----BEGIN [A-Z ]*PRIVATE KEY-----|tskey-auth-[A-Za-z0-9_-]+|tskey-api-[A-Za-z0-9_-]+|AGE-SECRET-KEY-[A-Z0-9]+)' \
              --exclude-dir=.git . | grep -viE 'dummy|overridden-by-callback|example|test-only|<redacted>|YOUR_|CHANGEME|xxx'; then
            echo "FAIL: 疑似真值进仓，先轮换再重写历史"; exit 1
          fi
          echo "OK: no live secrets"
