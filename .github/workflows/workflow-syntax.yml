name: workflow-syntax

# workflow 静态校验：用 actionlint（社区长期维护）取代自研 YAML 解析。
# 覆盖表达式/上下文/私有 action 输入/needs 等；shellcheck/pyflakes 暂关，避免存量脚本风格噪声。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2.2.0
        with:
          version: 1.7.12
          shellcheck: false
          pyflakes: false
