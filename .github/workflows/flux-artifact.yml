name: flux-artifact

# 把 docker-images 仓打成 Flux OCI 制品推到 SWR（Gitless GitOps 的投递端）。
# 集群用 OCIRepository 从 SWR 拉，避免 Flux 直连 github.com（国内 DNS 污染/TLS 超时）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flux-artifact
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REG: swr.cn-north-9.myhuaweicloud.com/link-seek
      DEST: swr.cn-north-9.myhuaweicloud.com/link-seek/docker-images-manifests
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      AK: ${{ secrets.PROD_HCLOUD_AK }}
      SK: ${{ secrets.PROD_HCLOUD_SK }}
    steps:
      - uses: actions/checkout@v4

      - name: install flux CLI
        run: curl -fsSL https://fluxcd.io/install.sh | sudo bash

      - name: install skopeo (digest 读取)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq skopeo

      - name: login + push OCI artifact
        run: |
          set -euo pipefail
          echo "$SWR_LOGIN_PASS" | docker login "$REG" -u "$SWR_LOGIN_USER" --password-stdin
          REV="main@sha1:$(git rev-parse HEAD)"
          TAG="v$(date -u +%Y.%m.%d)-$(git rev-parse --short=7 HEAD)"
          # 制品只装部署清单（k8s/**）：digest 变化 == 一次部署变更，而不是任意 commit 快照。
          flux push artifact "oci://$DEST:latest" \
            --path=. \
            --source="$(git config --get remote.origin.url)" \
            --revision="$REV" \
            --ignore-paths '.git/**,agent-out/**,docker/**,.github/**,images/**,scripts/**,docs/**,**/*.md,opencode.json,.opencode/**'
          # 不可变发布 tag：同 tag 不允许换 digest。
          if flux tag artifact "oci://$DEST:latest" --tag "$TAG" 2>/tmp/tag.err; then
            echo "tagged immutable: $TAG"
          else
            echo "tag $TAG exists; verifying digest"
            EXISTING="$(skopeo inspect --format '{{.Digest}}' "docker://$DEST:$TAG" || true)"
            CURRENT="$(skopeo inspect --format '{{.Digest}}' "docker://$DEST:latest")"
            if [ -z "$EXISTING" ] || [ "$EXISTING" != "$CURRENT" ]; then
              echo "FATAL: immutable tag $TAG points to a different digest ($EXISTING != $CURRENT)"; cat /tmp/tag.err || true; exit 1
            fi
            echo "tag $TAG unchanged ($CURRENT)"
          fi
          DIGEST="$(skopeo inspect --format '{{.Digest}}' "docker://$DEST:$TAG")"
          test -n "$DIGEST"
          {
            echo "### release"
            echo "- tag: \`$TAG\`"
            echo "- digest: \`$DIGEST\`"
            echo "- revision: \`$REV\`"
            echo ""
            echo "pin in infra: \`ref: { digest: $DIGEST }\`"
          } >> "$GITHUB_STEP_SUMMARY"
          docker logout "$REG" >/dev/null 2>&1 || true

      - name: make SWR repo public (cluster pulls anonymously)
        if: always()
        env:
          AK: ${{ secrets.PROD_HCLOUD_AK }}
          SK: ${{ secrets.PROD_HCLOUD_SK }}
        run: |
          python3 - <<'PY'
          import os,hashlib,hmac,datetime,json,urllib.request,urllib.error
          AK=os.environ["AK"].strip(); SK=os.environ["SK"].strip()
          HOST="swr-api.cn-north-9.myhuaweicloud.com"
          BASE="/v2/manage/namespaces/link-seek/repos/docker-images-manifests"
          def sign(method,canon,req,body):
              t=datetime.datetime.utcnow().strftime('%Y%m%dT%H%M%SZ')
              ph=hashlib.sha256(body).hexdigest()
              ch=f"host:{HOST}\nx-sdk-date:{t}\n"; sh="host;x-sdk-date"
              cr=f"{method}\n{canon}\n\n{ch}\n{sh}\n{ph}"
              sts=f"SDK-HMAC-SHA256\n{t}\n{hashlib.sha256(cr.encode()).hexdigest()}"
              sig=hmac.new(SK.encode(),sts.encode(),hashlib.sha256).hexdigest()
              hdr={"Host":HOST,"X-Sdk-Date":t,"Content-Type":"application/json",
                   "Authorization":f"SDK-HMAC-SHA256 Access={AK}, SignedHeaders={sh}, Signature={sig}"}
              return hdr,req
          body=json.dumps({"is_public":True}).encode()
          h,p=sign("PATCH",BASE+"/",BASE,body)
          try:
              r=urllib.request.urlopen(urllib.request.Request("https://"+HOST+p,data=body,method="PATCH",headers=h),timeout=30)
              print("make-public:",r.status)
          except urllib.error.HTTPError as e:
              print("make-public HTTP",e.code,e.read().decode()[:200])
          PY
