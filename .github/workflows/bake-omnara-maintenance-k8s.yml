name: bake-omnara-maintenance-k8s
# fork kubernetes-provider 分支源码构建的 maintenance 试用镜像。
# k8s_app 留空跳过预检（试用镜像不上 Flux pin，由 kubectl 试装验证）。

on:
  workflow_dispatch:
    inputs:
      fork_tag:
        description: "版本 tag（如 v0.2.27-k8s.4）"
        required: false
        type: string
        default: "v0.2.27-k8s.1"
      fork_branch:
        description: "fork 分支（默认 kubernetes-provider）"
        required: false
        type: string
        default: "kubernetes-provider"
      fork_sha:
        description: "fork commit sha（空=分支尖，可复现时填）"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - docker/omnara-maintenance-k8s/fine-test.sh
      - .github/workflows/bake-omnara-maintenance-k8s.yml
      - .github/workflows/bake-stack.yml

permissions:
  contents: read
  packages: write

jobs:
  release:
    # push 没有 dispatch 参数：直接跳过，正式构建只走手动 dispatch（版本必填）。
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: omnara-maintenance-k8s
      # 正本在 fork 仓：sync 上游 Dockerfile 原样构建，不在本仓养手抄 Dockerfile。
      sync_from_repo: xieyucheng123/omnara
      sync_ref: ${{ inputs.fork_sha != '' && inputs.fork_sha || inputs.fork_branch }}
      dockerfile: infra-src/Dockerfile
      build_context: infra-src
      build_target: maintenance
      ghcr_image: ghcr.io/link-seek/omnara-maintenance-k8s
      swr_image: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-maintenance-k8s
      tag_mode: explicit
      explicit_tag: ${{ inputs.fork_tag }}
      verification: full
      fine_test_hook: docker/omnara-maintenance-k8s/fine-test.sh
      layer_size_limit_mb: "1200"
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
