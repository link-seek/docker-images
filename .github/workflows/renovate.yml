name: renovate

# 自托管 Renovate（社区维护）：版本/依赖升级自动开 PR（人审合）。
# 用 RENOVATE_TOKEN（专用 PAT，推荐）或组织级 AGENT_GITHUB_TOKEN 兜底。
# 注意：若同时启用托管 Renovate App 会双跑，建议卸载 App。
on:
  schedule:
    - cron: "0 3 * * *"   # 每日 11:00 CST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.15
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ENDPOINT: https://api.github.com
          LOG_LEVEL: info
          SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
        with:
          token: ${{ secrets.RENOVATE_TOKEN || secrets.AGENT_GITHUB_TOKEN }}
          configurationFile: renovate.json
