name: bake-od
# 商家线（bake）：对镜像运行结果负责；快递（infra deliver-*）只管送达，不管内容。

# 薄调用：OD 镜像只声明参数，构建/细测/转正逻辑全在 bake-stack.yml（共用骨架），照 bake-gateway。
# 版本全由手动 dispatch 必填传入（Dockerfile 默认值只给本地构建兜底）；combo 在薄调用组装后直传
# explicit tag。审计靠 run 日志：不落 pin、不 sync-back；周一上游巡检已关。
# 构建后先推 ci-<run> temp tag；细测（SWR 候选校验 + 产品 e2e）绿了才转正式 tag/latest（红不转）。
# push 触发保留占位，但版本必须手传，空参数跳过（避免拿 Dockerfile 旧默认值覆盖 latest）。
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.opendesign
      - docker/opendesign/**
      - docker/opencode-shim
      - docker/opencode.jsonc
      - .github/workflows/bake-od.yml
      - .github/workflows/bake-stack.yml
  workflow_dispatch:
    inputs:
      od_tag:
        description: "上游 OD tag（必填，形如 0.26.0，无 v 前缀）"
        required: true
        type: string
      opencode_tag:
        description: "OpenCode 版本（必填，形如 2.0.6；须与 OD 版本对死）"
        required: true
        type: string

permissions:
  contents: read
  packages: write # push ghcr.io/link-seek/opendesign

jobs:
  release:
    # push 没有 dispatch 参数：直接跳过，正式构建只走手动 dispatch（版本必填）。
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: opendesign
      dockerfile: Dockerfile.opendesign
      ghcr_image: ghcr.io/link-seek/opendesign
      swr_image: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opendesign
      tag_mode: explicit
      explicit_tag: ${{ format('{0}-oc{1}', inputs.od_tag, inputs.opencode_tag) }}
      build_args: |
        OD_TAG=${{ inputs.od_tag }}
        OPENCODE_TAG=${{ inputs.opencode_tag }}
      push_temp_to_ghcr: true
      fine_test_hook: docker/opendesign/fine-test.sh
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
