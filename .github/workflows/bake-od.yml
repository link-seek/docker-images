name: bake-od
# 商家线（bake）：对镜像运行结果负责；快递（infra deliver-*）只管送达，不管内容。
#
# 薄调用：OD 镜像只声明参数，逻辑全在 bake-stack.yml（共用骨架），照 bake-gateway。
# OD 特有由骨架 combo 模式承接：
#   - 上游 nexu-io/od GHCR tag 巡检（只采用发布超 3 天的，周一 02:00 UTC）
#   - combo tag：<od>-oc<opencode>；OD_TAG/OPENCODE_TAG 双 pin
#   - sync-back：.upstream-od-tag + Dockerfile.opendesign 的 ARG pin
#   - e2e 门：docker/opendesign/fine-test.sh → e2e.sh（红不转正式 tag）
#   - dispatch 参数只当信使；force 只影响本次构建，不改 pin（#39 语义）
# 注意：OPENCODE_TAG 不跟最新版，pin 死在 Dockerfile.opendesign 的 ARG 默认值里（OD 与 CLI 版本对死，
# 如 --dir/--pure flag 差异）；升 opencode 只走手动 workflow_dispatch，见 README。
on:
  schedule:
    # 每周一 02:00 UTC 巡检一次（OD 发版不算频繁，不值得天天跟）
    - cron: "0 2 * * 1"
  repository_dispatch:
    types: [upstream-od-image]
  workflow_dispatch:
    inputs:
      od_tag:
        description: "上游 OD tag（信使参数：空则自动取最新；形如 0.24.1，无 v 前缀。构建成功后回写 .upstream-od-tag + Dockerfile pin）"
        required: false
        type: string
        default: ""
      opencode_tag:
        description: "OpenCode 版本（信使参数：空则用 Dockerfile.opendesign 里 ARG OPENCODE_TAG 的 pin 值；只在 OD 要求时手动 bump，成功后回写 pin）"
        required: false
        type: string
        default: ""
      force:
        description: "强制重打（true 则跳过“无变化跳过”检查；只影响本次构建，不改 pin）"
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  contents: write # sync-back 回写 pin（开 PR）
  pull-requests: write # sync-back 开 PR
  packages: write # push ghcr.io/link-seek/opendesign

jobs:
  release:
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: opendesign
      dockerfile: Dockerfile.opendesign
      ghcr_image: ghcr.io/link-seek/opendesign
      swr_image: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opendesign
      tag_mode: combo
      upstream_ghcr_package: orgs/nexu-io/packages/container/od
      upstream_pattern: '^0\.[0-9]+\.[0-9]+$'
      upstream_min_age_days: "3"
      upstream_tag: ${{ inputs.od_tag || github.event.client_payload.tag }}
      pin_file: .upstream-od-tag
      pin_args: OD_TAG OPENCODE_TAG
      pin_overrides: |
        OPENCODE_TAG=${{ inputs.opencode_tag }}
      combo_arg: OPENCODE_TAG
      force: ${{ inputs.force || 'false' }}
      fine_test_hook: docker/opendesign/fine-test.sh
      push_temp_to_ghcr: true
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      ghcr_token: ${{ secrets.GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
