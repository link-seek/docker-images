name: bake-cfos-demo

# 薄调用：cloudflared-os-demo 只声明参数，逻辑全在 bake-stack.yml（共用骨架）。
# HW41 试用镜像（cloudflare-os run-local），demo 无 SLA。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.cloudflared-os-demo
      - .github/workflows/bake-cfos-demo.yml
      - .github/workflows/bake-stack.yml

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: cloudflared-os-demo
      dockerfile: Dockerfile.cloudflared-os-demo
      ghcr_image: ghcr.io/link-seek/cloudflared-os-demo
      swr_image: swr.cn-north-9.myhuaweicloud.com/linkseed/cloudflared-os-demo
      tag_mode: date-sha
      build_args: |
        CFOS_SHA=fe4c68bdec67d3e9467515bac2c848df4cb91b9d
      infra_stack_dir: stacks/cloudflare-os-demo/hw41
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
