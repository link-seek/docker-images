name: bake-browserless-cjk
# 薄调用：browserless-chrome-cjk 只声明参数，构建/自检/细测/转正逻辑全在 bake-stack.yml（共用骨架）。
# 开源 browserless/chromium + 中文字体（独立 Pod 部署，给 opencode-team 做远程浏览器）。
# 仓库名带 chrome：bake-stack 新预检按 `image: .*chrome` 抓 sidecar 行（k8s/opencode-team/deployment.yaml 内见），
# 缺 chrome 子串会 PREFLIGHT-RED；改骨架影响全线，故命名适配。
# 版本：browserless_tag 由手动 dispatch 必填传入（Dockerfile 默认值只给本地构建兜底）。
# 无 k8s 预检：本镜像的 k8s 归属在 k8s/opencode-team/，由 bake-team 的 k3d 预检连带验证；
# 本线细测只验单镜像（pressure + CJK + 截图）。

on:
  workflow_dispatch:
    inputs:
      browserless_tag:
        description: "上游 tag（必填，如 2.63.1，无 v 前缀也行）"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - docker/browserless-cjk/Dockerfile
      - docker/browserless-cjk/**
      - .github/workflows/bake-browserless-cjk.yml
      - .github/workflows/bake-stack.yml

permissions:
  contents: read
  packages: write

jobs:
  release:
    # push 没有 dispatch 参数：直接跳过，正式构建只走手动 dispatch（版本必填）。
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: browserless-cjk
      dockerfile: docker/browserless-cjk/Dockerfile
      ghcr_image: ghcr.io/link-seek/browserless-chrome-cjk
      swr_image: swr.cn-north-9.myhuaweicloud.com/link-seek/browserless-chrome-cjk
      tag_mode: explicit
      explicit_tag: ${{ inputs.browserless_tag }}
      build_args: |
        BROWSERLESS_TAG=${{ inputs.browserless_tag }}
      push_temp_to_ghcr: true
      ghcr_temp_only: true
      fine_test_hook: docker/browserless-cjk/fine-test.sh
      goss_dir: docker/browserless-cjk
      goss_docker_args: -e TOKEN=goss-ci-token
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
