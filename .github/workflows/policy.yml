name: policy

# 声明式发布纪律（硬门禁）：渲染产物必须 digest-pin、禁 :latest。
# 全量 PR 触发（无 paths 过滤），可直接进 branch protection required checks。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: install deps
        run: |
          python3 -m pip install --quiet pyyaml
          if ! command -v kubectl >/dev/null; then
            curl -fsSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/ 2>/dev/null || true
          fi
      - name: policy (enforcing)
        run: python3 scripts/policy_check.py
