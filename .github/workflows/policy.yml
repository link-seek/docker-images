name: policy

# 声明式发布纪律（先 audit）：渲染产物必须 digest-pin、禁 :latest。
# 等 B1（不可变 tag + digest pin）稳定后，把 continue-on-error 去掉即变硬门禁。
on:
  pull_request:
    paths:
      - "k8s/**"
      - "scripts/policy_check.py"
      - ".github/workflows/policy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python3 -m pip install --quiet pyyaml
          if ! command -v kubectl >/dev/null; then
            curl -fsSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
            sudo mv kustomize /usr/local/bin/ 2>/dev/null || true
          fi
      - name: policy (audit mode)
        continue-on-error: true
        run: python3 scripts/policy_check.py
