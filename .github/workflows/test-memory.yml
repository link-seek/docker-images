name: Test memory integration

# L2 记忆集成测试（glibc 线成品镜像）：opencode + 烘入插件 + litellm 网关 + Ollama。
# 触发关系（构建→质检→放行链）：
# - push/PR（记忆相关文件改动）：独立质检，用 Dockerfile pin 对应的镜像 tag 做回归。
# - workflow_dispatch：手动质检，inputs 带默认值，可覆盖镜像 tag / 测试模型。
# - workflow_call：被 docker-tools.yml 构建成功后自调，传入刚打出的版本 tag；
#   绿了才由 docker-tools 的 promote 作业打 latest 并 push，红则停（needs 门）。
# 分钟级。零密钥（dummy + 合成）。沿用 secret-hygiene 门，不碰任何 secret。
on:
  pull_request:
    paths:
      - Dockerfile.opencode-tools
      - docker/opencode-tools/**
      - .github/workflows/test-memory.yml
  push:
    branches: [main]
    paths:
      - Dockerfile.opencode-tools
      - docker/opencode-tools/**
  workflow_dispatch:
    inputs:
      image_tag:
        description: "待测镜像版本 tag（如 2.0.29，不含 latest）"
        required: false
        default: "2.0.29"
      test_chat_model:
        description: "测试用 chat 模型（Ollama 侧）"
        required: false
        default: "qwen3:8b"
      test_embed_model:
        description: "测试用 embedding 模型（Ollama 侧）"
        required: false
        default: "nomic-embed-text"
      ollama_version:
        description: "Ollama 镜像版本"
        required: false
        default: "0.40.3"
      opencode_mem_version:
        description: "opencode-mem 插件 pin（须与 Dockerfile/ jsonc 同值）"
        required: false
        default: "2.31.1"
  workflow_call:
    inputs:
      image_tag:
        description: "待测镜像版本 tag（docker-tools 刚打出的 TAG）"
        required: false
        type: string
        default: "2.0.29"
      test_chat_model:
        description: "测试用 chat 模型（Ollama 侧）"
        required: false
        type: string
        default: "qwen3:8b"
      test_embed_model:
        description: "测试用 embedding 模型（Ollama 侧）"
        required: false
        type: string
        default: "nomic-embed-text"
      ollama_version:
        description: "Ollama 镜像版本"
        required: false
        type: string
        default: "0.40.3"
      opencode_mem_version:
        description: "opencode-mem 插件 pin"
        required: false
        type: string
        default: "2.31.1"

jobs:
  secret-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 烘焙文件无真值（ak/sk/key/token/私钥头，注释和占位符除外）
        run: |
          if grep -rniE '(sk-[A-Za-z0-9_-]{16,}|ghp_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|LTAI[A-Za-z0-9]{12,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[bap]-[A-Za-z0-9-]+)' \
              Dockerfile.opencode-tools docker/opencode-tools/ .github/workflows/test-memory.yml; then
            echo "FAIL: 疑似真值进仓"; exit 1
          fi
          echo "OK: no live secrets in build context"

  memory-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Resolve test params（inputs 为空时回落到 Dockerfile pin/默认值，保持 push/PR 行为不变）
        id: params
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="$(grep -oP '^ARG OPENCODE_TAG=\K.+' Dockerfile.opencode-tools | head -n1)"; fi
          CHAT="${{ inputs.test_chat_model }}"; [ -z "$CHAT" ] && CHAT="qwen3:8b"
          EMB="${{ inputs.test_embed_model }}"; [ -z "$EMB" ] && EMB="nomic-embed-text"
          OLLAMA="${{ inputs.ollama_version }}"; [ -z "$OLLAMA" ] && OLLAMA="0.40.3"
          MEMV="${{ inputs.opencode_mem_version }}"
          if [ -z "$MEMV" ]; then MEMV="$(grep -oP 'ARG OPENCODE_MEM_VERSION=\K.+' Dockerfile.opencode-tools | head -n1)"; fi
          [ -z "$MEMV" ] && MEMV="2.31.1"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "chat=${CHAT}" >> "$GITHUB_OUTPUT"
          echo "emb=${EMB}" >> "$GITHUB_OUTPUT"
          echo "ollama=${OLLAMA}" >> "$GITHUB_OUTPUT"
          echo "memv=${MEMV}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved: image=${TAG} chat=${CHAT} emb=${EMB} ollama=${OLLAMA} mem=${MEMV}"

      - name: Start ollama (CPU)
        run: |
          docker run -d --name ollama --network host \
            -v ollama-data:/root/.ollama \
            -e OLLAMA_HOST=0.0.0.0:11434 \
            "ollama/ollama:${{ steps.params.outputs.ollama }}"
          for i in $(seq 1 30); do
            curl -sf --max-time 5 http://127.0.0.1:11434/ >/dev/null && break
            sleep 5
          done
          docker exec ollama ollama pull "${{ steps.params.outputs.emb }}"
          docker exec ollama ollama pull "${{ steps.params.outputs.chat }}"

      - name: Render test gateway config (dummy key)
        run: |
          pip install pyyaml -q 2>/dev/null || true
          CHAT="${{ steps.params.outputs.chat }}" EMB="${{ steps.params.outputs.emb }}" python3 - <<'EOF'
          import os, yaml
          chat, emb = os.environ["CHAT"], os.environ["EMB"]
          gw = {"model_name": "test-chat",
                "litellm_params": {"model": f"ollama/{chat}",
                                   "api_base": "http://127.0.0.1:11434", "timeout": 300}}
          em = {"model_name": emb,
                "litellm_params": {"model": f"ollama/{emb}",
                                   "api_base": "http://127.0.0.1:11434", "timeout": 120}}
          cfg = {"general_settings": {"drop_params": True},
                 "litellm_settings": {"request_timeout": 300, "num_retries": 0, "drop_params": True},
                 "model_list": [gw, em]}
          open('/tmp/litellm-memtest.yaml', 'w').write(yaml.safe_dump(cfg))
          print("gateway config render OK")
          EOF
          mkdir -p /tmp/oc-cfg-test /tmp/ochome-mem
          MEMV="${{ steps.params.outputs.memv }}"
          EMB="${{ steps.params.outputs.emb }}"
          cat > /tmp/oc-cfg-test/opencode.jsonc <<EOF
          {"\$schema": "https://opencode.ai/config.json",
           "permission": "allow",
           "model": "gw/test-chat",
           "provider": {"gw": {"options": {
             "baseURL": "http://127.0.0.1:4001/v1",
             "apiKey": "test-only"}}},
           "plugins": ["opencode-mem@${MEMV}"]}
          EOF
          cat > /tmp/oc-cfg-test/opencode-mem.jsonc <<EOF
          {"storagePath": "/memdata",
           "embeddingModel": "${EMB}",
           "embeddingApiUrl": "http://127.0.0.1:4001/v1",
           "embeddingApiKey": "test-only",
           "embeddingDimensions": 768,
           "webServerEnabled": true, "webServerPort": 4747, "webServerHost": "127.0.0.1",
           "webServerApiToken": "ci-test-token",
           "opencodeProvider": "gw", "opencodeModel": "inherit", "opencodeTimeoutMs": 180000,
           "memoryProvider": "openai-chat",
           "autoCaptureEnabled": false,
           "chatMessage": {"enabled": true, "maxMemories": 3, "injectOn": "first"},
           "autoUpdate": false,
           "showAutoCaptureToasts": false, "showUserProfileToasts": false, "showErrorToasts": false}
           EOF
          echo "override configs render OK (mem=${MEMV} emb=${EMB})"

      - name: Start litellm (test gateway, embeddings+chat 经 ollama)
        run: |
          docker run -d --name litellm-memtest --network host \
            -v /tmp/litellm-memtest.yaml:/app/config.yaml:ro \
            -e LITELLM_MASTER_KEY=test-only -e DISABLE_ADMIN_UI=True \
            ghcr.io/berriai/litellm@sha256:3def0387871a732a6d18b009576c4bf4313c54d448fa938a58f51cf189d1fa33 \
            --config /app/config.yaml --port 4001
          for i in $(seq 1 24); do
            curl -sf --max-time 5 "http://127.0.0.1:4001/v1/models" \
              -H "Authorization: Bearer test-only" >/dev/null 2>&1 && break
            sleep 5
          done
          curl -s --max-time 10 http://127.0.0.1:4001/v1/embeddings \
            -H "Authorization: Bearer test-only" -H "Content-Type: application/json" \
            -d "{\"model\":\"${{ steps.params.outputs.emb }}\",\"input\":\"probe\"}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); assert len(d['data'][0]['embedding'])==768, d; print('gateway embeddings OK (768)')" || \
            (echo "FAIL: 测试网关 embeddings 不通"; exit 1)

      - name: Tool parity matrix (成品镜像工具对照表）
        run: |
          IMAGE="${{ steps.params.outputs.IMAGE }}"
          for t in "gh --version" "aliyun --version" "hcloud version" "oci --version" \
                   "tailscale version" "terraform version" "wrangler --version" \
                   "agent-browser --version" "markitdown --version" "git --version" \
                   "node --version" "python3 --version" "msmtp --version" "opencode --version" "send-mail --help"; do
            echo "== $t"; docker run --rm --entrypoint sh "$IMAGE" -c "$t" 2>&1 | head -2 || \
              (echo "FAIL: $t 缺失"; exit 1)
          done
          echo "OK: tool parity matrix ($IMAGE)"

      - name: 工件版本门（拒测旧镜像）
        run: |
          IMAGE="${{ steps.params.outputs.IMAGE }}"
          TAG="${{ steps.params.outputs.tag }}"
          docker pull -q "$IMAGE"
          docker run --rm --entrypoint sh "$IMAGE" -c "opencode --version" | tee /tmp/ver.txt
          grep -q "$TAG" /tmp/ver.txt && echo "OK: artifact is $TAG" || (echo "FAIL: 工件版本不符，拒测"; exit 1)

      - name: Serve （成品镜像，插件已烘入） + sessions + asserts
        run: |
          IMAGE="${{ steps.params.outputs.IMAGE }}"
          # 顺序铁律（2026-10-14 verdict）：插件 lazy activation，首个会话后才起。
          # 先跑会话触发激活，再等 :4747。等插件先于会话必死等（5 连败根因）。
          docker run -d --name oc-memtest --network host \
            -v /tmp/oc-cfg-test/opencode.jsonc:/root/.config/opencode/opencode.jsonc:ro \
            -v /tmp/oc-cfg-test/opencode-mem.jsonc:/root/.config/opencode/opencode-mem.jsonc:ro \
            -v /tmp/ochome-mem:/memdata \
            -e OPENCODE_SERVER_PASSWORD=test-srv-pw \
            "$IMAGE" serve --port 4096 --hostname 127.0.0.1
          for i in $(seq 1 24); do
            curl -sf --max-time 5 http://127.0.0.1:4096/ >/dev/null 2>&1 && break
            sleep 5
          done
          curl -sf --max-time 10 http://127.0.0.1:4096/ >/dev/null || \
            (echo "FAIL: serve 未起"; docker logs oc-memtest --tail 20; exit 1)
          echo "OK: serve live"
          OEX="docker exec -e OPENCODE_PASSWORD=test-srv-pw oc-memtest opencode run --server http://127.0.0.1:4096"
          # 会话0：触发插件激活 + 客户端闭环（硬门：连通性）
          # bash -e 下客户端偶发非零即整步猝死，故重试 3 轮、失败打全日志
          S0_OK=""
          for attempt in 1 2 3; do
            timeout 280 $OEX \
              "reply with exactly: MEM-OK" > /tmp/mem-out.txt 2>&1 && \
            grep -q "MEM-OK" /tmp/mem-out.txt && { S0_OK=1; echo "OK: client closure (attempt $attempt)"; break; }
            echo "--- session0 attempt $attempt output:"; tail -6 /tmp/mem-out.txt
            docker logs oc-memtest --tail 8 2>&1 | head -9
            sleep 15
          done
          [ -n "$S0_OK" ] || \
            (echo "FAIL: 客户端不通"; tail -20 /tmp/mem-out.txt; docker logs oc-memtest --tail 20; exit 1)
          echo "== plugin state post-session0 (diagnostic, non-fatal):"
          docker exec oc-memtest ls -la /root/.opencode-mem/ 2>&1 | head -6
          docker exec oc-memtest ls /root/.local/share/opencode/log/ 2>&1 | head -4
          # 插件 gate 在首会话之后
          echo "waiting for plugin (post-session)"
          for i in $(seq 1 20); do
            curl -sf --max-time 5 http://127.0.0.1:4747/api/health >/dev/null 2>&1 && break
            sleep 15
          done
          curl -sf --max-time 15 http://127.0.0.1:4747/api/health >/dev/null || \
            (echo "FAIL: 插件 5 分钟未起"; docker logs oc-memtest --tail 30; \
             docker exec oc-memtest cat /root/.opencode-mem/opencode-mem.log 2>/dev/null | tail -20; exit 1)
          echo "OK: plugin live"; ls /tmp/ochome-mem/ | head -4
          # API 鉴权：search 必须带内部 token（无 token 直接 Unauthorized 空转，之前全栽在这）
          echo "== mem dir tree:"; docker exec oc-memtest find /root/.opencode-mem /memdata -maxdepth 2 2>/dev/null | head -20
          echo "== plugin log auth lines:"; docker exec oc-memtest grep -aiE "token|auth|listen|web server|4747" /root/.opencode-mem/opencode-mem.log 2>/dev/null | head -10
          TOKPATH="$(docker exec oc-memtest find /root /memdata -maxdepth 3 -name ".auth-token" 2>/dev/null | head -1 || true)"
          echo "token path: ${TOKPATH:-(none)}"
          MTOK="$(docker exec oc-memtest cat "$TOKPATH" 2>/dev/null || true)"
          AUTH_HDRS=(-H "Authorization: Bearer ci-test-token")
          if [ -n "$MTOK" ]; then AUTH_HDRS+=(-H 'x-opencode-mem-token: '"$MTOK"); echo "OK: file token too"; else echo "NOTE: 无文件 token，仅 Bearer"; fi
          # 写入 + API 检回：弱模型（qwen3:8b）证词不可靠，agent 回执只作参考；
          # 硬门是 API search。最多试 3 轮，任一轮 API 命中即过。
          TAG="opencode_project_$(python3 -c "import hashlib; print(hashlib.sha256(b'path:/').hexdigest()[:16])")"
          SEED_OK=""
          for attempt in 1 2 3; do
            timeout 280 $OEX \
              "Call the memory tool with mode 'add' and content 'sky test word is CERULEAN-7'. Reply with exactly: STORED" \
              > /tmp/mem-a.txt 2>&1; tail -3 /tmp/mem-a.txt
            sleep 10
            if curl -s --max-time 60 "${AUTH_HDRS[@]}" "http://127.0.0.1:4747/api/search?q=sky%20test%20word&tag=$TAG" | grep -q "CERULEAN-7" \
              || curl -s --max-time 60 "${AUTH_HDRS[@]}" "http://127.0.0.1:4747/api/search?q=sky%20test%20word" | grep -q "CERULEAN-7"; then
              SEED_OK=1; echo "OK: api search recall (attempt $attempt)"; break
            fi
            echo "attempt $attempt: api 未见，重试"
          done
          [ -n "$SEED_OK" ] || (echo "FAIL: API 未检回记忆"; echo "== raw search body:"; curl -s --max-time 60 "${AUTH_HDRS[@]}" "http://127.0.0.1:4747/api/search?q=sky%20test%20word" | head -c 800; echo; echo "== plugin log tail:"; docker exec oc-memtest cat /root/.opencode-mem/opencode-mem.log 2>/dev/null | tail -25; echo "== db tables+rows:"; docker exec oc-memtest sh -c "ls /memdata/*.db* 2>/dev/null; python3 -c \"import sqlite3,glob; [print(f, [r for r in __import__('sqlite3').connect(f'file:{f}?mode=ro', uri=True).execute(\\\"select name from sqlite_master where type='table'\\\")]) for f in glob.glob('/memdata/*.db')]\" 2>&1 | head -8"; exit 1)
          # 会话B：跨会话召回（弱模型 → 软断言，只记 NOTE）
          timeout 280 $OEX \
            "Call the memory tool with mode 'search' and query 'sky test word'. Print the full results verbatim." \
            > /tmp/mem-b.txt 2>&1; tail -8 /tmp/mem-b.txt
          grep -q "CERULEAN-7" /tmp/mem-b.txt && echo "OK: cross-session recall" || \
            echo "NOTE: 跨会话 agent 未召回（弱模型，以 API 门为准）"
          test -n "$(find /tmp/ochome-mem -name '*.db' 2>/dev/null | head -1)" && echo "OK: shards persisted" || \
            (echo "FAIL: 无 shard 文件"; ls -R /tmp/ochome-mem | head -10; exit 1)
          docker rm -f oc-memtest >/dev/null; echo "ALL GREEN"
