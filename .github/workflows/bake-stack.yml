# bake-stack.yml — 商家共用烘焙骨架（可复用 workflow，唯一真相）。
#
# 【接口（写死）】薄调用只传参，不写逻辑；各镜像按接口实现 hook。
# inputs:
#   image_slug      短名（temp tag/TS hostname 用，如 litellm-gateway）
#   dockerfile      Dockerfile 路径（如 Dockerfile.litellm-gateway）
#   ghcr_image      GHCR 仓库（如 ghcr.io/link-seek/litellm-gateway）
#   swr_image       SWR 仓库（主发布，如 swr.cn-north-4.../link-seek/litellm-gateway）
#   tag_mode        date-sha | upstream | explicit
#     date-sha      TAG=日期-shortsha（网关：上游 digest pin 在 Dockerfile FROM，手动 bump）
#     upstream      跟上游 tag（tools）：upstream_repo + pattern + 最小年龄 + 资产检查
#     explicit      TAG=explicit_tag（od：薄调用组装 <od>-oc<opencode> 后直传）
#   explicit_tag    explicit 模式的 tag（tag_mode=explicit 时必填）
#   build_args      docker build 的 --build-arg（多行，每行 ARG=值；空行忽略）
#   push_temp_to_ghcr  temp tag 是否同步推 GHCR（od e2e 要验 GHCR 同版；默认 false）
#   upstream_repo / upstream_pattern / upstream_min_age_days / upstream_asset_url（{TAG} 占位）
#   infra_stack_dir infra 栈目录（如 stacks/litellm-gateway），预检目标；空=跳过 img 预检（od 过渡）
#   sync_from_repo  过渡：正本在别仓时从该仓库 sparse 取（如 link-seek/infra），空=不取（正本在商家）
#   sync_paths      取的子目录（空格分隔，如 "stacks/litellm-gateway/config stacks/litellm-gateway/guard"）
#   sync_dest       落到本仓的目录（取之前清空，如 litellm-gateway）
#   fine_test_hook  细测 hook 脚本路径（仓内），空=只到预检（od 过渡态）
#                   调用约定（固定）：env 传 DIGEST/API_KEY/SWR_USER/SWR_PASS/STACK_DIR/CANARY/TEMP_TAG，
#                   exit 0 + 打印 PASS 行即过，非零即红。
#   goss_dir        dgoss 自检目录（仓内相对路径，含 goss-bake.yaml；可选 goss_wait.yaml），空=跳过。
#                   网关/OD 不填，零感知；tools 填 docker/opencode-tools。
#   goss_vars       追加 goss vars（多行 KEY: "值"），TAG 骨架自带；空=只有 TAG。
#   goss_docker_args  dgoss run 的 docker 参数（如 "--network host -e FOO=bar"）；空=默认。
#   goss_command    容器内替代命令（如 "serve --port 4096 --hostname 127.0.0.1"）；空=镜像默认 CMD。
#   e2e_cases       透传给 hook 的 E2E 名单（skip/full/名单/auto/空=auto）；骨架只透传不解释。
#   img_key_ttl     临 key 有效期秒（默认 21600）
# secrets: gh_token（gh api 用，PAT）、OPENCODE_API_KEY（真 key 细测）、SWR_LOGIN_USER/PASS、TS_API_KEY（mint）
#
# 固定四拍：build（temp tag）→ img 预检（infra 部署到本机标签，只装+启动自测）
#           → 本地细测（hook）→ 转正（retag 不 rebuild）。
# 安全门：只有 main 分支才转正式 tag；分支 dispatch 只跑到细测（TRIAL-ONLY），合前可验骨架本身。
# 版本全由上游 resolve 定（dispatch 参数或自动最新），不读 pin 不回写；审计靠 run 日志。

on:
  workflow_call:
    inputs:
      image_slug:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      ghcr_image:
        required: true
        type: string
      swr_image:
        required: true
        type: string
      tag_mode:
        required: true
        type: string
      explicit_tag:
        required: false
        type: string
        default: ""
      build_args:
        required: false
        type: string
        default: ""
      push_temp_to_ghcr:
        required: false
        type: boolean
        default: false
      upstream_repo:
        required: false
        type: string
        default: ""
      upstream_pattern:
        required: false
        type: string
        default: ""
      upstream_min_age_days:
        required: false
        type: string
        default: "3"
      upstream_asset_url:
        required: false
        type: string
        default: ""
      infra_stack_dir:
        required: false
        type: string
        default: ""
      fine_test_hook:
        required: false
        type: string
        default: ""
      goss_dir:
        required: false
        type: string
        default: ""
      goss_vars:
        required: false
        type: string
        default: ""
      goss_docker_args:
        required: false
        type: string
        default: ""
      goss_command:
        required: false
        type: string
        default: ""
      e2e_cases:
        required: false
        type: string
        default: ""
      canary_name:
        required: false
        type: string
        default: ""
      sync_from_repo:
        required: false
        type: string
        default: ""
      sync_paths:
        required: false
        type: string
        default: ""
      sync_dest:
        required: false
        type: string
        default: ""
      img_key_ttl:
        required: false
        type: string
        default: "21600"
    secrets:
      gh_token:
        required: true
      OPENCODE_API_KEY:
        required: false
      SWR_LOGIN_USER:
        required: false
      SWR_LOGIN_PASS:
        required: false
      TS_API_KEY:
        required: true

permissions:
  contents: read
  packages: write # push 镜像

env:
  SWR_REGISTRY: swr.cn-north-9.myhuaweicloud.com
  GOSS_VER: v0.4.10
  GOSS_SHA256_AMD64: "26e365428946294bcec0c61d867bb3c8349f39feb3d0e6f59084e98632785cc7" # goss_0.4.10_linux_x86_64.tar.gz
  GOSS_SHA256_ARM64: "90a59612b4d67d9f1a9038634c000790136bb82526a69de1e81ac075c2f6d2c6" # goss_0.4.10_linux_arm64.tar.gz
  DGOSS_SHA256: "3bb3ac9df33eeab8ce71a35763f4a69582eceb7db7bf02b4d0a551e72c7a888d" # dgoss 脚本（架构无关）

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.gh_token }}
      SWR_IMAGE: ${{ inputs.swr_image }}
      GHCR_IMAGE: ${{ inputs.ghcr_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync 来源（正本在他仓时过渡用；商家正本到位后删）
        if: inputs.sync_from_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sync_from_repo }}
          path: infra-src
          sparse-checkout: |
            ${{ inputs.sync_paths }}
          sparse-checkout-cone-mode: false
      - name: Stage build context
        if: inputs.sync_from_repo != ''
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 # sync_paths  multi-line：先装变量再分词（直接 for 会撑断脚本）
          SYNC_PATHS="${{ inputs.sync_paths }}"
          rm -rf "${{ inputs.sync_dest }}" && mkdir -p "${{ inputs.sync_dest }}"
          for p in $SYNC_PATHS; do cp -r "infra-src/$p" "${{ inputs.sync_dest }}/"; done
          rm -rf infra-src
          ls "${{ inputs.sync_dest }}"

      - name: Resolve tag
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.gh_token }}
        run: |
          set -euo pipefail
          normalize() { echo "${1#v}"; }
          if [ "${{ inputs.tag_mode }}" = "date-sha" ]; then
            TAG="$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
            echo "Tag: $TAG（上游 digest pin 见 Dockerfile FROM）"
          elif [ "${{ inputs.tag_mode }}" = "explicit" ]; then
            TAG="$(normalize "${{ inputs.explicit_tag }}")"
            [ -n "$TAG" ] || { echo "FAIL: explicit 模式需要 explicit_tag"; exit 1; }
            echo "Resolved explicit: ${TAG}"
          elif [ "${{ inputs.tag_mode }}" = "upstream" ]; then
            TAG=""
            CUTOFF="$(date -u -d "${{ inputs.upstream_min_age_days }} days ago" +%Y-%m-%dT%H:%M:%SZ)"
            while read -r T S; do
              D="$(gh api "repos/${{ inputs.upstream_repo }}/commits/$S" --jq '.commit.committer.date' 2>/dev/null || true)"
              [ -z "$D" ] && continue
              if [[ "$D" < "$CUTOFF" ]]; then TAG="$T"; break; fi
              echo "skip $T ($D, too fresh)"
            done < <(gh api "repos/${{ inputs.upstream_repo }}/tags?per_page=20" \
              --jq "[.[] | {tag: .name | ltrimstr(\"v\"), sha: .commit.sha} | select(.tag | test(\"${{ inputs.upstream_pattern }}\"))] | sort_by(.tag | split(\".\") | map(tonumber)) | reverse | .[] | \"\\(.tag) \\(.sha)\"" | head -5)
            [ -z "$TAG" ] && { echo "no tag older than ${{ inputs.upstream_min_age_days }} days."; exit 1; }
            if [ -n "${{ inputs.upstream_asset_url }}" ]; then
              ASSET_URL="${{ inputs.upstream_asset_url }}"
              ASSET_URL="${ASSET_URL//\{TAG\}/$TAG}"
              curl -fsSL -o /dev/null "$ASSET_URL" \
                || { echo "binary asset missing for ${TAG}"; exit 1; }
            fi
          else
            echo "FAIL: 未知 tag_mode ${{ inputs.tag_mode }}"; exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${TAG}"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u github-actions --password-stdin

      - name: Login to SWR
        run: echo "${{ secrets.SWR_LOGIN_PASS }}" | docker login ${{ env.SWR_REGISTRY }} -u "${{ secrets.SWR_LOGIN_USER }}" --password-stdin

      - name: Build（本地 tag，不推；版本全由上游 resolve 定，不读 pin）
        id: build
        env:
          BUILD_ARGS_IN: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          TAG="${{ steps.upstream.outputs.tag }}"
          BUILD_ARGS=()
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            BUILD_ARGS+=(--build-arg "$line")
          done <<< "$BUILD_ARGS_IN"
          docker build -f "${{ inputs.dockerfile }}" ${BUILD_ARGS[@]+"${BUILD_ARGS[@]}"} -t "${{ env.SWR_IMAGE }}:${TAG}" .
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "built ${TAG}"


      - name: 安装 goss/dgoss（pin 版，sha256 校验；goss_dir 为空跳过）
        if: inputs.goss_dir != ''
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  GOSS_ARCH=x86_64; GOSS_SHA="${{ env.GOSS_SHA256_AMD64 }}" ;;
            aarch64)  GOSS_ARCH=arm64;  GOSS_SHA="${{ env.GOSS_SHA256_ARM64 }}" ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          GOSS_TGZ="/tmp/goss_${GOSS_VER#v}_linux_${GOSS_ARCH}.tar.gz"
          curl -fsSL --retry 3 -o "$GOSS_TGZ" \
            "https://github.com/goss-org/goss/releases/download/${GOSS_VER}/goss_${GOSS_VER#v}_linux_${GOSS_ARCH}.tar.gz"
          echo "${GOSS_SHA}  ${GOSS_TGZ}" | sha256sum -c -
          tar -xzf "$GOSS_TGZ" -C /tmp goss
          sudo install -m 0755 /tmp/goss /usr/local/bin/goss
          curl -fsSL --retry 3 -o /tmp/dgoss \
            "https://github.com/goss-org/goss/releases/download/${GOSS_VER}/dgoss"
          echo "${{ env.DGOSS_SHA256 }}  /tmp/dgoss" | sha256sum -c -
          sudo install -m 0755 /tmp/dgoss /usr/local/bin/dgoss
          goss --version

      - name: 成品自检 dgoss（声明式；goss_dir 为空跳过，网关/OD 零感知）
        if: inputs.goss_dir != ''
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          IMG="${{ env.SWR_IMAGE }}:${TAG}"
          GOSS_DIR="$(mktemp -d)"
          REPORT_DIR="${RUNNER_TEMP:-/tmp}/goss-report"
          mkdir -p "$REPORT_DIR"
          cp "${{ inputs.goss_dir }}"/*.yaml "$GOSS_DIR/"
          {
            echo "TAG: \"${TAG}\""
            printf '%s\n' "${{ inputs.goss_vars }}"
          } > "$GOSS_DIR/goss-bake-vars.yaml"
          echo "goss vars:"; cat "$GOSS_DIR/goss-bake-vars.yaml"
          set +e
          GOSS_FILES_PATH="$GOSS_DIR" \
            GOSS_FILE="goss-bake.yaml" \
            GOSS_VARS="goss-bake-vars.yaml" \
            GOSS_WAIT_OPTS="-r 60s -s 5s > /dev/null" \
            GOSS_OPTS="--format junit" \
            dgoss run ${{ inputs.goss_docker_args }} "$IMG" ${{ inputs.goss_command }} \
            > "$REPORT_DIR/goss-junit.xml"
          RC=$?
          set -e
          rm -rf "$GOSS_DIR"
          [ "$RC" -eq 0 ] || { echo "FAIL: dgoss 自检未过"; cat "$REPORT_DIR/goss-junit.xml" || true; exit "$RC"; }
          echo "SELFCHECK OK: dgoss 成品自检通过"

      - name: 上传 goss JUnit 报告（失败也留档）
        if: always() && inputs.goss_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: goss-${{ inputs.image_slug }}-junit
          path: ${{ runner.temp }}/goss-report/goss-junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: 安装 Trivy（pin 版二进制，CI 现取；sha256 校验）
        run: |
          set -euo pipefail
          TRIVY_VER="v0.76.1"
          case "$(uname -m)" in
            x86_64)  TRIVY_ARCH="64bit"; TRIVY_SHA="c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0" ;;
            aarch64) TRIVY_ARCH="ARM64"; TRIVY_SHA="e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f" ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          TGZ="/tmp/trivy_${TRIVY_VER#v}_Linux-${TRIVY_ARCH}.tar.gz"
          curl -fsSL --retry 3 -o "$TGZ"             "https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VER}/trivy_${TRIVY_VER#v}_Linux-${TRIVY_ARCH}.tar.gz"
          echo "${TRIVY_SHA}  ${TGZ}" | sha256sum -c -
          tar -xzf "$TGZ" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy 镜像扫描（OS 包＋语言依赖；CRITICAL/HIGH 超阈值红，拦转正式版）
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          IMAGE_REF="${{ env.SWR_IMAGE }}:${TAG}"
          REPORT_DIR="${RUNNER_TEMP:-/tmp}/trivy-report"
          mkdir -p "$REPORT_DIR"
          # 误报白名单仓内 .trivyignore（需 review 定）
          trivy image --severity CRITICAL,HIGH --exit-code 1             --format table --output "$REPORT_DIR/trivy-image.txt"             --ignorefile .trivyignore "$IMAGE_REF"
          trivy image --severity CRITICAL,HIGH --exit-code 0             --format json --output "$REPORT_DIR/trivy-image.json"             --ignorefile .trivyignore "$IMAGE_REF"
          echo "TRIVY IMAGE OK: $IMAGE_REF"

      - name: Trivy IaC 误配扫描（Dockerfile/compose；红线另议，先报不拦）
        run: |
          set -euo pipefail
          REPORT_DIR="${RUNNER_TEMP:-/tmp}/trivy-report"
          mkdir -p "$REPORT_DIR"
          trivy config --severity CRITICAL,HIGH,MEDIUM --exit-code 0             --format table --output "$REPORT_DIR/trivy-config.txt"             --ignorefile .trivyignore . || true
          trivy config --exit-code 0             --format json --output "$REPORT_DIR/trivy-config.json"             --ignorefile .trivyignore . || true
          echo "TRIVY CONFIG DONE"

      - name: Trivy SBOM 生成（artifact 落盘，不强制签名）
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          IMAGE_REF="${{ env.SWR_IMAGE }}:${TAG}"
          REPORT_DIR="${RUNNER_TEMP:-/tmp}/trivy-report"
          mkdir -p "$REPORT_DIR"
          trivy image --format cyclonedx --output "$REPORT_DIR/sbom.cdx.json"             --ignorefile .trivyignore "$IMAGE_REF"
          echo "SBOM OK: $IMAGE_REF"

      - name: 上传 Trivy 报告与 SBOM（artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ inputs.image_slug }}
          path: ${{ runner.temp }}/trivy-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Push temp tag（只发 ci-<run号>，正式版等细测绿了再转）
        if: env.skip != 'true'
        id: push_temp
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          TEMP="ci-$GITHUB_RUN_ID"
          docker tag "${{ env.SWR_IMAGE }}:${TAG}" "${{ env.SWR_IMAGE }}:$TEMP"
          timeout 1800 docker push "${{ env.SWR_IMAGE }}:$TEMP"
          DIGEST_SOURCE="${{ env.SWR_IMAGE }}:$TEMP"
          if [ "${{ inputs.push_temp_to_ghcr }}" = "true" ]; then
            docker tag "${{ env.SWR_IMAGE }}:${TAG}" "${{ env.GHCR_IMAGE }}:$TEMP"
            timeout 1800 docker push "${{ env.GHCR_IMAGE }}:$TEMP"
            DIGEST_SOURCE="${{ env.GHCR_IMAGE }}:$TEMP"
          fi
          DIGEST="$(docker buildx imagetools inspect "$DIGEST_SOURCE" --format '{{json .Manifest}}' | python3 -c "import json,sys; print(json.load(sys.stdin)['digest'])")"
          echo "temp tag $TEMP -> $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
          echo "DIGEST_SOURCE=$DIGEST_SOURCE" >> "$GITHUB_ENV"

      - name: 本机加网（API token 现场 mint；mint-only，无直连回退）
        if: env.skip != 'true' && inputs.infra_stack_dir != ''
        run: |
          set -euo pipefail
          curl -fsSL https://tailscale.com/install.sh | sh
          IMG_TAG="img-$GITHUB_RUN_ID"
          echo "IMG_TAG=$IMG_TAG" >> "$GITHUB_ENV"
          MINTED=""
          TSKEY="${{ secrets.TS_API_KEY }}"
          [ -z "$TSKEY" ] || echo "::add-mask::$TSKEY"
          if [ -n "$TSKEY" ]; then
            MINT_BODY="{\"capabilities\":{\"devices\":{\"create\":{\"reusable\":false,\"ephemeral\":true,\"preauthorized\":true,\"tags\":[\"tag:guest\"]}}},\"expirySeconds\":${{ inputs.img_key_ttl }}}"
            MINT_RESP="$(mktemp)"
            MINT_CODE="$(curl -sS -m 30 -o "$MINT_RESP" -w '%{http_code}' -X POST -H "Authorization: Bearer $TSKEY" -H 'Content-Type: application/json' \
              -d "$MINT_BODY" \
              https://api.tailscale.com/api/v2/tailnet/-/keys 2>/tmp/mint.err || true)"
            if [ "$MINT_CODE" = "200" ] || [ "$MINT_CODE" = "201" ]; then
              MINTED="$(python3 -c "import json; print(json.load(open('$MINT_RESP')).get('key',''))" || true)"
              [ -n "$MINTED" ] && echo "::add-mask::$MINTED"
            else
              echo "mint-bearer: HTTP $MINT_CODE body: $(head -c 400 "$MINT_RESP")"
            fi
            rm -f "$MINT_RESP"
          fi
          if [ -n "$MINTED" ]; then
            echo "ephemeral key minted（tag:guest，有效期 ${{ inputs.img_key_ttl }}s）"
            # --ssh：guest 靶机；infra 部署方（tag:user，经 user→guest 放行）直接 tailscale ssh 进来，不需要单次钥匙/sshd
            timeout 120 sudo tailscale up --authkey="$MINTED" --hostname="$IMG_TAG" --ssh --accept-routes=false --accept-dns=false
          else
            echo "FAIL: 现场 mint 未成功；本线 mint-only，不回退任何直连 key"; exit 1
          fi
          tailscale status --json | python3 -c "import json,sys; d=json.load(sys.stdin); print('self:', d.get('Self',{}).get('HostName'))"

      - name: 触发 infra 部署到本机标签（只装+启动自测，判好坏在下一步本地细测）
        if: env.skip != 'true' && inputs.infra_stack_dir != ''
        run: |
          set -euo pipefail
          START="$(date -u -d '5 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"  # 回拨 5 分钟防时钟偏差误滤
          echo "START=$START" >> "$GITHUB_ENV"
          gh workflow run img-preflight.yml -R link-seek/infra \
            -f digest_or_tag="$DIGEST" \
            -f stack_dir="${{ inputs.infra_stack_dir }}" \
            -f node_tag="host:$IMG_TAG" \
            -f ssh_transport="tailscale"

      - name: 轮询 infra 部署结论（按 node_tag 核对，fail-closed）
        if: env.skip != 'true' && inputs.infra_stack_dir != ''
        run: |
          set -euo pipefail
          EXPECTED_NODE_TAG="host:${IMG_TAG:?IMG_TAG 未设置，无法核对预检 run}"
          EXPECTED_DIGEST="${DIGEST:?DIGEST 未设置，无法核对预检 run}"
          RUN_ID=""
          REJECTED="$(mktemp)"
          LOG="$(mktemp)"
          trap 'rm -f "$REJECTED" "$LOG"' EXIT
          for i in $(seq 1 30); do
            sleep 60
            CANDIDATES="$(timeout 60 gh api "repos/link-seek/infra/actions/workflows/img-preflight.yml/runs?event=workflow_dispatch&per_page=100" \
              -q "[.workflow_runs[] | select(.created_at >= \"$START\")] | sort_by(.created_at) | reverse | .[] | \"\(.id) \(.status)\"" 2>/dev/null || true)"
            while read -r RUN_CANDIDATE RUN_STATUS; do
              if [ -z "$RUN_CANDIDATE" ] || [ "$RUN_STATUS" != "completed" ]; then
                continue
              fi
              if grep -qxF "$RUN_CANDIDATE" "$REJECTED"; then
                continue
              fi
              if timeout 180 gh run view "$RUN_CANDIDATE" -R link-seek/infra --log >"$LOG" 2>/dev/null; then
                if grep -qE -- "${EXPECTED_NODE_TAG}([^0-9]|$)" "$LOG" && grep -qF -- "$EXPECTED_DIGEST" "$LOG"; then
                  RUN_ID="$RUN_CANDIDATE"
                  break
                fi
                echo "$RUN_CANDIDATE" >> "$REJECTED"
              fi
            done <<< "$CANDIDATES"
            if [ -n "$RUN_ID" ]; then
              break
            fi
          done
          [ -n "$RUN_ID" ] || { echo "FAIL: 预检 run 30 分钟未出现，或无 node_tag=$EXPECTED_NODE_TAG + digest=$EXPECTED_DIGEST 的可核对 run（fail-closed）"; exit 1; }
          echo "preflight run: https://github.com/link-seek/infra/actions/runs/$RUN_ID (node_tag=$EXPECTED_NODE_TAG, digest=$EXPECTED_DIGEST)"
          timeout 1800 gh run watch "$RUN_ID" -R link-seek/infra --interval 20 --exit-status \
            || { echo "FAIL: 预检未过（PREFLIGHT-RED，见上 run 链接）"; exit 1; }
          echo PREFLIGHT-GREEN

      - name: 本地细测（hook；实现按接口自带 verdict）
        if: env.skip != 'true' && inputs.fine_test_hook != ''
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          SWR_USER: ${{ secrets.SWR_LOGIN_USER }}
          SWR_PASS: ${{ secrets.SWR_LOGIN_PASS }}
          TEMP_TAG: ci-${{ github.run_id }}
          E2E_CASES: ${{ inputs.e2e_cases }}
        run: |
          set -euo pipefail
          export DIGEST API_KEY="$OPENCODE_API_KEY" STACK_DIR="${{ inputs.infra_stack_dir }}" CANARY="${{ inputs.canary_name }}" TEMP_TAG
          bash "${{ inputs.fine_test_hook }}"

      - name: temp digest 转正式版（retag 不 rebuild；非 main 分支只试不发）
        if: env.skip != 'true' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TAG="${{ steps.build.outputs.tag }}"
          SOURCE="${DIGEST_SOURCE:?DIGEST_SOURCE 未设置}"
          docker buildx imagetools create \
            -t "${{ env.SWR_IMAGE }}:$TAG" -t "${{ env.SWR_IMAGE }}:latest" \
            "$SOURCE"
          if [ "${{ inputs.push_temp_to_ghcr }}" = "true" ]; then
            docker buildx imagetools create \
              -t "${{ env.GHCR_IMAGE }}:$TAG" -t "${{ env.GHCR_IMAGE }}:latest" \
              "$SOURCE"
          else
            docker buildx imagetools create \
              -t "${{ env.GHCR_IMAGE }}:$TAG" -t "${{ env.GHCR_IMAGE }}:latest" \
              "$SOURCE" || echo "GHCR retag skipped (org policy, SWR 为主)"
          fi
          echo "released $TAG $DIGEST"

      - name: 下线收尾（无条件 logout：ephemeral 节点注销，不留 Expired 尸体）
        if: always() && env.skip != 'true'
        run: |
          sudo tailscale logout || true
          docker logout "$(echo '${{ env.SWR_IMAGE }}' | cut -d/ -f1)" || true
          echo logged-out
