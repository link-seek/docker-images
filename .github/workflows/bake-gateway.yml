name: bake-gateway

# 薄调用：网关镜像只声明参数，逻辑全在 bake-stack.yml（共用骨架）。
# 骨架变更验证：从分支手动 dispatch 本 workflow（非 main 只试不发正式 tag）。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.litellm-gateway
      - litellm-gateway/**
      - docker/litellm-gateway/**
      - .github/workflows/bake-gateway.yml
      - .github/workflows/bake-stack.yml

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: litellm-gateway
      dockerfile: Dockerfile.litellm-gateway
      ghcr_image: ghcr.io/link-seek/litellm-gateway
      swr_image: swr.cn-north-9.myhuaweicloud.com/linkseed/litellm-gateway
      tag_mode: date-sha
      infra_stack_dir: stacks/litellm-gateway
      canary_name: litellm-guard-canary
      fine_test_hook: docker/litellm-gateway/fine-test.sh
      sync_from_repo: link-seek/infra # 过渡：正本迁回商家后删
      sync_paths: |
        stacks/litellm-gateway/config
        stacks/litellm-gateway/guard
        stacks/litellm-gateway/healthcheck
      sync_dest: litellm-gateway
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
