name: bake-gateway

# 薄调用：网关镜像只声明参数，逻辑全在 bake-stack.yml（共用骨架）。
# 骨架变更验证：从分支手动 dispatch 本 workflow（非 main 只试不发正式 tag）。

on:
  workflow_dispatch:
    inputs:
      force_retag:
        description: "版本 tag 已存在且 digest 不同时强行挪 tag（旧 pin 会断；默认红）"
        required: false
        type: boolean
        default: false
      e2e_cases:
        description: "E2E 名单（空=默认跑 models-list；skip=只验 identity）"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - docker/litellm-gateway/Dockerfile
      - k8s/litellm/**
      - docker/litellm-gateway/**
      - .github/workflows/bake-gateway.yml
      - .github/workflows/bake-stack.yml

permissions:
  contents: read
  packages: write

jobs:
  release:
    # push 没有 dispatch 参数：直接跳过，正式构建只走手动 dispatch（补齐此前缺失的守卫）
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/bake-stack.yml
    with:
      image_slug: litellm-gateway
      verification: full
      dockerfile: docker/litellm-gateway/Dockerfile
      ghcr_image: ghcr.io/link-seek/litellm-gateway
      swr_image: swr.cn-north-9.myhuaweicloud.com/link-seek/litellm-gateway
      tag_mode: date-sha
      force_retag: ${{ inputs.force_retag }}
      layer_size_limit_mb: "1000" # gateway 底座 litellm 自带 ~866MB .venv 继承层；统一 1000 门可过（该层 SWR 已在，不重复上传）
      push_temp_to_ghcr: true
      ghcr_temp_only: true
      k8s_app: litellm-gateway
      k8s_manifest_repo: "" # 同仓：manifest 已搬进本仓 k8s/（#461）
      k8s_manifest_path: k8s/litellm
      k8s_manifest_ref: main
      k8s_deploy_name: litellm-gateway
      k8s_container_name: litellm
      k8s_skip_sidecar: true
      k8s_preflight_command: '["litellm", "--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]'
      k8s_image_names: swr.cn-north-9.myhuaweicloud.com/link-seek/litellm-gateway
      k8s_secret_env_file: docker/litellm-gateway/preflight-env.conf
      k8s_secret_name: litellm-env
      k8s_namespace: litellm
      fine_test_hook: docker/litellm-gateway/fine-test.sh
      e2e_cases: ${{ inputs.e2e_cases }}
    secrets:
      gh_token: ${{ secrets.AGENT_GITHUB_TOKEN }}
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      SWR_LOGIN_USER: ${{ secrets.SWR_LOGIN_USER }}
      SWR_LOGIN_PASS: ${{ secrets.SWR_LOGIN_PASS }}
      TS_API_KEY: ${{ secrets.TS_API_KEY }}
      ENV_SMTP_PASS: ${{ secrets.PROD_SMTP_PASS }}
