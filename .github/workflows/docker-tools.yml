name: tools-image

# opencode-tools（glibc 线）构建与发布：ubuntu:24.04 + 官方 release 二进制 + 工具层 + 记忆插件。
# 每周一 02:00 UTC 巡检 anomalyco GitHub tag（v2.0.x，只采用发布超 3 天且二进制资产存在的），
# 有新 tag 才 build+push；另有 digest 校验门防止上游撤包。
# 命名：ghcr.io/link-seek/opencode-tools + SWR north-9 xieyucheng123（跟 od 混合格局一致；
# GITHUB_TOKEN 写不了跨账号个人位，GHCR 必须进组织）。
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      opencode_tag:
        description: "官方 tag（空则自动取最新，如 2.0.29，无 v 前缀也行）"
        required: false
        default: ""
      force:
        description: "强制重打（true/false）"
        required: false
        default: "false"

permissions:
  contents: write # 回写 .upstream-tools-tag
  packages: write # push ghcr.io/xieyucheng123/opencode-tools

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/link-seek/opencode-tools
  SWR_REGISTRY: swr.cn-north-9.myhuaweicloud.com
  SWR_IMAGE: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag (>3d + 二进制资产存在）
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          normalize() { echo "${1#v}"; }
          tag_date() {
            gh api "repos/anomalyco/opencode/commits/$1" --jq '.commit.committer.date' 2>/dev/null
          }
          if [ -n "${{ inputs.opencode_tag }}" ]; then
            TAG="$(normalize "${{ inputs.opencode_tag }}")"
          else
            CUTOFF="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            TAG=""
            while read -r T S; do
              D="$(tag_date "$S")"
              [ -z "$D" ] && continue
              if [[ "$D" < "$CUTOFF" ]]; then TAG="$T"; break; fi
              echo "skip $T ($D, too fresh)"
            done < <(gh api 'repos/anomalyco/opencode/tags?per_page=20' \
              --jq '[.[] | {tag: .name | ltrimstr("v"), sha: .commit.sha} | select(.tag | test("^2\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tag | split(".") | map(tonumber)) | reverse | .[] | "\(.tag) \(.sha)"' | head -5)
          fi
          [ -z "$TAG" ] && { echo "no tag older than 3 days."; exit 1; }
          # 二进制资产必须存在（x64 baseline；tag 无 release 资产就地报错，不静默）
          curl -fsSL -o /dev/null "https://opencode.ai/files/bin/${TAG}/opencode-linux-x64-baseline.tar.gz" \
            || { echo "binary asset missing for ${TAG}"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${TAG}"

      - name: Plugin/config 版本一致性检查
        run: |
          MEM_DOCKER="$(grep -oP 'ARG OPENCODE_MEM_VERSION=\K.+' Dockerfile.opencode-tools | head -n1)"
          MEM_JSONC="$(grep -oP '"plugins": \["opencode-mem@\K[0-9.]+' docker/opencode-tools/opencode.jsonc | head -n1)"
          [ -n "$MEM_DOCKER" ] && [ "$MEM_DOCKER" = "$MEM_JSONC" ] || \
            { echo "version drift: Dockerfile=$MEM_DOCKER jsonc=$MEM_JSONC"; exit 1; }
          grep -q '"autoUpdate": false' docker/opencode-tools/opencode-mem.jsonc || \
            { echo "autoUpdate must be false"; exit 1; }
          echo "versions pinned: opencode-mem@$MEM_DOCKER"

      - name: Login to SWR via token (短效，无长效密码）
        env:
          HCLOUD_AK: ${{ secrets.HCLOUD_AK }}
          HCLOUD_SK: ${{ secrets.HCLOUD_SK }}
        run: |
          mkdir -p ~/.docker
          curl -fsSL -o /tmp/hcloud.tgz "https://ap-southeast-3-hwcloudcli.obs.ap-southeast-3.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz"
          tar -xzf /tmp/hcloud.tgz -C /tmp
          echo y | /tmp/hcloud SWR CreateAuthorizationToken --cli-region=cn-north-9 --cli-access-key="$HCLOUD_AK" --cli-secret-key="$HCLOUD_SK" > /tmp/swr.json 2> /tmp/hcloud.err; echo "hcloud exit: $?"; wc -c /tmp/swr.json; head -c 120 /tmp/hcloud.err
          python3 -c "import json,os,re; t=json.loads(re.search(r'\{.*\}', open('/tmp/swr.json').read(), re.S).group(0)); assert t.get('auths'); c=os.path.expanduser('~/.docker/config.json'); d=json.load(open(c)) if os.path.exists(c) else {}; d.setdefault('auths',{}).update(t['auths']); json.dump(d,open(c,'w')); print('swr auth merged')"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (ghcr + SWR)
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          PINNED="$(grep -oP '^ARG OPENCODE_TAG=\K.+' Dockerfile.opencode-tools | head -n1)"
          if [ "${{ inputs.force }}" != "true" ] && [ "$TAG" = "$PINNED" ]; then
            echo "already at ${TAG}, skip (force to rebuild)."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # pin 超前于 resolve（如手动 bump 到更新版）时不降级覆盖
          OLDER="$(printf '%s\n%s\n' "$TAG" "$PINNED" | sort -V | head -n1)"
          if [ "${{ inputs.force }}" != "true" ] && [ "$OLDER" = "$TAG" ] && [ "$TAG" != "$PINNED" ]; then
            echo "pin $PINNED ahead of resolved $TAG, skip (force to override)."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          docker build --build-arg "OPENCODE_TAG=${TAG}" \
            -f Dockerfile.opencode-tools -t "${{ env.IMAGE }}:${TAG}" -t "${{ env.IMAGE }}:latest" .
          docker push "${{ env.IMAGE }}:${TAG}"
          docker push "${{ env.IMAGE }}:latest"
          for t in "${TAG}" latest; do
            docker tag "${{ env.IMAGE }}:${t}" "${{ env.SWR_IMAGE }}:${t}"
            docker push "${{ env.SWR_IMAGE }}:${t}"
          done
          # Dockerfile 里 pin 前移并回写，main 上留痕
          sed -i "s/^ARG OPENCODE_TAG=.*/ARG OPENCODE_TAG=${TAG}/" Dockerfile.opencode-tools
          echo "${TAG}" > .upstream-tools-tag

      - name: Commit pin (skip 时跳过）
        if: env.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile.opencode-tools .upstream-tools-tag
          git diff --cached --quiet || git commit -m "chore(tools): 跟进 opencode ${{ steps.upstream.outputs.tag }}"
          git push
