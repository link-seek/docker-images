name: tools-image

# opencode-tools（glibc 线）构建与发布：ubuntu:24.04 + 官方 release 二进制 + 工具层 + 记忆插件。
# 每周一 02:00 UTC 巡检 anomalyco GitHub tag（v2.0.x，只采用发布超 3 天且二进制资产存在的），
# 有新 tag 才 build+push；另有 digest 校验门防止上游撤包。
# 命名：ghcr.io/xieyucheng123/opencode-tools + SWR north-9 xieyucheng123（沿用旧地址，部署零改动）。
# sync-back：dispatch 参数只当信使，正本是 git 里的 pin 值（Dockerfile ARG + opencode.jsonc plugins）；
# 构建成功后实际采用的 tag 自动回写上述文件，有变化才提交，无变化不空提交。不碰 secret。
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      opencode_tag:
        description: "官方 tag（信使参数：空则自动取最新，如 2.0.29，无 v 前缀也行；构建成功后回写 Dockerfile pin + .upstream-tools-tag）"
        required: false
        type: string
        default: ""
      opencode_mem_version:
        description: "记忆插件版本（信使参数：空则用 Dockerfile 里 ARG OPENCODE_MEM_VERSION 的 pin 值；成功后回写 Dockerfile + opencode.jsonc plugins）"
        required: false
        type: string
        default: ""
      force:
        description: "强制重打（true 则跳过“已是该版本/ pin 超前”检查；只影响本次构建，不改 pin）"
        required: false
        type: choice
        options: ["false", "true"]
        default: "false"
      run_test:
        description: "构建成功后是否联动触发 test-memory.yml 记忆集成测试（true/false）"
        required: false
        type: choice
        options: ["true", "false"]
        default: "true"

permissions:
  contents: write # 回写 .upstream-tools-tag
  packages: write # push ghcr.io/xieyucheng123/opencode-tools

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/xieyucheng123/opencode-tools
  SWR_REGISTRY: swr.cn-north-9.myhuaweicloud.com
  SWR_IMAGE: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/opencode-tools

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream tag (>3d + 二进制资产存在）
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          normalize() { echo "${1#v}"; }
          tag_date() {
            gh api "repos/anomalyco/opencode/commits/$1" --jq '.commit.committer.date' 2>/dev/null
          }
          if [ -n "${{ inputs.opencode_tag }}" ]; then
            TAG="$(normalize "${{ inputs.opencode_tag }}")"
          else
            CUTOFF="$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            TAG=""
            while read -r T S; do
              D="$(tag_date "$S")"
              [ -z "$D" ] && continue
              if [[ "$D" < "$CUTOFF" ]]; then TAG="$T"; break; fi
              echo "skip $T ($D, too fresh)"
            done < <(gh api 'repos/anomalyco/opencode/tags?per_page=20' \
              --jq '[.[] | {tag: .name | ltrimstr("v"), sha: .commit.sha} | select(.tag | test("^2\\.[0-9]+\\.[0-9]+$"))] | sort_by(.tag | split(".") | map(tonumber)) | reverse | .[] | "\(.tag) \(.sha)"' | head -5)
          fi
          [ -z "$TAG" ] && { echo "no tag older than 3 days."; exit 1; }
          # 二进制资产必须存在（x64 baseline；tag 无 release 资产就地报错，不静默）
          curl -fsSL -o /dev/null "https://opencode.ai/files/bin/${TAG}/opencode-linux-x64-baseline.tar.gz" \
            || { echo "binary asset missing for ${TAG}"; exit 1; }
          # 记忆插件版本：dispatch 只当信使，空则读 git 里 Dockerfile 的 pin 正本
          if [ -n "${{ inputs.opencode_mem_version }}" ]; then
            MEM_VERSION="${{ inputs.opencode_mem_version }}"
            MEM_VERSION="${MEM_VERSION#v}"
          else
            MEM_VERSION="$(grep -oP '^ARG OPENCODE_MEM_VERSION=\K.+' Dockerfile.opencode-tools | head -n1)"
          fi
          [ -n "$MEM_VERSION" ] || { echo "cannot resolve opencode-mem version"; exit 1; }
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "mem_version=${MEM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: ${TAG} + opencode-mem@${MEM_VERSION}"

      - name: Plugin/config 版本一致性检查
        run: |
          MEM_DOCKER="$(grep -oP 'ARG OPENCODE_MEM_VERSION=\K.+' Dockerfile.opencode-tools | head -n1)"
          MEM_JSONC="$(grep -oP '"plugins": \["opencode-mem@\K[0-9.]+' docker/opencode-tools/opencode.jsonc | head -n1)"
          MEM_WANT="${{ steps.upstream.outputs.mem_version }}"
          if [ -n "${{ inputs.opencode_mem_version }}" ] && [ "$MEM_WANT" != "$MEM_JSONC" ]; then
            # dispatch 信使值与正本不一致：本次构建用信使值，成功后 sync-back 对齐，不在此报错
            echo "dispatch override: mem ${MEM_WANT} (pin: docker=${MEM_DOCKER} jsonc=${MEM_JSONC}), will sync-back after green build"
          else
            [ -n "$MEM_DOCKER" ] && [ "$MEM_DOCKER" = "$MEM_JSONC" ] || \
              { echo "version drift: Dockerfile=$MEM_DOCKER jsonc=$MEM_JSONC"; exit 1; }
          fi
          grep -q '"autoUpdate": false' docker/opencode-tools/opencode-mem.jsonc || \
            { echo "autoUpdate must be false"; exit 1; }
          echo "versions pinned: opencode-mem@${MEM_WANT}"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Login to SWR
        run: echo "${{ secrets.SWR_LOGIN_PASS }}" | docker login ${{ env.SWR_REGISTRY }} -u "${{ secrets.SWR_LOGIN_USER }}" --password-stdin

      - name: Build and push (ghcr + SWR)
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          MEM_VERSION="${{ steps.upstream.outputs.mem_version }}"
          PINNED="$(grep -oP '^ARG OPENCODE_TAG=\K.+' Dockerfile.opencode-tools | head -n1)"
          if [ "${{ inputs.force }}" != "true" ] && [ "$TAG" = "$PINNED" ]; then
            echo "already at ${TAG}, skip (force to rebuild)."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # pin 超前于 resolve（如手动 bump 到更新版）时不降级覆盖
          OLDER="$(printf '%s\n%s\n' "$TAG" "$PINNED" | sort -V | head -n1)"
          if [ "${{ inputs.force }}" != "true" ] && [ "$OLDER" = "$TAG" ] && [ "$TAG" != "$PINNED" ]; then
            echo "pin $PINNED ahead of resolved $TAG, skip (force to override)."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          docker build --build-arg "OPENCODE_TAG=${TAG}" --build-arg "OPENCODE_MEM_VERSION=${MEM_VERSION}" \
            -f Dockerfile.opencode-tools -t "${{ env.IMAGE }}:${TAG}" -t "${{ env.IMAGE }}:latest" .
          docker push "${{ env.IMAGE }}:${TAG}"
          docker push "${{ env.IMAGE }}:latest"
          for t in "${TAG}" latest; do
            docker tag "${{ env.IMAGE }}:${t}" "${{ env.SWR_IMAGE }}:${t}"
            docker push "${{ env.SWR_IMAGE }}:${t}"
          done
          # sync-back 落账：本次实际采用的 tag 回写 git 正本（Dockerfile pin + tag 文件 + jsonc plugins pin）
          sed -i "s/^ARG OPENCODE_TAG=.*/ARG OPENCODE_TAG=${TAG}/" Dockerfile.opencode-tools
          sed -i "s/^ARG OPENCODE_MEM_VERSION=.*/ARG OPENCODE_MEM_VERSION=${MEM_VERSION}/" Dockerfile.opencode-tools
          sed -i -E "s/\"plugins\": \[\"opencode-mem@[0-9.]+\"\]/\"plugins\": [\"opencode-mem@${MEM_VERSION}\"]/" docker/opencode-tools/opencode.jsonc
          echo "${TAG}" > .upstream-tools-tag

      - name: Commit pin (skip 时跳过）
        if: env.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Dockerfile.opencode-tools .upstream-tools-tag docker/opencode-tools/opencode.jsonc
          git diff --cached --quiet || git commit -m "chore(tools): 跟进 opencode ${{ steps.upstream.outputs.tag }} + mem ${{ steps.upstream.outputs.mem_version }}"
          git push

      - name: 联动触发记忆集成测试（run_test 开关）
        # test-memory 联动：构建成功后按本次实际 tag 起测；run_test=false 则跳过
        if: env.skip != 'true' && inputs.run_test != 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run test-memory.yml --ref "${{ github.ref_name }}" \
            -f image_tag="${{ env.SWR_IMAGE }}:${{ steps.upstream.outputs.tag }}" \
            -f opencode_tag="${{ steps.upstream.outputs.tag }}"
