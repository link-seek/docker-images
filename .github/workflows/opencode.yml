name: opencode

# 试水：评论触发 opencode 改文件开 PR，只动文本，不碰构建密钥。
# 构建流水线全是 schedule/手动触发，合 PR 不会自动打镜像。
# 前提：repo settings 需有 OPENCODE_API_KEY（Go 订阅 key）。
# 不装 opencode-agent App，用 GITHUB_TOKEN 直连模式。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        # use_github_token 模式下 push 靠 checkout 留下的 GITHUB_TOKEN，
        # 不能设 persist-credentials: false（那是 OIDC App 模式的写法）。
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set git identity for opencode commits
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
