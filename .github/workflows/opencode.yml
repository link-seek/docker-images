name: opencode

# 评论/指派触发 opencode 改文件开 PR，只动文本，不碰构建密钥。
# 身份：Xyc123y 长期 PAT（org secret AGENT_GITHUB_TOKEN，classic repo+workflow）。
# App 路线已废（见 master#65）：App 不能被指派，一律真人号。
# 指派即开工：assignee 在 AI_ASSIGNEES 变量名单里（逗号分隔）；/oc 评论触发保留，
# 评论门只认 OWNER/MEMBER（组织外 collaborator 喊不动）。
# 注：issues.assigned 发起人调 API 时平台已要求 push 权限，故不验 sender association。
# 构建流水线全是 schedule/手动触发，合 PR 不会自动打镜像。
# 前提：repo settings 需有 OPENCODE_API_KEY（Go 订阅 key）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

jobs:
  opencode:
    if: |
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'assigned' &&
       contains(format(',{0},', vars.AI_ASSIGNEES), format(',{0},', github.event.assignee.login)))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        # push 改 workflow 文件的分支走 Xyc PAT（classic repo+workflow，带 workflows 写权；
        # GITHUB_TOKEN 推会被拒，且文件里声明不了 workflows 权）。
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.AGENT_GITHUB_TOKEN }}

      - name: Set git identity for opencode commits
        run: |
          git config --global user.name "Xyc123y"
          git config --global user.email "46583439+Xyc123y@users.noreply.github.com"

      - name: Run OpenCode
        if: github.event_name != 'issues'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3
          use_github_token: true

      - name: Run OpenCode for assigned issue
        if: github.event_name == 'issues'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3
          use_github_token: true
          prompt: |
            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
