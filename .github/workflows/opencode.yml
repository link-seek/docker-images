name: opencode

# 评论/指派触发 opencode 改文件开 PR，只动文本，不碰构建密钥。
# 身份：link-seek-bot App token（app-id 4365765 + org secret LINK_SEEK_BOT_KEY），PAT 已退役。
# 指派即开工：assignee 在 AI_ASSIGNEES 变量名单里（逗号分隔，由 infra onboard-account
# 流水线维护）；/oc 评论触发保留。注：普通 App bot 不能当 assignee（平台限制），
# 名单里只放真人号/机器号。
# 构建流水线全是 schedule/手动触发，合 PR 不会自动打镜像。
# 前提：repo settings 需有 OPENCODE_API_KEY（Go 订阅 key）。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [assigned]

jobs:
  opencode:
    if: |
      ((github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
       (contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')) &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' &&
       github.event.action == 'assigned' &&
       contains(format(',{0},', vars.AI_ASSIGNEES), format(',{0},', github.event.assignee.login)) &&
       (github.event.sender.author_association == 'OWNER' ||
        github.event.sender.author_association == 'MEMBER' ||
        github.event.sender.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: "4365765"
          private-key: ${{ secrets.LINK_SEEK_BOT_KEY }}

      - name: Checkout repository
        # push 改 workflow 文件的分支走 App token（带 workflows:write，
        # GITHUB_TOKEN 推会被拒，且文件里声明不了 workflows 权），API 调用同样走它。
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Set git identity for opencode commits
        run: |
          git config --global user.name "link-seek-bot[bot]"
          git config --global user.email "link-seek-bot[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
