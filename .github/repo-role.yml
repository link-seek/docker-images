# docker-images 角色（商家）：只讲本仓，不管他仓。
version: 1
mission: 对运行结果负责——业务逻辑 + 镜像 + 清单 + 发版闭环，digest 即行为版本号。
accept:
  - 烘焙线（打包专用）：docker 下各镜像目录的 Dockerfile、bake 流水线、hook 与配置；版本走 dispatch 必填传入
  - 应用配置线（应用配置专用）：k8s 下各应用的 manifest、env、pin、digest；与镜像同一 PR，合 main 即对账上线
reject:
  - 本仓之外的机器与底座：节点、系统、存储、网段、隧道、DNS
  - 上游本体缺陷：官方镜像与 CLI 自身 bug
notes: 门禁只验货不碰值；改门禁本身只收人工，intake 一律转 needs-human；边界不清或含真值转人工；FILECHECK 只加权；不用反引号。
