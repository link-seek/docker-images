name: Intake
description: File an issue for triage (robot-owned, versioned with bot)
body:
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: Why this issue? One or two lines.
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 现状
      description: What happens now? Logs, links, versions.
    validations:
      required: true
  - type: textarea
    id: expectation
    attributes:
      label: 期望
      description: What counts as done?
    validations:
      required: true
  - type: textarea
    id: affected
    attributes:
      label: 影响文件
      description: Repo-relative paths, one per line. Optional. Example: k8s/opencode-team/deployment.yaml
      placeholder: |
        k8s/opencode-team/deployment.yaml
      render: text
    validations:
      required: false
