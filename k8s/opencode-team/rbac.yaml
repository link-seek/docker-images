# k8s/opencode-team 自验只读 RBAC（照 opencode-xieyucheng 精简：只要本 ns 读写自查）。
# 范围：本 ns 读 pod/deploy/rs/event/configmap/svc/pvc + flux 的 GitRepository/Kustomization 状态。
# 红线：只 get/list/watch，不含 secrets/exec/create/patch/delete；密钥永不进日志。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencode-self-verify
  namespace: opencode-team
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps", "services", "endpoints", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencode-self-verify
  namespace: opencode-team
subjects:
  - kind: ServiceAccount
    name: default
    namespace: opencode-team
roleRef:
  kind: Role
  name: opencode-self-verify
  apiGroup: rbac.authorization.k8s.io
