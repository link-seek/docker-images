# k8s/opencode-team entrypoint（由 k8s/opencode-xieyucheng/entrypoint 精简：去 hcloud/tailscale）。
# team 镜像无 hcloud 二进制、无容器内 tailscaled（入网走 operator 代理）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-entrypoint
  namespace: opencode-team
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    # 只读根文件系统（deployment.securityContext.readOnlyRootFilesystem=true）：
    # 可写只有 /workspace、数据卷 /root/.local/share/opencode、以及 emptyDir /tmp。
    # 把 HOME 指到 /tmp，并用 XDG_* 把 opencode 的配置/数据钉回镜像与数据卷位置。
    export HOME=/tmp/home
    export XDG_CONFIG_HOME=/root/.config
    export XDG_DATA_HOME=/root/.local/share
    export XDG_STATE_HOME=/tmp/state
    export XDG_CACHE_HOME=/tmp/cache
    mkdir -p "$HOME" /tmp/cache /tmp/state
    if [ "${PIPELINE_MANAGED:-}" != "true" ]; then
      echo 'FATAL: .env not pipeline-managed (PIPELINE_MANAGED!=true). Refusing to start.' >&2
      exit 1
    fi
    if [ ! -d /workspace/.git ]; then
      git init -b main /workspace >/dev/null 2>&1
      git -C /workspace config user.name opencode-team
      git -C /workspace config user.email opencode-team@local
      git -C /workspace commit --allow-empty -m init >/dev/null 2>&1
    fi
    # 组织记忆 trial：cognee 已烘焙进镜像 opencode.jsonc（mcp.servers.cognee），
    # 运行期不再改写 /root/.config（只读根文件系统下不可写）。
    # obsutil 配置：华为云 AK/SK 统一 HCLOUD_AK/HCLOUD_SK（旧名 OBS_AK/OBS_SK 兜底），
    # 走 env 链式取密钥（OBS_ACCESS_KEY_ID/SECRET，不落盘），配置文件写 HOME（/tmp/home）。
    _OBS_AK="${HCLOUD_AK:-${OBS_AK:-}}"; _OBS_SK="${HCLOUD_SK:-${OBS_SK:-}}"
    if [ -n "$_OBS_AK" ] && [ -n "$_OBS_SK" ]; then
      export OBS_ACCESS_KEY_ID="$_OBS_AK" OBS_SECRET_ACCESS_KEY="$_OBS_SK"
      printf 'endpoint=%s\nautoChooseSecurityProvider=true\nutilLogLevel=ERROR\n' "${OBS_ENDPOINT:-https://obs.cn-north-9.myhuaweicloud.com}" > "$HOME/.obsutilconfig"
      chmod 600 "$HOME/.obsutilconfig"
    fi
    exec opencode "$@"
