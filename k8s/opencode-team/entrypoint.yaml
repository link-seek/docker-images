# k8s/opencode-team entrypoint（由 k8s/opencode-xieyucheng/entrypoint 精简：去 hcloud/tailscale）。
# team 镜像无 hcloud 二进制、无容器内 tailscaled（入网走 operator 代理）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-entrypoint
  namespace: opencode-team
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    # 只读根文件系统（securityContext.readOnlyRootFilesystem=true）：
    # /root 由可写 emptyDir 承接（initContainer 已把镜像内 /root/. 拷入），系统目录只读；
    # /workspace、/root/.local/share/opencode（数据卷）、/tmp 可写。
    export TMPDIR=/tmp
    : "${HOME:=/root}"; export HOME
    if [ "${PIPELINE_MANAGED:-}" != "true" ]; then
      echo 'FATAL: .env not pipeline-managed (PIPELINE_MANAGED!=true). Refusing to start.' >&2
      exit 1
    fi
    if [ ! -d /workspace/.git ]; then
      git init -b main /workspace >/dev/null 2>&1
      git -C /workspace config user.name opencode-team
      git -C /workspace config user.email opencode-team@local
      git -C /workspace commit --allow-empty -m init >/dev/null 2>&1
    fi
    # 组织记忆 trial：cognee 集中式（ClusterIP 集群内直达，无鉴权；隔离靠 dataset 约定）。
    # team 只用 trial-team（私库）+ org-settled（共享），不用 trial-yingxin。
    # 注意：opencode.json 由 opencode.jsonc 落盘，含 // 全行注释；json.load 直接读会炸，
    # 必须先剥注释再解析，否则 except 分支 d={} 会抹掉整份配置（白名单/模型全丢实锤）。
    python3 - <<'PY' 2>/dev/null || true
    import json, re
    p='/root/.config/opencode/opencode.json'
    raw=open(p).read() if __import__('os').path.exists(p) else '{}'
    raw=re.sub(r'^[ \t]*//.*$', '', raw, flags=re.M)
    try:
        d=json.loads(raw)
    except Exception:
        d={}
    m=d.setdefault('mcp',{}).setdefault('servers',{});
    cog={"type":"remote","url":"http://cognee.cognee-trial.svc.cluster.local:8000/mcp","oauth":False,"timeout":{"startup":45000,"catalog":60000,"execution":600000}}
    if m.get('cognee')!=cog:
        m['cognee']=cog
        json.dump(d,open(p,'w'),indent=2)
        print('cognee-mcp-injected')
    PY
    # obsutil 配置：env 全量（OBS_AK/OBS_SK 必填，OBS_ENDPOINT 缺省华北九；密钥不进镜像）。
    if [ -n "${OBS_AK:-}" ] && [ -n "${OBS_SK:-}" ]; then
      printf 'endpoint=%s\nak=%s\nsk=%s\ntoken=\n' "${OBS_ENDPOINT:-https://obs.cn-north-9.myhuaweicloud.com}" "$OBS_AK" "$OBS_SK" > /root/.obsutilconfig
      chmod 600 /root/.obsutilconfig
    fi
    exec opencode "$@"
