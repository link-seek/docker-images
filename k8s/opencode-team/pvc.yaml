# k8s/opencode-team 数据卷（local-path-provisioner，RWO；首调度定节点，之后跟卷走≈软固定）。
# 41 上 helper 镜像曾因 docker.io 被墙拉不动（见 opencode-xieyucheng 注释）；
# 若本 trial 卡 Pending，先看 describe pvc，再决定加 .69 亲和。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prod-work
  namespace: opencode-team
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
