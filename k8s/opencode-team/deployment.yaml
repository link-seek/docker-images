# k8s/opencode-team 主 Deployment（trial）。
# 两个独立 Pod：opencode（部门共用）+ browserless（远程浏览器，agent-browser 经 CDP 连）。
# 说明：
# - browserless 仓库名带 chrome：bake-stack 新预检按镜像名含 chrome 抓 sidecar 行做 k3d import，
#   缺该子串会 PREFLIGHT-RED；改骨架影响全线，故命名适配。
# - 镜像 tag 即行为版本：首 bake 出 tag 后改 digest pin 发 PR（与旧线同语义）。
# - BROWSER_CDP_URL 指向同 ns browserless Service；TOKEN 经 $(BROWSERLESS_TOKEN) 展开（k8s env 引用，要求先定义）。
# - Secret opencode-team-env 不进仓：Flux 对账前先经 pipeline mint（缺 Secret 时 pod 报 CreateContainerConfigError，属预期）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode-team
  labels:
    app: opencode-team
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本+本地卷：滚动无意义，重建即切换。
  selector:
    matchLabels:
      app: opencode-team
  template:
    metadata:
      labels:
        app: opencode-team
    spec:
      # trial 先钉 .69（zhangzhirui）：41 上 local-path helper 镜像 ImagePullBackOff（docker.io 被墙），
      # PVC 调度到 41 永 Pending（实测）。41 镜像源修好后再摘固定。
      nodeSelector:
        kubernetes.io/hostname: ecs-ies-euleros-jmupervm-zhangzhirui
      imagePullSecrets:
        - name: swr-pull
      containers:
        - name: opencode
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-team@sha256:a89419303f92956c7dc6ee5efc5b615df97ebca59cf620514ef0725b7bd38d61
          command: ["/bin/sh", "/entrypoint/entrypoint.sh"]
          args: ["serve", "--port", "4097", "--hostname", "0.0.0.0"]
          ports:
            - {name: http, containerPort: 4097}
          env:
            - {name: PIPELINE_MANAGED, value: "true"}
            - {name: LITELLM_BASE_URL, value: "http://litellm-gateway.litellm.svc.cluster.local:4000"}
            - {name: SSH_TARGETS, value: "mesh-hw-21 mesh-hw-41"}
            - {name: SMTP_HOST, value: smtp.163.com}
            - {name: SMTP_PORT, value: "465"}
            - {name: SMTP_USER, value: 122306789@163.com}
            - {name: SMTP_FROM, value: 122306789@163.com}
            - {name: MAIL_DEFAULT_TO, value: xieyucheng@outlook.com}
            - name: BROWSERLESS_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: BROWSERLESS_TOKEN}}
            - {name: BROWSER_CDP_URL, value: "ws://browserless.opencode-team.svc.cluster.local:3000/chromium?token=$(BROWSERLESS_TOKEN)"}
            - {name: OPEN_DESIGN_BROWSER_URL, value: "ws://browserless.opencode-team.svc.cluster.local:3000/chromium?token=$(BROWSERLESS_TOKEN)"}
            - name: LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: LITELLM_API_KEY}}
            - name: MAAS_KEY
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: MAAS_KEY}}
            - name: GH_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: GH_TOKEN}}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: OPENCODE_SERVER_PASSWORD}}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: CLOUDFLARE_API_TOKEN}}
            - name: CF_AI_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: CF_AI_TOKEN}}
            - name: SMTP_PASS
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: SMTP_PASS}}
          volumeMounts:
            - {name: prod-work, mountPath: /workspace}
            - {name: prod-data, mountPath: /root/.local/share/opencode}
            - {name: entrypoint, mountPath: /entrypoint}
          readinessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 3000m, memory: 8Gi}
      volumes:
        # hostPath 直挂（照 opencode-xieyucheng）：local-path helper 在 41 ImagePullBackOff、
        # 在 .69 上 create 也超时（实测），PVC 此刻全簇不可用；单机 RWO 等价，kubelet DirectoryOrCreate。
        # 代价：数据跟节点走（已钉 .69）；41 镜像源/local-path 修好后再评估迁回 PVC。
        - name: prod-work
          hostPath: {path: /var/lib/opencode-team/work, type: DirectoryOrCreate}
        - name: prod-data
          hostPath: {path: /var/lib/opencode-team/data, type: DirectoryOrCreate}
        - name: entrypoint
          configMap: {name: opencode-entrypoint, defaultMode: 0755}
---
# browserless 独立 Pod（与 opencode 分开部署，经 Service 发现）。
# /dev/shm 必须 2g（Docker 默认 64M 会崩 Chrome；k8s 用 Memory emptyDir 挂）。
# 探针用 tcpSocket：/pressure 需 TOKEN 鉴权，secret 值无法插进 httpGet path。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: opencode-team
  labels:
    app: browserless
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本：滚动无意义。
  selector:
    matchLabels:
      app: browserless
  template:
    metadata:
      labels:
        app: browserless
    spec:
      imagePullSecrets:
        - name: swr-pull
      containers:
        - name: browserless
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/browserless-chrome-cjk@sha256:d9040011a12b23af21637e21be2b22e6ba144ad4b5f458dbc803a367aca9e92d
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: HOST, value: "0.0.0.0"}
            - name: TOKEN
              valueFrom: {secretKeyRef: {name: opencode-team-env, key: BROWSERLESS_TOKEN}}
            - {name: CONCURRENT, value: "10"}
            - {name: QUEUED, value: "10"}
            - {name: TIMEOUT, value: "30000"}
            - {name: HEALTH, value: "true"}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
          readinessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 4000m, memory: 8Gi}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
