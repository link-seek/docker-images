# IngressRoute（唯一路由；web(80) 由 Traefik 全局 301→https）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    helm.sh/chart: opencode-0.1.0
    app.kubernetes.io/name: opencode
    app.kubernetes.io/instance: opencode-team
    app.kubernetes.io/managed-by: Helm
  name: team-agent-staging-tls
  namespace: opencode-team
  annotations:
    route-comment: staging DNS-01 via IngressRoute (Ingress provider can't store LE
      certs)
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`team-agent.xieyucheng.top`)
    kind: Rule
    services:
    - name: opencode
      port: 4097
  # 内网入口（HW VPC 内私有区 internal.linkseek.net.cn 解析到此内网 Traefik）
  - match: Host(`team-agent.internal.linkseek.net.cn`)
    kind: Rule
    services:
    - name: opencode
      port: 4097
  tls:
    certResolver: le-prod
    domains:
    - main: team-agent.xieyucheng.top
    - main: team-agent.internal.linkseek.net.cn
