# k8s/opencode-team Services。
# browserless：集群内 Service（opencode 经短名 browserless:3000 访问；不对集群外暴露）。
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode-team
spec:
  selector: {app: opencode-team}
  ports:
    - {name: http, port: 4097, targetPort: 4097}
---
apiVersion: v1
kind: Service
metadata:
  name: browserless
  namespace: opencode-team
spec:
  selector: {app: browserless}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
# opencode-vpc：VPC 内网口（k3s ServiceLB，节点 IP:44097 直达）。2026-11-22 曾退役为 ClusterIP，
# 2026-11-23 恢复为 LoadBalancer（仅内网节点，节点已打 enablelb=true，公网/边缘节点不绑），纯 HTTP、内网直连用。
apiVersion: v1
kind: Service
metadata:
  name: opencode-vpc
  namespace: opencode-team
spec:
  type: LoadBalancer
  selector: {app: opencode-team}
  ports:
    - {name: http, port: 44097, targetPort: 4097}
