# k8s/opencode-team Services。
# browserless：集群内 Service（opencode 经短名 browserless:3000 访问；不对集群外暴露）。
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode-team
spec:
  selector: {app: opencode-team}
  ports:
    - {name: http, port: 4097, targetPort: 4097}
---
apiVersion: v1
kind: Service
metadata:
  name: browserless
  namespace: opencode-team
spec:
  selector: {app: browserless}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
---
# opencode-vpc：历史 VPC 内网口（原 k3s ServiceLB，节点 IP 直达）。2026-11-22 退役外部暴露：
# 无任何 Ingress/IngressRoute/pod 引用、无活跃连接，降级为 ClusterIP（不再占节点 hostPort / 不再暴露节点 IP）。
# 如后续确认彻底无用可直接删除。
apiVersion: v1
kind: Service
metadata:
  name: opencode-vpc
  namespace: opencode-team
spec:
  type: ClusterIP
  selector: {app: opencode-team}
  ports:
    - {name: http, port: 44097, targetPort: 4097}
