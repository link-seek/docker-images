# 预检 overlay（tools 线，2026-11-20 加）：base = 生产 k8s/opencode-xieyucheng。
# tools 镜像只有两个生产实例（xieyucheng / yingxin），没有独立的 "opencode" 部署；
# bake-tools 预检拿 xieyucheng（本仓开发实例）当 base，起在 k3d 里验证同货。
# 只做三件事，生产目录零改动、看不见本目录：
#   1) 去 nodeSelector（k3d 没有 41/.69 那种固定节点名）
#   2) hostPath → emptyDir（预检机没有 /data/opencode-xieyucheng）
#   3) 删生产 enc Secret（test key 解不开）与 Ingress（k3d 无对应 class/TLS）
# Secret opencode-xieyucheng-env 由骨架按 preflight-env.conf 现 mint，不在这里声明。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../opencode-xieyucheng
patches:
  - target:
      kind: Secret
      name: opencode-xieyucheng-env
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: opencode-xieyucheng-env
        namespace: opencode-xieyucheng
  - target:
      kind: Ingress
      name: opencode
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: opencode
        namespace: opencode-xieyucheng
  # 浏览器已迁本 ns 独立 browserless Deployment（link-seek 镜像，预检可拉）；预检不跑 browser e2e，
  # 副本置 0 即不拉起（也避免它依赖预检里被删/重 mint 的 opencode-xieyucheng-env）。
  - target:
      kind: Deployment
      name: browserless
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: opencode
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: prod-work
            emptyDir: {}
          - name: prod-data
            emptyDir: {}
          - name: entrypoint
            configMap:
              name: opencode-entrypoint
              defaultMode: 493
