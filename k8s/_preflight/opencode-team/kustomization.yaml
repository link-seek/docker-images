# 预检 overlay（team 线）：base = 生产 k8s/opencode-team，起在 k3d 里验证同货。
# 只做必要调整（生产目录零改动）：
#   1) 去 opencode 的 nodeSelector（生产钉 .69 主机名，k3d 不匹配必 Pending）
#   2) hostPath → emptyDir（预检机无 /var/lib/opencode-team）
#   3) browserless 副本置 0（预检机不注入 browserless-env，置 0 即不拉起；e2e 用例不依赖它）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../opencode-team
patches:
  - target: {kind: Deployment, name: opencode}
    patch: |-
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - name: prod-work
            emptyDir: {}
          - name: prod-data
            emptyDir: {}
          - name: entrypoint
            configMap: {name: opencode-entrypoint, defaultMode: 493}
          - name: root-home
            emptyDir: {}
          - name: tmp
            emptyDir: {}
  - target: {kind: Deployment, name: browserless}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
