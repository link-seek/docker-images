# 上游直透（对标 Caddy handle @goList/@zenList → https://opencode.ai）。
# 直连上游 443（不经东京中继；中继仅供 litellm 网关自用，因部分模型按来源地区放行）。
# Traefik 经 HW 出口直连上游（HW→opencode.ai 已验 200）；SNI=opencode.ai 由 ServersTransport 保证。
apiVersion: v1
kind: Service
metadata:
  name: opencode-ai
  namespace: litellm
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: litellm-opencode-ai@kubernetescrd
spec:
  type: ExternalName
  externalName: opencode.ai
  # 直连 443（不再经 relay 的 14443）。
  ports:
    - name: https
      port: 443
      protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: opencode-ai
  namespace: litellm
spec:
  serverName: opencode.ai
