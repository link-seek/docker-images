# litellm prod（3 路由共用一张证；唯一路由，web(80) 由 Traefik 全局 301→https）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-staging-tls
  namespace: litellm
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`litellm.linkseek.net.cn`) && PathPrefix(`/go/v1/models`)
      kind: Rule
      middlewares:
        - name: litellm-go-rewrite
        - name: litellm-go-headers
      services:
        - name: opencode-ai
          port: 443
    - match: Host(`litellm.linkseek.net.cn`) && PathPrefix(`/v1/models`)
      kind: Rule
      middlewares:
        - name: litellm-zen-rewrite
        - name: litellm-zen-headers
      services:
        - name: opencode-ai
          port: 443
    - match: Host(`litellm.linkseek.net.cn`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: litellm-gateway
          port: 4000
  tls:
    certResolver: le-prod
    domains:
      - main: litellm.linkseek.net.cn
