# litellm /v1/models → 上游透传改写＋去鉴权头（对标 Caddy handle @zenList）。
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: litellm-zen
  namespace: litellm
spec:
  replacePathRegex:
    regex: ^/v1/models(.*)$
    replacement: /inference/v1/models$1
  headers:
    customRequestHeaders:
      Host: "opencode.ai"
      Authorization: ""
      X-Api-Key: ""
