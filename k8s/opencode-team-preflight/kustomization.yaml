# 预检 overlay：与生产同机制（Flux SOPS 解密），不同钥匙＋不同值。
# 结构（两级，避开同名资源歧义）：
#   no-secrets/   → base 减去两个生产 enc Secret（删除目标唯一）
#   本层           → 加 test enc（dummy TOKEN，与 hook 内 dummy 一致），Flux 解密
# 生产 kustomization（k8s/opencode-team）零改动，看不见本目录。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - no-secrets
  - browserless-env.enc.yaml
