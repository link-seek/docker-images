# 内层：去掉 base 里两个生产 enc Secret（test key 解不开生产密文，会红）。
# opencode-team-env 由骨架按模板 mint（真外部 key＋dummy，Flux 不管）；
# browserless-env 由上层 test enc 经 Flux 解密接管。
# $patch: delete 整资源删除（kustomize 标准手法）；本层无新增资源，删除目标唯一，无歧义。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../opencode-team
patches:
  - target:
      kind: Secret
      name: browserless-env
      namespace: opencode-team
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: browserless-env
        namespace: opencode-team
  - target:
      kind: Secret
      name: opencode-team-env
      namespace: opencode-team
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: opencode-team-env
        namespace: opencode-team
