# Cognee 1.6.8: REST API (sole DB writer) + MCP proxy (API mode).
# - API: /api/v1/auth, /datasets, /remember, /recall, ...
# - MCP: keeps the existing :8000/mcp contract for opencode-team; proxies to the API.
# - One PVC, one writer. EBAC + JWT + hashed API keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee
  namespace: cognee-trial
  labels:
    app: cognee
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cognee
  template:
    metadata:
      annotations:
        cognee-rest: "2026-11-27"
      labels:
        app: cognee
    spec:
      containers:
        - name: cognee-mcp
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/cognee-mcp-trial@sha256:5e6d33f5159b3fa4dd81aca21882d30bb1d0a684331578a9ae58a3bc76ff50ae
          command: ["/app/.venv/bin/cognee-mcp"]
          args:
            - --transport
            - http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --api-url
            - http://127.0.0.1:8001
            - --api-token
            - $(COGNEE_MCP_API_TOKEN)
            - --api-auth-scheme
            - x-api-key
            - --tool-mode
            - default
            - --no-migration
          env:
            - name: COGNEE_MCP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cognee-trial-env
                  key: COGNEE_MCP_API_TOKEN
            - {name: COGNEE_SKIP_CONNECTION_TEST, value: "true"}
            - {name: TELEMETRY_DISABLED, value: "true"}
            - {name: MCP_ALLOWED_HOSTS, value: "cognee:*,cognee.cognee-trial:*,cognee.cognee-trial.svc:*,cognee.cognee-trial.svc.cluster.local:*"}
          ports:
            - {name: mcp, containerPort: 8000}
          readinessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}

        - name: cognee-api
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/cognee-mcp-trial@sha256:5e6d33f5159b3fa4dd81aca21882d30bb1d0a684331578a9ae58a3bc76ff50ae
          command:
            - /app/.venv/bin/uvicorn
            - cognee.api.client:app
            - --host
            - 0.0.0.0
            - --port
            - "8001"
            - --workers
            - "1"
          env:
            - {name: ENABLE_BACKEND_ACCESS_CONTROL, value: "true"}
            - {name: REQUIRE_AUTHENTICATION, value: "true"}
            - {name: HASH_API_KEY, value: "true"}
            - {name: COGNEE_SKIP_CONNECTION_TEST, value: "true"}
            - {name: TELEMETRY_DISABLED, value: "true"}
            - {name: COGNEE_LOG_SEARCH_HISTORY, value: "false"}
            - {name: SYSTEM_ROOT_DIRECTORY, value: "/cognee-storage/system"}
            - {name: DATA_ROOT_DIRECTORY, value: "/cognee-storage/data"}
            - {name: LLM_PROVIDER, value: "custom"}
            - {name: LLM_MODEL, value: "openai/muse-spark-1.3-contributor"}
            - {name: LLM_ENDPOINT, value: "http://litellm-gateway.litellm.svc.cluster.local:4000/v1"}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: LITELLM_API_KEY, optional: true}}
            - {name: EMBEDDING_PROVIDER, value: "openai_compatible"}
            - {name: EMBEDDING_MODEL, value: "@cf/baai/bge-m3"}
            - {name: EMBEDDING_DIMENSIONS, value: "1024"}
            - {name: EMBEDDING_ENDPOINT, value: "https://api.cloudflare.com/client/v4/accounts/47ce24ced58f17c9fb15351adcbe67d4/ai/v1"}
            - name: EMBEDDING_API_KEY
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: CF_AI_TOKEN, optional: true}}
            - name: FASTAPI_USERS_JWT_SECRET
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: FASTAPI_USERS_JWT_SECRET}}
            - name: FASTAPI_USERS_RESET_PASSWORD_TOKEN_SECRET
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: FASTAPI_USERS_RESET_PASSWORD_TOKEN_SECRET}}
            - name: FASTAPI_USERS_VERIFICATION_TOKEN_SECRET
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: FASTAPI_USERS_VERIFICATION_TOKEN_SECRET}}
            - name: DEFAULT_USER_PASSWORD
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: DEFAULT_USER_PASSWORD}}
          ports:
            - {name: http, containerPort: 8001}
          readinessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8001}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /cognee-storage}
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {cpu: "2", memory: 4Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cognee-data
---
apiVersion: v1
kind: Service
metadata:
  name: cognee
  namespace: cognee-trial
  labels:
    app: cognee
spec:
  selector: {app: cognee}
  ports:
    - {name: mcp, port: 8000, targetPort: 8000}
    - {name: http, port: 8001, targetPort: 8001}
