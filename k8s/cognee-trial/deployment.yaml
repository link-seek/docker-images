# k8s/cognee-trial 主 Deployment（GH runner 已验镜像可 boot：/health 200，见 url2hc#6）。
# digest pin 即行为版本（trial 自烘焙 cognee-mcp-trial:20261117-fastembed，digest 5e6d33f5，url2hc run 44013862171；fastembed 显式 FASTEMBED_CACHE_PATH=/app/fastembed-cache，离线 dims=384 实证）。
# trial 约束：ClusterIP 仅集群内（无 tailscale 暴露）、数据 emptyDir。
# LLM 接线（TEXT_MODEL=beam-free，EMBEDDING 初期 fastembed 本地，bge-m3 后续切）：
# - LLM 经 litellm 网关 OpenAI 兼容（custom + openai/ 前缀 + /v1 endpoint）；
# - key 走 cognee-trial-env Secret（pipeline mint，Flux 不碰），与生产 Secret 隔离。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognee
  namespace: cognee-trial
  labels:
    app: cognee
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本+本地卷：滚动无意义
  selector:
    matchLabels:
      app: cognee
  template:
    metadata:
      annotations:
        cognee-trial-restart: "2026-11-17T0306-secret-live"
      labels:
        app: cognee
    spec:
      containers:
        - name: cognee
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/cognee-mcp-trial@sha256:5e6d33f5159b3fa4dd81aca21882d30bb1d0a684331578a9ae58a3bc76ff50ae
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: TRANSPORT_MODE, value: "http"}
            - {name: COGNEE_SKIP_CONNECTION_TEST, value: "true"}
            # LLM：TEXT_MODEL（beam-free）经 litellm 网关
            - {name: LLM_PROVIDER, value: "custom"}
            - {name: LLM_MODEL, value: "openai/beam-free"}
            - {name: LLM_ENDPOINT, value: "http://litellm-gateway.litellm.svc.cluster.local:4000/v1"}
            - name: LLM_API_KEY
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: LITELLM_API_KEY, optional: true}}
            # Embedding：CF Workers AI OpenAI 兼容端点（@cf/baai/bge-m3，1024 维，与 EMBEDDING_MODEL 变量一致）；
            # custom provider 经 LiteLLM 走 /v1/embeddings；key 用 Secret 内 CF_AI_TOKEN（pipeline 现签，不进仓）。
            # fastembed-local 已判死（.69 上起 onnx 即崩 worker，mock 也绕不开模型加载），不再用。
            - {name: EMBEDDING_PROVIDER, value: "custom"}
            - {name: EMBEDDING_MODEL, value: "@cf/baai/bge-m3"}
            - {name: EMBEDDING_DIMENSIONS, value: "1024"}
            - {name: EMBEDDING_ENDPOINT, value: "https://api.cloudflare.com/client/v4/accounts/47ce24ced58f17c9fb15351adcbe67d4/ai/v1"}
            - name: EMBEDDING_API_KEY
              valueFrom: {secretKeyRef: {name: cognee-trial-env, key: CF_AI_TOKEN, optional: true }}
            - {name: EMBEDDING_PROVIDER, value: "fastembed"}
            - {name: EMBEDDING_MODEL, value: "BAAI/bge-small-en-v1.5"}
            - {name: EMBEDDING_DIMENSIONS, value: "384"}
          volumeMounts:
            - {name: data, mountPath: /root/.cognee_system}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 1Gi}
            limits: {cpu: 2000m, memory: 4Gi} # trial ingests吃内存（onnx+抽取），先放宽；定版按实测收敛
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cognee
  namespace: cognee-trial
  labels:
    app: cognee
spec:
  selector: {app: cognee}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
