# 公网入口声明（Traefik）：opencode.xieyucheng.top → 同 ns Service opencode:4097。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencode
  namespace: opencode-xieyucheng
spec:
  rules:
    - host: opencode.xieyucheng.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencode
                port:
                  number: 4097
