# xieyucheng（唯一路由；web(80) 由 Traefik 全局 301→https）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: xieyucheng-staging-tls
  namespace: opencode-xieyucheng
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`opencode.xieyucheng.top`)
      kind: Rule
      services:
        - name: opencode
          port: 4097
  tls:
    certResolver: le-prod
    domains:
      - main: opencode.xieyucheng.top
