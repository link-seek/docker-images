# k8s/opencode entrypoint（由 stacks/opencode/hw41/compose.yml entrypoint 逐行翻译）。
# 差异仅三处（注释标 K8S）：BROWSER 不用管（同 Pod 自带）；TS state 走 emptyDir；
# /old-workspace 不挂（trial 不带）。其余语义与旧线一致（含 PIPELINE_MANAGED 防手滑、
# 已 Running 则跳 up、unset TS_JOIN_KEY）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencode-entrypoint
  namespace: opencode-xieyucheng
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu
    if [ "${PIPELINE_MANAGED:-}" != "true" ]; then
      echo 'FATAL: .env not pipeline-managed (PIPELINE_MANAGED!=true). Refusing to start.' >&2
      exit 1
    fi
    yes | hcloud configure set --cli-access-key="${HCLOUD_AK}" --cli-secret-key="${HCLOUD_SK}" --cli-region=cn-north-4 >/dev/null 2>&1 || true
    sed -i 's/"agreePrivacy": "false"/"agreePrivacy": "true"/' /root/.hcloud/config.json 2>/dev/null || true
    # 去容器 TS 身份（2026-11-15）：入网走 operator 代理，此处不再起 tailscaled。
    if [ ! -d /workspace/.git ]; then
      git init -b main /workspace >/dev/null 2>&1
      git -C /workspace config user.name opencode-prod
      git -C /workspace config user.email opencode-prod@local
      git -C /workspace commit --allow-empty -m init >/dev/null 2>&1
    fi
    # ---- SSH server（root + 密码 = $OPENCODE_SERVER_PASSWORD；端口 2222）----
    if [ "${OPENCODE_SSH_ENABLE:-true}" = "true" ] && command -v sshd >/dev/null 2>&1; then
      mkdir -p /run/sshd /root/.ssh/sshd
      [ -f /root/.ssh/sshd/ssh_host_ed25519_key ] || ssh-keygen -t ed25519 -f /root/.ssh/sshd/ssh_host_ed25519_key -N '' -q
      if [ -n "${OPENCODE_SERVER_PASSWORD:-}" ]; then echo "root:${OPENCODE_SERVER_PASSWORD}" | chpasswd || echo "WARN: set root pw failed" >&2; fi
      printf '%s\n' 'Port 2222' 'ListenAddress 0.0.0.0' 'HostKey /root/.ssh/sshd/ssh_host_ed25519_key' 'PermitRootLogin yes' 'PasswordAuthentication yes' 'KbdInteractiveAuthentication no' 'UsePAM no' 'PidFile /tmp/sshd.pid' > /root/.ssh/sshd/sshd_config
      /usr/sbin/sshd -f /root/.ssh/sshd/sshd_config 2>/dev/null || echo 'WARN: sshd start failed' >&2
    fi
    exec opencode "$@"
