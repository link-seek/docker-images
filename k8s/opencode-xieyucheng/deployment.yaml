apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode-xieyucheng
  labels:
    app: opencode
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      nodeSelector:
        kubernetes.io/hostname: ecs-ies-euleros-jmupervm-xieyucheng-langfuse-33b4
      imagePullSecrets:
      - name: swr-pull
      initContainers:
      - name: init-dirs
        image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools@sha256:cd309c907c7e8e916e510a21491c414801c9a8d4864f044dfd7962301ead0102
        command:
        - sh
        - -c
        - mkdir -p /workspace /root/.local/share/opencode && chown -R root:root /workspace
          /root/.local/share/opencode || true
        volumeMounts:
        - name: prod-work
          mountPath: /workspace
        - name: prod-data
          mountPath: /root/.local/share/opencode
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      containers:
      - name: opencode
        image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools@sha256:cd309c907c7e8e916e510a21491c414801c9a8d4864f044dfd7962301ead0102
        command:
        - /bin/sh
        - /entrypoint/entrypoint.sh
        args:
        - serve
        - --port
        - '4097'
        - --hostname
        - 0.0.0.0
        ports:
        - name: http
          containerPort: 4097
        env:
        - name: PIPELINE_MANAGED
          value: 'true'
        - name: LITELLM_BASE_URL
          value: http://litellm-gateway.litellm.svc.cluster.local:4000
        - name: SSH_TARGETS
          value: mesh-hw-21 mesh-hw-41
        - name: SMTP_HOST
          value: smtp.163.com
        - name: SMTP_PORT
          value: '465'
        - name: SMTP_USER
          value: 122306789@163.com
        - name: SMTP_FROM
          value: 122306789@163.com
        - name: MAIL_DEFAULT_TO
          value: xieyucheng@outlook.com
        - name: BROWSER_CDP_URL
          value: http://127.0.0.1:9222
        - name: OPEN_DESIGN_BROWSER_URL
          value: http://127.0.0.1:9222
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: LITELLM_API_KEY
        - name: GH_TOKEN
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: GH_TOKEN
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: OPENCODE_SERVER_PASSWORD
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: CLOUDFLARE_API_TOKEN
        - name: CF_AI_TOKEN
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: CF_AI_TOKEN
        - name: HCLOUD_AK
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: HCLOUD_AK
        - name: HCLOUD_SK
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: HCLOUD_SK
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: SMTP_PASS
        - name: ALIBABACLOUD_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: ALIBABACLOUD_ACCESS_KEY_ID
        - name: ALIBABACLOUD_ACCESS_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: ALIBABACLOUD_ACCESS_KEY_SECRET
        - name: ALIBABACLOUD_REGION_ID
          value: cn-hangzhou
        - name: OCI_CLI_USER
          value: ocid1.user.oc1..aaaaaaaalhn53cu72kvifu34crgpabqpm5xhm424yj56n4g2ca2cxn3hs4ca
        - name: OCI_CLI_FINGERPRINT
          value: 53:47:c7:ea:5d:3d:3e:cc:58:99:99:e9:cb:5e:7b:96
        - name: OCI_CLI_TENANCY
          value: ocid1.tenancy.oc1..aaaaaaaa3znvscn322jewkqpty3phxuw6x7tkitevjmh5o55qfp3ffevfcaq
        - name: OCI_CLI_REGION
          value: ap-tokyo-1
        - name: OCI_CLI_KEY_CONTENT
          valueFrom:
            secretKeyRef:
              name: opencode-xieyucheng-env
              key: OCI_CLI_KEY_CONTENT
        volumeMounts:
        - name: prod-work
          mountPath: /workspace
        - name: prod-data
          mountPath: /root/.local/share/opencode
        - name: entrypoint
          mountPath: /entrypoint
        readinessProbe:
          httpGet:
            path: /
            port: 4097
          initialDelaySeconds: 90
          periodSeconds: 15
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 4097
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 10
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 3000m
            memory: 8Gi
      - name: browser
        image: swr.cn-north-9.myhuaweicloud.com/xieyucheng123/chrome-cjk@sha256:4ffc5390fc0df74b80ca44d688b8e5a26dd5da648afd796a0e9a6a57e3a64a27
        ports:
        - name: cdp
          containerPort: 9222
        readinessProbe:
          httpGet:
            path: /json/version
            port: 9222
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 2Gi
      volumes:
      - name: prod-work
        hostPath:
          path: /data/opencode-xieyucheng/work
          type: DirectoryOrCreate
      - name: prod-data
        hostPath:
          path: /data/opencode-xieyucheng/data
          type: DirectoryOrCreate
      - name: entrypoint
        configMap:
          name: opencode-entrypoint
          defaultMode: 493
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode-xieyucheng
  labels: {}
spec:
  selector:
    app: opencode
  ports:
  - name: http
    port: 4097
    targetPort: 4097
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-vpc
  namespace: opencode-xieyucheng
spec:
  type: LoadBalancer
  selector:
    app: opencode
  ports:
  - name: http
    port: 44098
    targetPort: 4097
