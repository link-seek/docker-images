# k8s/opencode-xieyucheng 主 Deployment（由 k8s/opencode 复制；租户=xieyucheng，切流另议）。
# 差异：namespace/TS 身份/secret 名按租户；nodeSelector 钉 41（.69 limits 已超配，41 空）。
# digest pin 即行为版本（tools bb7c1087…/chrome 4ffc5390…，与 HW41 现跑一致）。
# resources 是 HW41 事故教训的硬化（limits 必填）：.69 为 4C15G。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: opencode-xieyucheng
  labels:
    app: opencode
  annotations:
    reloader.stakater.com/auto: "true" # Secret 走 Infisical Operator 同步：更新后自动重载
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本+本地卷：滚动无意义，重建即切换（切流由 Caddy 做）。
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      nodeSelector:
        kubernetes.io/hostname: ecs-ies-euleros-jmupervm-xieyucheng-langfuse-33b4
      imagePullSecrets:
        - name: swr-pull
      # DNS 保持 kube-dns 默认：网关走公网域名解析。
      initContainers:
        - name: init-dirs
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools:pin-required
          command: [sh, -c, "mkdir -p /workspace /root/.local/share/opencode && chown -R root:root /workspace /root/.local/share/opencode || true"]
          volumeMounts:
            - {name: prod-work, mountPath: /workspace}
            - {name: prod-data, mountPath: /root/.local/share/opencode}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: opencode
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools:pin-required
          command: ["/bin/sh", "/entrypoint/entrypoint.sh"]
          args: ["serve", "--port", "4097", "--hostname", "0.0.0.0"]
          ports:
            - {name: http, containerPort: 4097}
          env:
            - {name: PIPELINE_MANAGED, value: "true"}
            # 网关走公网域名（用户已修复公网后端；网关迁 k3s 后改集群内 Service）。
            - {name: LITELLM_BASE_URL, value: "http://litellm-gateway.litellm.svc.cluster.local:4000"}
            - {name: SSH_TARGETS, value: "mesh-hw-21 mesh-hw-41"}
            - {name: SMTP_HOST, value: smtp.163.com}
            - {name: SMTP_PORT, value: "465"}
            - {name: SMTP_USER, value: 122306789@163.com}
            - {name: SMTP_FROM, value: 122306789@163.com}
            - {name: MAIL_DEFAULT_TO, value: xieyucheng@outlook.com}
            # 浏览器走本 ns 独立 browserless Pod（CDP over ws；token 与 browserless 同 secret 两边一致）。
            # 注意：BROWSERLESS_TOKEN 必须先于引用它的 $() 定义（k8s env 展开只看列表前面的变量）。
            - name: BROWSERLESS_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: BROWSERLESS_TOKEN}}
            - {name: BROWSER_CDP_URL, value: "ws://browserless.opencode-xieyucheng.svc.cluster.local:3000/chromium?token=$(BROWSERLESS_TOKEN)"}
            - {name: OPEN_DESIGN_BROWSER_URL, value: "ws://browserless.opencode-xieyucheng.svc.cluster.local:3000/chromium?token=$(BROWSERLESS_TOKEN)"}
            - name: LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: LITELLM_API_KEY}}
            - name: GH_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: GH_TOKEN}}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: OPENCODE_SERVER_PASSWORD}}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: CLOUDFLARE_API_TOKEN}}
            - name: CF_AI_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: CF_AI_TOKEN}}
            - name: HCLOUD_AK
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: HCLOUD_AK}}
            - name: HCLOUD_SK
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: HCLOUD_SK}}
            - name: SMTP_PASS
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: SMTP_PASS}}
            # 阿里云身份（pilot 专用；CLI 原生 env 名；region 明文非秘钥）
            - name: ALIBABACLOUD_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: ALIBABACLOUD_ACCESS_KEY_ID}}
            - name: ALIBABACLOUD_ACCESS_KEY_SECRET
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: ALIBABACLOUD_ACCESS_KEY_SECRET}}
            - name: ALIBABACLOUD_REGION_ID
              value: "cn-hangzhou"
            # OCI 身份（pilot 专用；真值走 pipeline mint，OCI_CLI_* 环境认证，免 ~/.oci）：
            - name: OCI_CLI_USER
              value: "ocid1.user.oc1..aaaaaaaalhn53cu72kvifu34crgpabqpm5xhm424yj56n4g2ca2cxn3hs4ca"
            - name: OCI_CLI_FINGERPRINT
              value: "53:47:c7:ea:5d:3d:3e:cc:58:99:99:e9:cb:5e:7b:96"
            - name: OCI_CLI_TENANCY
              value: "ocid1.tenancy.oc1..aaaaaaaa3znvscn322jewkqpty3phxuw6x7tkitevjmh5o55qfp3ffevfcaq"
            - name: OCI_CLI_REGION
              value: "ap-tokyo-1"
            - name: OCI_CLI_KEY_CONTENT
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: OCI_CLI_KEY_CONTENT}}
          volumeMounts:
            - {name: prod-work, mountPath: /workspace}
            - {name: prod-data, mountPath: /root/.local/share/opencode}
            - {name: entrypoint, mountPath: /entrypoint}
          readinessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 3000m, memory: 8Gi}
      volumes:
        # 41 上 local-path helper 镜像拉不动（docker.io 被墙）→ hostPath 直挂（单机 RWO 等价，kubelet DirectoryOrCreate）。
        # yingxin 栈保持 PVC（.69 缓存有镜像，不动活数据）。
        - name: prod-work
          hostPath: {path: /data/opencode-xieyucheng/work, type: DirectoryOrCreate}
        - name: prod-data
          hostPath: {path: /data/opencode-xieyucheng/data, type: DirectoryOrCreate}
        - name: entrypoint
          configMap: {name: opencode-entrypoint, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: opencode
  namespace: opencode-xieyucheng
spec:
  selector: {app: opencode}
  ports:
    - {name: http, port: 4097, targetPort: 4097}
---
# opencode-vpc：历史 VPC 内网口（原 k3s ServiceLB，节点 IP 直达）。2026-11-22 退役外部暴露：
# 无任何 Ingress/IngressRoute/pod 引用、无活跃连接，降级为 ClusterIP（不再占节点 hostPort / 不再暴露节点 IP）。
# 如后续确认彻底无用可直接删除。
apiVersion: v1
kind: Service
metadata:
  name: opencode-vpc
  namespace: opencode-xieyucheng
spec:
  type: ClusterIP
  selector: {app: opencode}
  ports:
    - {name: http, port: 44098, targetPort: 4097}
---
# browserless 独立 Pod（本 ns 自用；opencode 经 Service 发现，CDP over ws）。
# /dev/shm 2g（Chrome 崩于默认 64M）。探针 tcpSocket（/pressure 需 TOKEN，secret 值无法插进 httpGet path）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: opencode-xieyucheng
  labels:
    app: browserless
  annotations:
    reloader.stakater.com/auto: "true" # 随 opencode-xieyucheng-env（含 BROWSERLESS_TOKEN）更新自动重载
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本：滚动无意义。
  selector:
    matchLabels:
      app: browserless
  template:
    metadata:
      labels:
        app: browserless
    spec:
      imagePullSecrets:
        - name: swr-pull
      containers:
        - name: browserless
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/browserless-chrome-cjk@sha256:d9040011a12b23af21637e21be2b22e6ba144ad4b5f458dbc803a367aca9e92d
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: HOST, value: "0.0.0.0"}
            - name: TOKEN
              valueFrom: {secretKeyRef: {name: opencode-xieyucheng-env, key: BROWSERLESS_TOKEN}}
            - {name: CONCURRENT, value: "10"}
            - {name: QUEUED, value: "10"}
            # 单会话上限 10min（同 team；30s 默认会截断真实自动化）。
            - {name: TIMEOUT, value: "600000"}
            - {name: HEALTH, value: "true"}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
          readinessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 4000m, memory: 8Gi}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: browserless
  namespace: opencode-xieyucheng
spec:
  selector: {app: browserless}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
