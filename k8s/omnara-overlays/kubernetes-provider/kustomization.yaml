# Kubernetes machine pool (fork kubernetes-provider) overlay.
# The base pins official images by digest; this overlay swaps only the services
# that contain the fork's provider code and enables the provider.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../omnara
images:
  - name: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-api
    newName: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-api-k8s
    newTag: 0.2.29-k8s.4
  - name: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-worker
    newName: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-worker-k8s
    newTag: 0.2.29-k8s.4
  - name: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-maintenance
    newName: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-maintenance-k8s
    newTag: 0.2.29-k8s.4
  - name: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-web
    newName: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-web-k8s
    newTag: 0.2.29-k8s.4
  - name: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-migrations
    newName: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-migrations-k8s
    newTag: 0.2.29-k8s.4
patches:
  - target: {kind: Deployment, name: api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: api}
      spec:
        template:
          spec:
            hostAliases:
              - ip: 117.135.214.23
                hostnames: [smtp.163.com]
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: kubernetes.io/hostname
                          operator: In
                          values: [ecs-ies-euleros-jmupervm-xieyucheng]
            containers:
              - name: api
                env:
                  - {name: OMNARA_KUBERNETES_POOLS_ENABLED, value: "1"}
                  - {name: OMNARA_PRIVATE_ENDPOINT_CIDRS, value: "10.42.0.0/16,10.43.0.0/16,192.168.1.21:6443"}
                  # The API's SMTP client supports STARTTLS, not implicit TLS on 465.
                  - {name: OMNARA_SMTP_ADDR, value: "smtp.163.com:25"}
                  # 163 rejects MAIL FROM unless it equals the authenticated user.
                  - {name: OMNARA_EMAIL_FROM, value: "122306789@163.com"}
                  - name: OMNARA_SMTP_USERNAME
                    valueFrom:
                      secretKeyRef: {name: omnara-smtp, key: username}
                  - name: OMNARA_SMTP_PASSWORD
                    valueFrom:
                      secretKeyRef: {name: omnara-smtp, key: password}
  - target: {kind: Deployment, name: worker}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: worker}
      spec:
        template:
          spec:
            containers:
              - name: worker
                env:
                  - {name: OMNARA_PRIVATE_ENDPOINT_CIDRS, value: "10.42.0.0/16,10.43.0.0/16,192.168.1.21:6443"}
                  # The API's SMTP client supports STARTTLS, not implicit TLS on 465.
                  - {name: OMNARA_SMTP_ADDR, value: "smtp.163.com:25"}
                  # 163 rejects MAIL FROM unless it equals the authenticated user.
                  - {name: OMNARA_EMAIL_FROM, value: "122306789@163.com"}
  - target: {kind: Deployment, name: maintenance}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: maintenance}
      spec:
        template:
          spec:
            containers:
              - name: maintenance
                env:
                  - {name: OMNARA_PRIVATE_ENDPOINT_CIDRS, value: "10.42.0.0/16,10.43.0.0/16,192.168.1.21:6443"}
                  # The API's SMTP client supports STARTTLS, not implicit TLS on 465.
                  - {name: OMNARA_SMTP_ADDR, value: "smtp.163.com:25"}
                  # 163 rejects MAIL FROM unless it equals the authenticated user.
                  - {name: OMNARA_EMAIL_FROM, value: "122306789@163.com"}
