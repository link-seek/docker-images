# IngressRoute prod（唯一路由：单条 websecure IngressRoute；web(80) 由 Traefik 全局 301→https，不再单独维护 Ingress）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: erpnext-staging-tls
  namespace: erpnext
  annotations:
    route-comment: prod DNS-01 via IngressRoute (single route; web redirects globally)
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`erp.xieyucheng.top`)
    kind: Rule
    services:
    - name: erpnext
      port: 8080
  tls:
    certResolver: le-prod
    domains:
    - main: erp.xieyucheng.top
