# IngressRoute prod（唯一路由：单条 IngressRoute 同管 web(80)/websecure(443)，取代原 Ingress+IngressRoute 双份）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: erpnext-staging-tls
  namespace: erpnext
  annotations:
    route-comment: prod DNS-01 via IngressRoute (single route set for web + websecure)
spec:
  entryPoints:
  - web
  - websecure
  routes:
  - match: Host(`erp.xieyucheng.top`)
    kind: Rule
    services:
    - name: erpnext
      port: 8080
  tls:
    certResolver: le-prod
    domains:
    - main: erp.xieyucheng.top
