# 前门 Service：nginx 8080（集群内；公网经 Caddy→Traefik）。
apiVersion: v1
kind: Service
metadata:
  name: erpnext
  namespace: erpnext
  labels:
    app.kubernetes.io/name: erpnext
    app.kubernetes.io/instance: erpnext
    app.kubernetes.io/managed-by: Flux
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: erpnext-nginx
    app.kubernetes.io/instance: erpnext-nginx
