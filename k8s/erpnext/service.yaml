# 前门 Service：nginx 8080，tailscale operator 代理对外（trial 先单点，稳定再议 ha）。
# operator 无 default proxy-class，不挂 proxy-class 则 expose 被忽略（team 实锤）；ha-b 钉 .69，与 pod 同节点。
# 公网入口由 infra 侧 Caddy 反代 erpnext.mackarel-polaris.ts.net.:8080（另见 infra#546）。
apiVersion: v1
kind: Service
metadata:
  name: erpnext
  namespace: erpnext
  labels:
    tailscale.com/proxy-class: ha-b
    app.kubernetes.io/name: erpnext
    app.kubernetes.io/instance: erpnext
    app.kubernetes.io/managed-by: Flux
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: erpnext
    tailscale.com/tags: tag:k8s
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: erpnext-nginx
    app.kubernetes.io/instance: erpnext-nginx
