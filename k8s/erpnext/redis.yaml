# Redis（手写最小版，替代 chart 的 bitnami/dragonfly/valkey subchart）。
# trial 从简：无 auth（ClusterIP 仅集群内）、emptyDir（chart 默认 queue storage 也是关的，重启丢队列可接受，生产再加持久化）。
# image：SWR 常驻官方镜像（url2hc 转入，expire 0）：swr.cn-north-9.myhuaweicloud.com/link-seek/erpnext-redis@sha256:740ccf999c0ed002bef18e0b3faeeb48ad5a25f1090634386c50b82ef3833c8f
# configure job 写入 sites/common_site_config.json：cache→erpnext-redis-cache:6379，queue/socketio→erpnext-redis-queue:6379。
apiVersion: v1
kind: Service
metadata:
  name: erpnext-redis-cache
  namespace: erpnext
  labels:
    app.kubernetes.io/name: erpnext-redis-cache
    app.kubernetes.io/instance: erpnext
    app.kubernetes.io/managed-by: Flux
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app.kubernetes.io/name: erpnext-redis-cache
    app.kubernetes.io/instance: erpnext
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: erpnext-redis-cache
  namespace: erpnext
  labels:
    app.kubernetes.io/name: erpnext-redis-cache
    app.kubernetes.io/instance: erpnext
    app.kubernetes.io/managed-by: Flux
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: erpnext-redis-cache
      app.kubernetes.io/instance: erpnext
  template:
    metadata:
      labels:
        app.kubernetes.io/name: erpnext-redis-cache
        app.kubernetes.io/instance: erpnext
        app: erpnext
    spec:
      nodeSelector:
        kubernetes.io/hostname: ecs-ies-euleros-jmupermv-zhangzhirui
      imagePullSecrets:
        - name: swr-pull
      serviceAccountName: erpnext
      containers:
        - name: redis
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/erpnext-redis@sha256:740ccf999c0ed002bef18e0b3faeeb48ad5a25f1090634386c50b82ef3833c8f
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "no", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          resources: {}
---
