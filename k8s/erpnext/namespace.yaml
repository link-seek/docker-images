# k8s/erpnext — ERPNext trial（vendor 自 frappe/erpnext chart 8.0.14，app v15.94.1）。
# 与 chart 默认的偏离（有意，trial 从简，均在各文件注释）：
# - DB 用 in-chart mariadb-sts（mariadb:10.6 SWR 镜像），不用 bitnami subchart；
# - redis 不用 bitnami/dragonfly/valkey subchart，手写两个最小 Deployment（cache/queue，无 auth，emptyDir）；
# - persistence.worker/sites：RWX→RWO（local-path 只支持 RWO；全 pod 钉 .69 同节点，共享卷安全）；
# - storageClass：local-path（k3s 默认）；全负载 nodeSelector 钉 .69
#  （ecs-ies-euleros-jmupervm-zhangzhirui；41 local-path helper 拉不动 docker.io，PVC 永 Pending，见 team 注释）；
# - jobs 用固定名（chart 默认带时间戳，每次 Flux 对账都会新建 job，生产不可接受）；
# - createSite 默认关→开（trial 要进登录页），admin 密码走 existingSecret（即 Secret erpnext），不明文；
# - HPA/ingress/httproute 不要（入口走 120 Caddy→tailnet operator，见 service.yaml）。
# 镜像 tag 即行为版本：首 bake 出 tag 后改 digest pin 发 PR（与旧线同语义）。
# Secret erpnext 不进仓（mariadb-root-password + admin-password）：Flux 对账前先经 pipeline mint，
# 缺 Secret 时 pod 报 CreateContainerConfigError，属预期。swr-pull 同理（骨架预检会自动建）。
apiVersion: v1
kind: Namespace
metadata:
  name: erpnext
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/name: erpnext
