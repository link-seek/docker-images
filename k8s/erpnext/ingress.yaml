# 公网入口声明（Traefik）：erp.xieyucheng.top → 同 ns Service erpnext:8080。
# 无主动检查（frappe 非 200 误摘；Caddy 侧同理只用被动熔断）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: erpnext
  namespace: erpnext
spec:
  rules:
    - host: erp.xieyucheng.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: erpnext
                port:
                  number: 8080
