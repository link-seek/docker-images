---
# opencode-vpc：VPC 内网口（k3s ServiceLB，节点 IP 直达；容器已无 TS 身份，tailnet 走 operator 代理）。
# 外端口 44099：ServiceLB 按 Service 端口占节点 hostPort，hw21/hw41 本机单机版已占 4097，避冲突。
# 端口登记：team-vpc=44097，xieyucheng-vpc=44098，opencode-vpc=44099；回滚=revert。
apiVersion: v1
kind: Service
metadata:
  name: opencode-vpc
  namespace: opencode
spec:
  type: LoadBalancer
  selector: {app: opencode}
  ports:
    - {name: http, port: 44099, targetPort: 4097}
