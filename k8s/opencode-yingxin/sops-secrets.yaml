# SOPS 加密配方（纯声明，无真值）：key 名 -> 来源。
# 来源：GH secret 名（org/repo 级，workflow 按名取），或 CF_MINTED:child|ai（现场签发）。
# 加 app：抄一份改名改表，不碰 workflow。合 PR 前确保 Flux decryption 已 opt-in。
secretName: opencode-yingxin-env
namespace: opencode-yingxin
keys:
  LITELLM_API_KEY: OPENCODE_API_KEY
  GH_TOKEN: PROD_GH_TOKEN
  OPENCODE_SERVER_PASSWORD: PROD_OPENCODE_SERVER_PASSWORD
  CLOUDFLARE_API_TOKEN: CF_MINTED:child
  CF_AI_TOKEN: CF_MINTED:ai
  HCLOUD_AK: PROD_HCLOUD_AK
  HCLOUD_SK: PROD_HCLOUD_SK
  SMTP_PASS: PROD_SMTP_PASS
