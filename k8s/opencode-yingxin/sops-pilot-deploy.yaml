# SOPS pilot：最小 Deployment，只验三件事（解密落地→pod 读到值→改值触发 Reloader 重载）。
# 与业务 deployment 无关；真 secret 切换走正常发布。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sops-pilot
  namespace: opencode-yingxin
  labels:
    pilot: sops-end-to-end
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sops-pilot
  template:
    metadata:
      labels:
        app: sops-pilot
    spec:
      containers:
        - name: sleeper
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/edge-busybox:1.36
          command: [sleep, "3600"]
          envFrom:
            - secretRef:
                name: sops-pilot
