# k8s/opencode 主 Deployment（翻译自 stacks/opencode/hw41/compose.yml）。
# digest pin 即行为版本（tools bb7c1087…/chrome 4ffc5390…，与 HW41 现跑一致）。
# resources 是 HW41 事故教训的硬化（limits 必填）：.69 为 4C15G。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode-yingxin
  namespace: opencode-yingxin
  labels:
    app: opencode-yingxin
  annotations:
    reloader.stakater.com/auto: "true" # 主 Secret 走 Infisical Operator 同步：Secret 更新后自动重载
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本+本地卷：滚动无意义，重建即切换（切流由 Caddy 做）。
  selector:
    matchLabels:
      app: opencode-yingxin
  template:
    metadata:
      labels:
        app: opencode-yingxin
    spec:
      imagePullSecrets:
        - name: swr-pull
      # DNS 保持 kube-dns 默认：网关走公网域名解析。
      initContainers:
        - name: init-dirs
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools:pin-required
          command: [sh, -c, "mkdir -p /workspace /root/.local/share/opencode && chown -R root:root /workspace /root/.local/share/opencode || true"]
          volumeMounts:
            - {name: prod-work, mountPath: /workspace}
            - {name: prod-data, mountPath: /root/.local/share/opencode}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      containers:
        - name: opencode-yingxin
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/opencode-tools:pin-required
          command: ["/bin/sh", "/entrypoint/entrypoint.sh"]
          args: ["serve", "--port", "4097", "--hostname", "0.0.0.0"]
          ports:
            - {name: http, containerPort: 4097}
            - {name: ssh, containerPort: 2222}
          env:
            - {name: PIPELINE_MANAGED, value: "true"}
            # 网关走公网域名（用户已修复公网后端；网关迁 k3s 后改集群内 Service）。
            - {name: LITELLM_BASE_URL, value: "http://litellm-gateway.litellm.svc.cluster.local:4000"}
            - {name: SSH_TARGETS, value: "mesh-hw-21 mesh-hw-41"}
            - {name: SMTP_HOST, value: smtp.163.com}
            - {name: SMTP_PORT, value: "465"}
            - {name: SMTP_USER, value: 122306789@163.com}
            - {name: SMTP_FROM, value: 122306789@163.com}
            - {name: MAIL_DEFAULT_TO, value: xieyucheng@outlook.com}
            # 浏览器走本 ns 独立 browserless Pod（CDP over ws；无 token，集群内裸用）。
            - {name: BROWSER_CDP_URL, value: "ws://browserless.opencode-yingxin.svc.cluster.local:3000/chromium"}
            - {name: OPEN_DESIGN_BROWSER_URL, value: "http://browserless.opencode-yingxin.svc.cluster.local:3000"}
            # LITELLM_API_KEY 是 opencode 认的变量名，值须为上游认可的 key（=OPENCODE_API_KEY 的值；网关透传，completions 路上游验签）。
    # 命名易误解为网关的 key，实为 opencode 发出去鉴权用的；真值走 Infisical，改名随各 app 迁移时一并做。
            - name: LITELLM_API_KEY
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: LITELLM_API_KEY}}
            - name: GH_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: GH_TOKEN}}
            - name: OPENCODE_SERVER_PASSWORD
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: OPENCODE_SERVER_PASSWORD}}
            - name: V100_SSH_KEY
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: V100_SSH_KEY}}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: CLOUDFLARE_API_TOKEN}}
            - name: CF_AI_TOKEN
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: CF_AI_TOKEN}}
            - name: HCLOUD_AK
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: HCLOUD_AK}}
            - name: HCLOUD_SK
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: HCLOUD_SK}}
            - name: SMTP_PASS
              valueFrom: {secretKeyRef: {name: opencode-yingxin-env, key: SMTP_PASS}}
          volumeMounts:
            - {name: prod-work, mountPath: /workspace}
            - {name: prod-data, mountPath: /root/.local/share/opencode}
            - {name: entrypoint, mountPath: /entrypoint}
          readinessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: 4097}
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 3000m, memory: 8Gi}
      volumes:
        - name: prod-work
          hostPath: {path: /var/lib/opencode-yingxin/work, type: DirectoryOrCreate}
        - name: prod-data
          hostPath: {path: /var/lib/opencode-yingxin/data, type: DirectoryOrCreate}
        - name: entrypoint
          configMap: {name: opencode-entrypoint, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-yingxin
  namespace: opencode-yingxin
spec:
  selector: {app: opencode-yingxin}
  ports:
    - {name: http, port: 4097, targetPort: 4097}
---
# opencode-vpc：历史 VPC 内网口（原 k3s ServiceLB，节点 IP 直达）。2026-11-22 退役外部暴露：
# 无任何 Ingress/IngressRoute/pod 引用、无活跃连接，降级为 ClusterIP（不再占节点 hostPort / 不再暴露节点 IP）。
# 如后续确认彻底无用可直接删除。
apiVersion: v1
kind: Service
metadata:
  name: opencode-vpc
  namespace: opencode-yingxin
spec:
  type: LoadBalancer
  selector: {app: opencode-yingxin}
  ports:
    - {name: http, port: 44099, targetPort: 4097}
    - {name: ssh, port: 2224, targetPort: 2222}
---
# browserless 独立 Pod（本 ns 自用；opencode 经 Service 发现，CDP over ws）。
# /dev/shm 2g（Chrome 崩于默认 64M）。探针 tcpSocket（/pressure 需 TOKEN，secret 值无法插进 httpGet path）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browserless
  namespace: opencode-yingxin
  labels:
    app: browserless
spec:
  replicas: 1
  strategy:
    type: Recreate # 单副本：滚动无意义。
  selector:
    matchLabels:
      app: browserless
  template:
    metadata:
      labels:
        app: browserless
    spec:
      imagePullSecrets:
        - name: swr-pull
      containers:
        - name: browserless
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/browserless-chrome-cjk@sha256:d9040011a12b23af21637e21be2b22e6ba144ad4b5f458dbc803a367aca9e92d
          ports:
            - {name: http, containerPort: 3000}
          env:
            - {name: HOST, value: "0.0.0.0"}
            # 无 TOKEN：集群内裸用（ClusterIP 仅集群可达）。EXTERNAL 让 /json/version 的
            # webSocketDebuggerUrl 指向 Service（默认按 HOST=0.0.0.0 生成 ws://0.0.0.0:3000/ 不可路由）。
            - {name: EXTERNAL, value: "http://browserless.opencode-yingxin.svc.cluster.local:3000"}
            - {name: CONCURRENT, value: "10"}
            - {name: QUEUED, value: "10"}
            # 单会话上限 10min（同 team；30s 默认会截断真实自动化）。
            - {name: TIMEOUT, value: "600000"}
            - {name: HEALTH, value: "true"}
          volumeMounts:
            - {name: dshm, mountPath: /dev/shm}
          readinessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: 3000}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 1000m, memory: 2Gi}
            limits: {cpu: 4000m, memory: 8Gi}
      volumes:
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: browserless
  namespace: opencode-yingxin
spec:
  selector: {app: browserless}
  ports:
    - {name: http, port: 3000, targetPort: 3000}
