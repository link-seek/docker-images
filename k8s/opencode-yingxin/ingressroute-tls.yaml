# IngressRoute（唯一路由；web(80) 由 Traefik 全局 301→https）。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels:
    helm.sh/chart: opencode-0.1.0
    app.kubernetes.io/name: opencode
    app.kubernetes.io/instance: opencode-yingxin
    app.kubernetes.io/managed-by: Helm
  name: yingxin-staging-tls
  namespace: opencode-yingxin
  annotations:
    route-comment: staging DNS-01 via IngressRoute (Ingress provider can't store LE
      certs)
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`opencode.yingxin.net.cn`)
    kind: Rule
    services:
    - name: opencode-yingxin
      port: 4097
  tls:
    certResolver: le-prod
    domains:
    - main: opencode.yingxin.net.cn
