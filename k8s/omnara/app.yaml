# api / worker / maintenance（3 Deployment + 2 Service；web 另见 web.yaml；网关路由由 IngressRoute 做）。
# 公共 env：DB（密码插值）/redis/S3/PUBLIC_URL/加密/签名/邮件/CIDR；k8s API 供以后 machine pool 用（PRIVATE_ENDPOINT_CIDRS 含 service/pod 网段）。
# 收敛：migrate Job 未完成前 api CrashLoop（readiness 门控流量）；reloader 注解让 env 变更自动 rollout。
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: omnara
  labels:
    app.kubernetes.io/name: omnara
spec:
  selector:
    app: omnara-api
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: omnara
  labels:
    app.kubernetes.io/name: omnara
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: omnara-api
  template:
    metadata:
      labels:
        app: omnara-api
    spec:
      imagePullSecrets:
        - name: swr-pull
      containers:
        - name: api
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-api:v0.2.27@sha256:c8a09d0827dd5511f7d2095948df62a6218c87cf212384931cd1279ce243e603
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: omnara-env, key: POSTGRES_PASSWORD}}
            - name: OMNARA_DATABASE_URL
              value: "postgres://omnara:$(POSTGRES_PASSWORD)@postgres:5432/omnara?sslmode=disable"
            - {name: OMNARA_REDIS_URL, value: "redis://redis:6379/0"}
            - {name: OMNARA_PUBLIC_URL, value: "https://omnara.linkseek.net.cn"}
            - {name: OMNARA_LOG_LEVEL, value: info}
            - {name: OMNARA_ALLOW_INSECURE_DEV_DEFAULTS, value: "0"}
            - name: OMNARA_SECRET_ENCRYPTION_KEYS
              valueFrom: {secretKeyRef: {name: omnara-env, key: SECRET_ENCRYPTION_KEYS}}
            - name: OMNARA_SECRET_ENCRYPTION_ACTIVE_KEY_ID
              valueFrom: {secretKeyRef: {name: omnara-env, key: SECRET_ENCRYPTION_ACTIVE_KEY_ID}}
            - name: OMNARA_SKILL_DOWNLOAD_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: omnara-env, key: SKILL_DOWNLOAD_SIGNING_KEY}}
            - {name: OMNARA_BLOB_S3_BUCKET, value: omnara}
            - {name: OMNARA_BLOB_S3_REGION, value: us-east-1}
            - {name: OMNARA_BLOB_S3_ENDPOINT, value: "https://omnara-s3.linkseek.net.cn"}
            - {name: OMNARA_BLOB_S3_ACCESS_KEY_ID, value: omnara}
            - name: OMNARA_BLOB_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: omnara-env, key: BLOB_SECRET}}
            - {name: OMNARA_BLOB_S3_USE_PATH_STYLE, value: "1"}
            - {name: OMNARA_MEMORY_DIR, value: /var/lib/omnara/memory}
            - {name: OMNARA_EMAIL_DRIVER, value: console}
            - {name: OMNARA_AUTH_SIGNUP_ENABLED, value: "1"}
            - {name: OMNARA_AUTH_PASSWORD_RESET_ENABLED, value: "1"}
            - {name: OMNARA_TRUSTED_PROXY_CIDRS, value: "10.42.0.0/16,10.43.0.0/16"}
            - {name: OMNARA_PRIVATE_ENDPOINT_CIDRS, value: "10.42.0.0/16,10.43.0.0/16"}
            - {name: OMNARA_DOCKER_POOLS_ENABLED, value: "0"}
          volumeMounts:
            - {name: memory, mountPath: /var/lib/omnara/memory}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: 2000m, memory: 4Gi}
      volumes:
        - name: memory
          persistentVolumeClaim:
            claimName: memory-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: omnara
  labels:
    app.kubernetes.io/name: omnara
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app: omnara-worker
  template:
    metadata:
      labels:
        app: omnara-worker
    spec:
      imagePullSecrets:
        - name: swr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/omnara-worker:v0.2.27@sha256:57137e1a35097f9a867da25bce0d2ad7585272e5d5af37c03a02c6dfe3f783be
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: omnara-env, key: POSTGRES_PASSWORD}}
            - name: OMNARA_DATABASE_URL
              value: "postgres://omnara:$(POSTGRES_PASSWORD)@postgres:5432/omnara?sslmode=disable"
            - {name: OMNARA_REDIS_URL, value: "redis://redis:6379/0"}
            - {name: OMNARA_PUBLIC_URL, value: "https://omnara.linkseek.net.cn"}
            - {name: OMNARA_LOG_LEVEL, value: info}
            - {name: OMNARA_ALLOW_INSECURE_DEV_DEFAULTS, value: "0"}
            - name: OMNARA_SECRET_ENCRYPTION_KEYS
              valueFrom: {secretKeyRef: {name: omnara-env, key: SECRET_ENCRYPTION_KEYS}}
            - name: OMNARA_SECRET_ENCRYPTION_ACTIVE_KEY_ID
              valueFrom: {secretKeyRef: {name: omnara-env, key: SECRET_ENCRYPTION_ACTIVE_KEY_ID}}
            - name: OMNARA_SKILL_DOWNLOAD_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: omnara-env, key: SKILL_DOWNLOAD_SIGNING_KEY}}
            - {name: OMNARA_BLOB_S3_BUCKET, value: omnara}
            - {name: OMNARA_BLOB_S3_REGION, value: us-east-1}
            - {name: OMNARA_BLOB_S3_ENDPOINT, value: "https://omnara-s3.linkseek.net.cn"}
            - {name: OMNARA_BLOB_S3_ACCESS_KEY_ID, value: omnara}
            - name: OMNARA_BLOB_S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: omnara-env, key: BLOB_SECRET}}
            - {name: OMNARA_BLOB_S3_USE_PATH_STYLE, value: "1"}
            - {name: OMNARA_MEMORY_DIR, value: /var/lib/omnara/memory}
            - {name: OMNARA_DRAIN_TIMEOUT, value: 20s}
            - {name: OMNARA_TRUSTED_PROXY_CIDRS, value: "10.42.0.0/16,10.43.0.0/16"}
            - {name: OMNARA_PRIVATE_ENDPOINT_CIDRS, value: "10.42.0.0/16,10.43.0.0/16"}
          volumeMounts:
            - {name: memory, mountPath: /var/lib/omnara/memory}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: 4000m, memory: 8Gi}
      volumes:
        - name: memory
          persistentVolumeClaim:
            claimName: memory-data
---
