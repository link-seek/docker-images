# postgres 18（StatefulSet 单副本 + local-path 10Gi，钉 .21；密码来自 omnara-env）。
# 升级：先跑当版 migrate 直连 writer（禁 RDS proxy/事务级 pgbouncer），见上游 deployment.mdx。
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: omnara
  labels:
    app.kubernetes.io/name: omnara
spec:
  selector:
    app: omnara-postgres
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: omnara
  labels:
    app.kubernetes.io/name: omnara
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: omnara-postgres
  template:
    metadata:
      labels:
        app: omnara-postgres
    spec:
      imagePullSecrets:
        - name: swr-pull
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [ecs-ies-euleros-jmupervm-xieyucheng]
      containers:
        - name: postgres
          image: swr.cn-north-9.myhuaweicloud.com/link-seek/postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: omnara}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: omnara-env, key: POSTGRES_PASSWORD}}
            - {name: POSTGRES_DB, value: omnara}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
          readinessProbe:
            exec:
              command: [pg_isready, -U, omnara, -d, omnara]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: 2000m, memory: 4Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
