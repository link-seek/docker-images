# 公网入口（复刻上游 gateway.nginx.conf 路由：api/mcp/install/.well-known/healthz → api:8080，其余 → web:8080）。
# TLS 由 le-prod（DNS-01）自动签发；全局 80→https 在 Traefik 侧。
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: omnara-tls
  namespace: omnara
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`omnara.linkseek.net.cn`) && PathRegexp(`^/(api|mcp|install|\.well-known|healthz)(/|$)`)
      kind: Rule
      services:
        - name: api
          port: 8080
    - match: Host(`omnara.linkseek.net.cn`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: web
          port: 8080
    # 对象存储（S3 必须从根路径服务，签名含 host/path；经 Traefik 复用 le-prod 公网证，
    # 满足 OMNARA_BLOB_S3_ENDPOINT 的 https 强制； hairpin 经公网回环，生产可切私有 CA）。
    - match: Host(`omnara-s3.linkseek.net.cn`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: rustfs
          port: 9000
  tls:
    certResolver: le-prod
    domains:
      - main: omnara.linkseek.net.cn
      - main: omnara-s3.linkseek.net.cn
