# litellm_config.yaml — 透明代理模式
# user_custom_auth 接受任意 key，passthrough_key callback 把客户端 key 传给上游
# model_list 只做路由（api_key 是 dummy，会被 callback 覆盖）
general_settings:
  drop_params: true
  forward_client_headers_to_llm_api: true
  dangerously_permit_weak_or_unset_master_key: true
  user_custom_auth: always_allow_auth.always_allow
litellm_settings:
  request_timeout: 120
  num_retries: 2
  drop_params: true
  callbacks: passthrough_key.passthrough_callback
guardrails:
- guardrail_name: vault
  litellm_params:
    guardrail: vault_guard.SecretVaultGuardrail
    mode: [pre_call, post_call]
    default_on: true
model_list:
  - model_name: muse-spark-1.3-contributor
    litellm_params:
      model: openai/muse-spark-1.3-contributor
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-dummy-overridden-by-callback
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-dummy-overridden-by-callback
  - model_name: glm-5.1
    litellm_params:
      model: openai/glm-5.1
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-dummy-overridden-by-callback
  - model_name: glm-5.3
    litellm_params:
      model: openai/glm-5.3
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-dummy-overridden-by-callback
  - model_name: deepseek-v4-pro
    litellm_params:
      model: openai/deepseek-v4-pro
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-dummy-overridden-by-callback
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/zen/go/v1
      api_key: sk-dummy-overridden-by-callback
# 本地 embedding（本机 ollama 服务，无 key；透明代理重构时误删，补回）：
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://host.docker.internal:11434
      timeout: 120
