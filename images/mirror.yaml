# 声明式镜像同步清单（唯一真相）：这些镜像必须存在于 SWR。
# 由 .github/workflows/mirror-images.yml 在 GitHub runner（有干净外网出口）上执行 sync/verify。
# 为什么在 runner 上做：集群/节点连上游镜像源不稳，集群只负责从 SWR 拉；复制上游→SWR 必须跑在有出口的执行者。
#
# 增删镜像 = 改本文件 + 合 PR（push main 自动 sync；每日定时 verify 做漂移检测）。
# 规则：src 必须带 tag；dst 必须带 tag；禁止 :latest（可审计、可复现）。
# 命名空间：默认用顶层 namespace；配额满时单条可用 `ns:` 覆盖（如 xieyucheng123）。
registry: swr.cn-north-9.myhuaweicloud.com
namespace: link-seek
images:
  # system-upgrade-controller（infra #844 依赖）
  - src: docker.io/rancher/system-upgrade-controller:v0.20.1
    dst: system-upgrade-controller:v0.20.1
  - src: docker.io/rancher/kubectl:v1.30.3
    dst: kubectl:v1.30.3
  - src: docker.io/rancher/k3s-upgrade:v1.37.2-k3s1
    dst: k3s-upgrade:v1.37.2-k3s1
  # Omnara 控制面自托管底座（compose.yaml 对齐；ghcr 可直拉，SWR 做集群内唯一源）
  - src: docker.io/library/postgres:18-alpine
    dst: postgres:18-alpine
  - src: docker.io/valkey/valkey:9-alpine
    dst: valkey:9-alpine
  - src: docker.io/rustfs/rustfs:1.0.4
    dst: rustfs:1.0.4
  # Omnara 服务镜像（cluster-v0.2.27；禁止 latest，升级改 tag；tag 存在性已用 ghcr API 逐个验过）
  - src: ghcr.io/omnara-ai/omnara-api:v0.2.27
    dst: omnara-api:v0.2.27
  - src: ghcr.io/omnara-ai/omnara-worker:v0.2.27
    dst: omnara-worker:v0.2.27
  - src: ghcr.io/omnara-ai/omnara-web:v0.2.27
    dst: omnara-web:v0.2.27
  - src: ghcr.io/omnara-ai/omnara-maintenance:v0.2.27
    dst: omnara-maintenance:v0.2.27
  - src: ghcr.io/omnara-ai/omnara-migrations:v0.2.27
    dst: omnara-migrations:v0.2.27
  # NFS 动态供给（RWX 给 Omnara memory-data；server 自打，provisioner 上游原样重打）。
  # 注意：上游只发过 v4.0.0/1/2 三个镜像 tag（k8s.io/images.yaml 实锤），release 号 4.0.18 无对应镜像，用 v4.0.2。
  - src: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
    dst: nfs-provisioner:v4.0.2
  # cosign（签名工具；v2 保持 legacy .sig 格式，Flux verify 兼容）
  - src: ghcr.io/sigstore/cosign/cosign:v2.6.5
    dst: cosign:v2.6.5
  # Kyverno 策略引擎（#317 item7）：5 个控制器镜像，从 ghcr 镜像进 SWR（reg.kyverno.io 国内不可达）。
  - src: ghcr.io/kyverno/kyverno:v1.20.0
    dst: kyverno:v1.20.0
  - src: ghcr.io/kyverno/kyvernopre:v1.20.0
    dst: kyverno-kyvernopre:v1.20.0
  - src: ghcr.io/kyverno/background-controller:v1.20.0
    dst: kyverno-background-controller:v1.20.0
  - src: ghcr.io/kyverno/cleanup-controller:v1.20.0
    dst: kyverno-cleanup-controller:v1.20.0
  - src: ghcr.io/kyverno/reports-controller:v1.20.0
    dst: kyverno-reports-controller:v1.20.0
