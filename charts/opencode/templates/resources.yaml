{{- range .Values.resources }}
{{- $obj := deepCopy . }}
{{- $isRBAC := hasKey (dict "Role" 1 "RoleBinding" 1 "ClusterRole" 1 "ClusterRoleBinding" 1) $obj.kind }}
{{- $rbacCreate := ((($.Values.rbac | default dict).create) | default true) }}
{{- if and $isRBAC (not $rbacCreate) }}
{{- else }}
{{- $_ := set $obj.metadata "labels" (mergeOverwrite (deepCopy ($obj.metadata.labels | default dict)) (include "opencode.labels" $ | fromYaml)) }}
{{ toYaml $obj }}
---
{{- end }}
{{- end }}
