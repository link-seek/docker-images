{{- if .Values.rbac.create }}
{{- $std := include "opencode.labels" . | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opencode-self-verify
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $std | indent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "configmaps", "services", "endpoints"{{ if .Values.rbac.pvc }}, "persistentvolumeclaims"{{ end }}]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
{{- $std := include "opencode.labels" . | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opencode-self-verify
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $std | indent 4 }}
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opencode-self-verify
{{- end }}
