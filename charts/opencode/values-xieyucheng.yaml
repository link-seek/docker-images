- apiVersion: v1
  data:
    entrypoint.sh: "#!/bin/sh\nset -eu\nif [ \"${PIPELINE_MANAGED:-}\" != \"true\"\
      \ ]; then\n  echo 'FATAL: .env not pipeline-managed (PIPELINE_MANAGED!=true).\
      \ Refusing to start.' >&2\n  exit 1\nfi\nyes | hcloud configure set --cli-access-key=\"\
      ${HCLOUD_AK}\" --cli-secret-key=\"${HCLOUD_SK}\" --cli-region=cn-north-4 >/dev/null\
      \ 2>&1 || true\nsed -i 's/\"agreePrivacy\": \"false\"/\"agreePrivacy\": \"true\"\
      /' /root/.hcloud/config.json 2>/dev/null || true\n# 去容器 TS 身份（2026-11-15）：入网走\
      \ operator 代理，此处不再起 tailscaled。\nif [ ! -d /workspace/.git ]; then\n  git init\
      \ -b main /workspace >/dev/null 2>&1\n  git -C /workspace config user.name opencode-prod\n\
      \  git -C /workspace config user.email opencode-prod@local\n  git -C /workspace\
      \ commit --allow-empty -m init >/dev/null 2>&1\nfi\n# ---- SSH server（root +\
      \ 密码 = $OPENCODE_SERVER_PASSWORD；端口 2222）----\nif [ \"${OPENCODE_SSH_ENABLE:-true}\"\
      \ = \"true\" ] && command -v sshd >/dev/null 2>&1; then\n  mkdir -p /run/sshd\
      \ /root/.ssh/sshd\n  [ -f /root/.ssh/sshd/ssh_host_ed25519_key ] || ssh-keygen\
      \ -t ed25519 -f /root/.ssh/sshd/ssh_host_ed25519_key -N '' -q\n  if [ -n \"\
      ${OPENCODE_SERVER_PASSWORD:-}\" ]; then echo \"root:${OPENCODE_SERVER_PASSWORD}\"\
      \ | chpasswd || echo \"WARN: set root pw failed\" >&2; fi\n  printf '%s\\n'\
      \ 'Port 2222' 'ListenAddress 0.0.0.0' 'HostKey /root/.ssh/sshd/ssh_host_ed25519_key'\
      \ 'PermitRootLogin yes' 'PasswordAuthentication yes' 'KbdInteractiveAuthentication\
      \ no' 'UsePAM no' 'PidFile /tmp/sshd.pid' > /root/.ssh/sshd/sshd_config\n  /usr/sbin/sshd\
      \ -f /root/.ssh/sshd/sshd_config 2>/dev/null || echo 'WARN: sshd start failed'\
      \ >&2\nfi\n# ---- V100 免密（私钥 base64 由 env V100_SSH_KEY 注入；宿主机 authorized_keys\
      \ 已铺）----\nif [ -n \"${V100_SSH_KEY:-}\" ]; then\n  mkdir -p /root/.ssh && chmod\
      \ 700 /root/.ssh\n  echo \"${V100_SSH_KEY}\" | base64 -d > /root/.ssh/id_v100\
      \ 2>/dev/null && chmod 600 /root/.ssh/id_v100\n  printf '%s\\n' 'Host v100-0001'\
      \ '  HostName 1.94.192.234' '  User runner' '  IdentityFile ~/.ssh/id_v100'\
      \ '  StrictHostKeyChecking no' '  UserKnownHostsFile /dev/null' 'Host v100-0002'\
      \ '  HostName 114.116.228.0' '  User runner' '  IdentityFile ~/.ssh/id_v100'\
      \ '  StrictHostKeyChecking no' '  UserKnownHostsFile /dev/null' >> /root/.ssh/config\n\
      \  chmod 600 /root/.ssh/config\nfi\nexec opencode \"$@\"\n"
  kind: ConfigMap
  metadata:
    name: opencode-entrypoint
    namespace: opencode-xieyucheng
