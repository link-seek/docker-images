- apiVersion: v1
  data:
    entrypoint.sh: "#!/bin/sh\nset -eu\n# 只读根文件系统（securityContext.readOnlyRootFilesystem=true）：\n\
      # /root 由可写 emptyDir 承接（initContainer 已把镜像内 /root/. 拷入），系统目录只读；\n# /workspace、/root/.local/share/opencode（数据卷）、/tmp\
      \ 可写。\nexport TMPDIR=/tmp\n: \"${HOME:=/root}\"; export HOME\nif [ \"${PIPELINE_MANAGED:-}\"\
      \ != \"true\" ]; then\n  echo 'FATAL: .env not pipeline-managed (PIPELINE_MANAGED!=true).\
      \ Refusing to start.' >&2\n  exit 1\nfi\nif [ ! -d /workspace/.git ]; then\n\
      \  git init -b main /workspace >/dev/null 2>&1\n  git -C /workspace config user.name\
      \ opencode-team\n  git -C /workspace config user.email opencode-team@local\n\
      \  git -C /workspace commit --allow-empty -m init >/dev/null 2>&1\nfi\n# 组织记忆\
      \ trial：cognee 集中式（ClusterIP 集群内直达，无鉴权；隔离靠 dataset 约定）。\n# team 只用 trial-team（私库）+\
      \ org-settled（共享），不用 trial-yingxin。\n# 注意：opencode.json 由 opencode.jsonc 落盘，含\
      \ // 全行注释；json.load 直接读会炸，\n# 必须先剥注释再解析，否则 except 分支 d={} 会抹掉整份配置（白名单/模型全丢实锤）。\n\
      python3 - <<'PY' 2>/dev/null || true\nimport json, re\np='/root/.config/opencode/opencode.json'\n\
      raw=open(p).read() if __import__('os').path.exists(p) else '{}'\nraw=re.sub(r'^[\
      \ \\t]*//.*$', '', raw, flags=re.M)\ntry:\n    d=json.loads(raw)\nexcept Exception:\n\
      \    d={}\nm=d.setdefault('mcp',{}).setdefault('servers',{});\ncog={\"type\"\
      :\"remote\",\"url\":\"http://cognee.cognee-trial.svc.cluster.local:8000/mcp\"\
      ,\"oauth\":False,\"timeout\":{\"startup\":45000,\"catalog\":60000,\"execution\"\
      :600000}}\nif m.get('cognee')!=cog:\n    m['cognee']=cog\n    json.dump(d,open(p,'w'),indent=2)\n\
      \    print('cognee-mcp-injected')\nPY\n# obsutil 配置：env 全量（OBS_AK/OBS_SK 必填，OBS_ENDPOINT\
      \ 缺省华北九；密钥不进镜像）。\nif [ -n \"${OBS_AK:-}\" ] && [ -n \"${OBS_SK:-}\" ]; then\n\
      \  printf 'endpoint=%s\\nak=%s\\nsk=%s\\ntoken=\\n' \"${OBS_ENDPOINT:-https://obs.cn-north-9.myhuaweicloud.com}\"\
      \ \"$OBS_AK\" \"$OBS_SK\" > /root/.obsutilconfig\n  chmod 600 /root/.obsutilconfig\n\
      fi\n# ---- SSH server（root + 密码 = $OPENCODE_SERVER_PASSWORD；端口 2222）----\nif\
      \ [ \"${OPENCODE_SSH_ENABLE:-true}\" = \"true\" ] && command -v sshd >/dev/null\
      \ 2>&1; then\n  mkdir -p /run/sshd /root/.ssh/sshd\n  [ -f /root/.ssh/sshd/ssh_host_ed25519_key\
      \ ] || ssh-keygen -t ed25519 -f /root/.ssh/sshd/ssh_host_ed25519_key -N '' -q\n\
      \  if [ -n \"${OPENCODE_SERVER_PASSWORD:-}\" ]; then echo \"root:${OPENCODE_SERVER_PASSWORD}\"\
      \ | chpasswd || echo \"WARN: set root pw failed\" >&2; fi\n  printf '%s\\n'\
      \ 'Port 2222' 'ListenAddress 0.0.0.0' 'HostKey /root/.ssh/sshd/ssh_host_ed25519_key'\
      \ 'PermitRootLogin yes' 'PasswordAuthentication yes' 'KbdInteractiveAuthentication\
      \ no' 'UsePAM no' 'PidFile /tmp/sshd.pid' > /root/.ssh/sshd/sshd_config\n  /usr/sbin/sshd\
      \ -f /root/.ssh/sshd/sshd_config 2>/dev/null || echo 'WARN: sshd start failed'\
      \ >&2\nfi\n# ---- V100 免密（私钥 base64 由 env V100_SSH_KEY 注入；宿主机 authorized_keys\
      \ 已铺）----\nif [ -n \"${V100_SSH_KEY:-}\" ]; then\n  mkdir -p /root/.ssh && chmod\
      \ 700 /root/.ssh\n  echo \"${V100_SSH_KEY}\" | base64 -d > /root/.ssh/id_v100\
      \ 2>/dev/null && chmod 600 /root/.ssh/id_v100\n  printf '%s\\n' 'Host v100-0001'\
      \ '  HostName 1.94.192.234' '  User runner' '  IdentityFile ~/.ssh/id_v100'\
      \ '  StrictHostKeyChecking no' '  UserKnownHostsFile /dev/null' 'Host v100-0002'\
      \ '  HostName 114.116.228.0' '  User runner' '  IdentityFile ~/.ssh/id_v100'\
      \ '  StrictHostKeyChecking no' '  UserKnownHostsFile /dev/null' >> /root/.ssh/config\n\
      \  chmod 600 /root/.ssh/config\nfi\nexec opencode \"$@\"\n"
  kind: ConfigMap
  metadata:
    name: opencode-entrypoint
    namespace: opencode-team
