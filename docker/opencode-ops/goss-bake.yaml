# opencode-ops 成品自检（dgoss）
# 只验 ops 线实际依赖：opencode、本地记忆插件、kubectl。
command:
  opencode-version:
    exec: "opencode --version"
    exit-status: 0

  opencode-mem-configured:
    exec: "grep -q 'opencode-mem' /root/.config/opencode/opencode.json"
    exit-status: 0

  opencode-mem-installed:
    exec: "sh -c 'ls -d /root/.cache/opencode/npm/opencode-mem@* >/dev/null'"
    exit-status: 0

  kubectl:
    exec: "kubectl version --client"
    exit-status: 0
