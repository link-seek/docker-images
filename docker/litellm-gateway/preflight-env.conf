# docker/litellm-gateway/preflight-env.conf — k3d 预检 Secret 模板。
# 占位由 bake-stack.yml 注入：__LITELLM_API_KEY__（真 key，备用）、__SMTP_PASS__（骨架强制要求）。
# 网关 secret（litellm-env）只需两 key：TS_JOIN_KEY 走 dummy（预检 command 覆盖掉 entrypoint，不跑 tailscale up）；
# LITELLM_MASTER_KEY 走 dummy（细测用同一 key 调 /v1/models，鉴权自洽；models 列表不调上游）。
LITELLM_API_KEY=__LITELLM_API_KEY__
TS_JOIN_KEY=dummy-preflight
LITELLM_MASTER_KEY=dummy-preflight
SMTP_PASS=__SMTP_PASS__
