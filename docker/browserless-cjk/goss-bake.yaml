# browserless-cjk 成品自检（dgoss）：服务能起 + /pressure 通（TOKEN 鉴权走 goss_docker_args 注入）。
# 检查跑在 runner 侧：goss_docker_args 带 --network host，容器 3000 即宿主机 3000。
# browserless 首次启动要拉 Chrome（约 tens of seconds），自检内自带轮询；
# 不依赖 validate 层重试（tools 线从未 exercised 过 server-ready 等待）。
# TAG 由 bake-browserless-cjk.yml 经 --vars 注入（仅审计展示，不做版本断言）。
command:
  pressure:
    exec: 'for i in $(seq 1 24); do curl -fsS "http://127.0.0.1:3000/pressure?token=goss-ci-token" | grep -q pressure && exit 0; sleep 5; done; exit 1'
    exit-status: 0
    timeout: 150000

  cjk-fonts:
    exec: "fc-list | grep -ci 'noto.*cjk'"
    exit-status: 0
