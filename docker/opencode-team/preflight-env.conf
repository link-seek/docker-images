# docker/opencode-team/preflight-env.conf — k3d 预检 Secret 模板（opencode-team-env）。
# 占位由 bake-stack.yml 注入：__LITELLM_API_KEY__（真 key）、__SMTP_PASS__（真 163 授权码，ENV_SMTP_PASS 缺失直接红）。
# 其余走 dummy：预检只不断言 tailscale/CF，只需 secretKeyRef 能解出来让 pod 起得来。
# BROWSERLESS_TOKEN Dummy 与细测 hook 内写死的 token 一致（同 Secret 两边同值，CDP 鉴权通）。
LITELLM_API_KEY=__LITELLM_API_KEY__
GH_TOKEN=dummy-preflight
OPENCODE_SERVER_PASSWORD=dummy-preflight
CLOUDFLARE_API_TOKEN=dummy-preflight
CF_AI_TOKEN=dummy-preflight
SMTP_PASS=__SMTP_PASS__
BROWSERLESS_TOKEN=dummy-preflight
MAAS_KEY=dummy-preflight
