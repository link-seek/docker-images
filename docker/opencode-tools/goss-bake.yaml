# opencode-tools 成品自检（dgoss，pin v0.4.10）。
# 用法：GOSS_FILE=goss-bake.yaml GOSS_VARS=<vars> dgoss run ... <image> serve ...
# TAG / MEM_PIN 由 bake-tools.yml 经 --vars 注入，避免版本号在仓内两处手抄。
# entrypoint/cmd 验 /proc/1/cmdline（PID 1 = 镜像入口，dgoss 起的 serve 进程）。

command:
  opencode-version:
    exec: "opencode --version"
    exit-status: 0
    stdout:
      - '{{ .Vars.TAG }}'

  node:
    exec: "node --version"
    exit-status: 0

  gh:
    exec: "gh --version"
    exit-status: 0

  agent-browser:
    exec: "agent-browser --version"
    exit-status: 0

  tailscale:
    exec: "tailscale version"
    exit-status: 0

  tailscaled:
    exec: "tailscaled --version"
    exit-status: 0

  terraform:
    exec: "terraform version"
    exit-status: 0

  send-mail:
    exec: "send-mail --help"
    exit-status: 0
    stdout:
      - '-m'

  send-mail-missing-config:
    exec: "env -u SMTP_HOST -u SMTP_USER -u SMTP_PASS -u SMTP_FROM -u MAIL_DEFAULT_TO send-mail no-one@example.com subj body"
    exit-status: 2
    stderr:
      - '缺少邮件配置'

  fetch-mail:
    exec: "fetch-mail --help"
    exit-status: 0
    stdout:
      - 'list'

  fetch-mail-missing-config:
    exec: "env -u IMAP_USER -u IMAP_PASS -u SMTP_USER -u SMTP_PASS fetch-mail list"
    exit-status: 2
    stderr:
      - '缺少邮件配置'

  fetch-mail-imap-tls:
    exec: "timeout 20 python3 -c \"import socket,ssl; s=socket.create_connection(('imap.163.com',993),timeout=12); ss=ssl.create_default_context().wrap_socket(s,server_hostname='imap.163.com'); print('TLS-OK', ss.version()); ss.close()\""
    exit-status: 0
    stdout:
      - 'TLS-OK'

  md2html:
    exec: "python3 /usr/local/lib/send-mail/md2html.py"
    exit-status: 2

  md2html-convert:
    exec: "printf '# T\\n\\n| a | b |\\n|---|---|\\n| 1 | 2 |\\n\\n> q\\n' > /tmp/goss-md-test.md && python3 /usr/local/lib/send-mail/md2html.py /tmp/goss-md-test.md /tmp/goss-md-test.html && grep -c 'style=\"' /tmp/goss-md-test.html"
    exit-status: 0

  design-skill:
    exec: "test -f /root/.agents/skills/open-design/SKILL.md && grep -c prepare_open_design_brief /root/.agents/skills/open-design/SKILL.md"
    exit-status: 0

  design-browser:
    exec: "chrome-headless-shell --version"
    exit-status: 0
    stdout:
      - 'Chrome'

  design-mcp-wired:
    exec: "opencode debug config"
    exit-status: 0
    timeout: 180000
    stdout:
      - 'open-design'

  msmtp:
    exec: "msmtp --version"
    exit-status: 0

file:
  /root/.config/opencode/opencode.json:
    exists: true
    contents:
      - 'opencode-mem@{{ .Vars.MEM_PIN }}'
      - '@feimacode/open-design-agent-kit-mcp'

  /root/.agents/skills/open-design/SKILL.md:
    exists: true

  /usr/local/bin/chrome-headless-shell:
    exists: true

  /root/.config/opencode/opencode-mem.jsonc:
    exists: true
    contents:
      - '/"autoUpdate": *false/'

  /proc/1/cmdline:
    exists: true
    contents:
      - 'opencode'
      - 'serve'
