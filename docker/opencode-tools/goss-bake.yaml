# opencode-tools 成品自检（dgoss，pin v0.4.10）。
# 用法：GOSS_FILE=goss-bake.yaml GOSS_VARS=<vars> dgoss run ... <image> serve ...
# TAG / MEM_PIN 由 bake-tools.yml 经 --vars 注入，避免版本号在仓内两处手抄。
# entrypoint/cmd 验 /proc/1/cmdline（PID 1 = 镜像入口，dgoss 起的 serve 进程）。

command:
  opencode-version:
    exec: "opencode --version"
    exit-status: 0
    stdout:
      - '{{ .Vars.TAG }}'

  node:
    exec: "node --version"
    exit-status: 0

  gh:
    exec: "gh --version"
    exit-status: 0

  agent-browser:
    exec: "agent-browser --version"
    exit-status: 0

  tailscale:
    exec: "tailscale version"
    exit-status: 0

  tailscaled:
    exec: "tailscaled --version"
    exit-status: 0

  kubectl:
    exec: "kubectl version --client"
    exit-status: 0

  flux:
    exec: "flux --version"
    exit-status: 0

  cloudrobo-cli:
    exec: "cloudrobo --version"
    exit-status: 0
    stdout:
      - 'cloudrobo, version'

  cloudrobo-groups:
    exec: "cloudrobo --help"
    exit-status: 0
    stdout:
      - 'workspace'
      - 'robot'
      - 'config'

  cloudrobo-sdk:
    exec: "python3 -c \"from cloudrobo_core.sdk import Config, HttpClient; Config(); print('sdk-ok')\""
    exit-status: 0
    stdout:
      - 'sdk-ok'

  send-mail:
    exec: "send-mail --help"
    exit-status: 0
    stdout:
      - '-m'

  send-mail-missing-config:
    exec: "env -u SMTP_HOST -u SMTP_USER -u SMTP_PASS -u SMTP_FROM -u MAIL_DEFAULT_TO send-mail no-one@example.com subj body"
    exit-status: 2
    stderr:
      - '缺少邮件配置'

  fetch-mail:
    exec: "fetch-mail --help"
    exit-status: 0
    stdout:
      - 'list'

  fetch-mail-missing-config:
    exec: "env -u IMAP_USER -u IMAP_PASS -u SMTP_USER -u SMTP_PASS fetch-mail list"
    exit-status: 2
    stderr:
      - '缺少邮件配置'

  fetch-mail-imap-tls:
    # goss 默认 10s 会先杀掉；命令内部已限 12s，这里放宽到 30s（外部网络，别误判成回归）
    exec: "timeout 20 python3 -c \"import socket,ssl; s=socket.create_connection(('imap.163.com',993),timeout=12); ss=ssl.create_default_context().wrap_socket(s,server_hostname='imap.163.com'); print('TLS-OK', ss.version()); ss.close()\""
    exit-status: 0
    timeout: 30000
    stdout:
      - 'TLS-OK'
  tssh:
    exec: "tssh --help"
    exit-status: 0
    stdout:
      - 'tssh'

  tssh-no-key:
    exec: "env TSSH_KEY=/tmp/definitely-missing-tssh-key tssh dummyhost -- echo hi"
    exit-status: 2
    stderr:
      - '缺少私钥'

  tssh-dry-run-opts:
    exec: "ssh-keygen -t ed25519 -N '' -f /tmp/goss-tssh-key -q && TSSH_KEY=/tmp/goss-tssh-key tssh --dry-run somehost -- echo hi"
    exit-status: 0
    stdout:
      - 'BatchMode=yes'
      - 'PasswordAuthentication=no'
      - 'IdentitiesOnly=yes'
      - 'StrictHostKeyChecking=accept-new'
      - 'ConnectTimeout=10'
      - '-p 22'

  tssh-dry-run-port:
    # 自备 key：goss 用例间不共享 /tmp 状态（并行度不可假设）
    exec: "ssh-keygen -t ed25519 -N '' -f /tmp/goss-tssh-key2 -q && TSSH_KEY=/tmp/goss-tssh-key2 tssh -p 2222 --dry-run somehost -- uptime"
    exit-status: 0
    stdout:
      - '-p 2222'



  md2html:
    exec: "python3 /usr/local/lib/send-mail/md2html.py"
    exit-status: 2

  md2html-convert:
    exec: "printf '# T\\n\\n| a | b |\\n|---|---|\\n| 1 | 2 |\\n\\n> q\\n' > /tmp/goss-md-test.md && python3 /usr/local/lib/send-mail/md2html.py /tmp/goss-md-test.md /tmp/goss-md-test.html && grep -c 'style=\"' /tmp/goss-md-test.html"
    exit-status: 0

  design-skill:
    exec: "test -f /root/.agents/skills/open-design/SKILL.md && grep -c prepare_open_design_brief /root/.agents/skills/open-design/SKILL.md"
    exit-status: 0

  design-browser-removed:
    # 本地 chrome 已删（CDP sidecar 代替）：wrapper 必须不存在，防止旧层残留
    exec: "test ! -e /usr/local/bin/chrome-headless-shell && test ! -e /usr/local/bin/chrome-headless-shell.real && echo removed"
    exit-status: 0
    stdout:
      - 'removed'

  mem-pin-versioned:
    exec: "grep -E '\"opencode-mem@[0-9]+\\.[0-9]+\\.[0-9]+\"' /root/.config/opencode/opencode.json"
    exit-status: 0

  mem-plugin-tree:
    exec: "test -f /root/.cache/opencode/npm/opencode-mem@*/0/node_modules/opencode-mem/dist/plugin.js && echo tree-ok"
    exit-status: 0
    stdout:
      - 'tree-ok'

  mem-plugin-loaded:
    exec: "opencode plugin check 2>&1 | grep -E 'opencode-mem.*current'"
    exit-status: 0
    timeout: 90000
    stdout:
      - 'current'

  design-mcp-wired:
    exec: "opencode debug config"
    exit-status: 0
    timeout: 180000
    stdout:
      - 'open-design'
      - 'open-design-mcp'

  design-mcp-binary:
    exec: "command -v open-design-mcp"
    exit-status: 0
    stdout:
      - 'open-design-mcp'

  design-mcp-startup:
    exec: "timeout 25 open-design-mcp --help"
    exit-status: 0
    timeout: 60000
    stderr:
      - '[open-design]'

  msmtp:
    exec: "msmtp --version"
    exit-status: 0

  ssh:
    exec: "command -v ssh"
    exit-status: 0
    stdout:
      - '/usr/bin/ssh'

  sshpass:
    exec: "sshpass -V"
    exit-status: 0
    stdout:
      - 'sshpass'

file:
  /root/.config/opencode/opencode.json:
    exists: true
    contents:
      - 'open-design-mcp'

  /root/.agents/skills/open-design/SKILL.md:
    exists: true


  /root/.config/opencode/opencode-mem.jsonc:
    exists: true
    contents:
      - '/"autoUpdate": *false/'

  /proc/1/cmdline:
    exists: true
    contents:
      - 'opencode'
      - 'serve'
