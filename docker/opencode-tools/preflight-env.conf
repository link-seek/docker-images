# docker/opencode-tools/preflight-env.conf — k3d 预检 Secret 模板（#505）。
# 占位由 bake-stack.yml 注入：__LITELLM_API_KEY__（真 key，模型用例备用）、__SMTP_PASS__（真 163 授权码，mail 用例）、
# 说明：OCI 标识符在 manifest 明文；预检 secret 不装 OCI（探针直用 step env）。
# 其余走 dummy：预检不断言 tailscale/CF/HCLOUD，只需 secretKeyRef 能解出来让 pod 起得来。
LITELLM_API_KEY=__LITELLM_API_KEY__
GH_TOKEN=dummy-preflight
OPENCODE_SERVER_PASSWORD=dummy-preflight
CLOUDFLARE_API_TOKEN=dummy-preflight
CF_AI_TOKEN=dummy-preflight
HCLOUD_AK=dummy-preflight
HCLOUD_SK=dummy-preflight
TS_JOIN_KEY=dummy-preflight
SMTP_PASS=__SMTP_PASS__
# 2026-11-23 起 opencode-xieyucheng 的 BROWSER_CDP_URL 引用 BROWSERLESS_TOKEN（独立 browserless Pod），
# 预检只需能解出来让 pod 起得来（预检 browserless 副本置 0，不做 browser e2e）。
BROWSERLESS_TOKEN=dummy-preflight
# 以下三项是生产 manifest（k8s/opencode-xieyucheng）引用到的 key；预检只要求能解出来让 pod 起得来，
# 真伪由骨架 runner 侧探针（ALI_*/OCI_*）覆盖，pod 内不跑对应用例时用 dummy/真值皆可。
ALIBABACLOUD_ACCESS_KEY_ID=__ALI_AK__
ALIBABACLOUD_ACCESS_KEY_SECRET=__ALI_SK__
OCI_CLI_KEY_CONTENT=dummy-preflight
